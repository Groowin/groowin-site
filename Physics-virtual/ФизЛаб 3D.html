<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ФизЛаб 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=STIX+Two+Text:ital,wght@0,400;0,600;1,400;1,600&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: one full-screen 3D stage; menu panel left, controls panel right, both hideable; theory card opens before each lab */
:root{
  --bg1:#0d1b2a; --bg2:#2a5266; --panel:rgba(13,27,40,.86); --soft:rgba(255,255,255,.07);
  --line:rgba(255,255,255,.15); --fg:#e9f0f6; --mut:#9fb2c2; --acc:#5ad1c0; --acc2:#f2b66d; --accfg:#06231f; --ok:#8fe3a8; --veil:rgba(8,14,22,.58);
  --display:'Unbounded','Rubik',system-ui,sans-serif; --body:'IBM Plex Sans',system-ui,sans-serif; --mono:'IBM Plex Mono',ui-monospace,monospace; --math:'STIX Two Text','Cambria Math','Latin Modern Math',serif;
  color-scheme:dark;
}
:root[data-pal="meadow"]{--bg1:#bfe0ee;--bg2:#e1eed0;--panel:rgba(252,253,247,.93);--soft:rgba(40,70,50,.07);--line:rgba(40,70,50,.18);--fg:#22302a;--mut:#5a6d62;--acc:#2f7f5f;--acc2:#a35b25;--accfg:#ffffff;--ok:#1f7a45;--veil:rgba(235,244,230,.68);color-scheme:light}
:root[data-pal="sand"]{--bg1:#f3e2c4;--bg2:#ead7ae;--panel:rgba(255,251,242,.93);--soft:rgba(90,60,20,.07);--line:rgba(90,60,20,.18);--fg:#3a2f22;--mut:#7a6a55;--acc:#a85a18;--acc2:#2f7f73;--accfg:#ffffff;--ok:#2b7a45;--veil:rgba(247,236,214,.7);color-scheme:light}
:root[data-pal="sky"]{--bg1:#cfe6f5;--bg2:#e9f3fa;--panel:rgba(253,254,255,.93);--soft:rgba(30,60,90,.07);--line:rgba(30,60,90,.18);--fg:#1e2d3a;--mut:#566a7a;--acc:#1f7aa8;--acc2:#b3562c;--accfg:#ffffff;--ok:#1e7a4a;--veil:rgba(228,240,249,.7);color-scheme:light}
:root[data-pal="paper"]{--bg1:#f1f4f8;--bg2:#c4d4e4;--panel:rgba(255,255,255,.9);--soft:rgba(20,40,60,.06);--line:rgba(20,40,60,.17);--fg:#1c2833;--mut:#566779;--acc:#1b7a8c;--acc2:#bf5a2a;--accfg:#ffffff;--ok:#1d8a4a;--veil:rgba(236,241,247,.62);color-scheme:light}
:root[data-pal="sea"]{--bg1:#072238;--bg2:#117190;--panel:rgba(6,31,53,.86);--acc:#7be0ff;--acc2:#ffd479;--accfg:#042333;--veil:rgba(3,16,28,.58)}
:root[data-pal="forest"]{--bg1:#10261a;--bg2:#356445;--panel:rgba(14,32,22,.86);--acc:#9be38a;--acc2:#f0c36a;--accfg:#0d2412;--veil:rgba(5,16,10,.58)}
:root[data-pal="dusk"]{--bg1:#1c1632;--bg2:#5d3d66;--panel:rgba(28,21,48,.86);--acc:#ffb38a;--acc2:#8fd0ff;--accfg:#2b1409;--veil:rgba(12,8,24,.6)}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg1);color:var(--fg);font:14px/1.5 var(--body)}
button,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
#app{position:fixed;inset:0;background:linear-gradient(180deg,var(--bg1),var(--bg2));
  --gl:max(16px,env(safe-area-inset-left,0px));--gr:max(16px,env(safe-area-inset-right,0px));
  --gt:calc(env(safe-area-inset-top,0px) + 12px);--gb:calc(env(safe-area-inset-bottom,0px) + 14px);--bh:48px}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
.bar{position:absolute;left:var(--gl);right:var(--gr);top:var(--gt);display:flex;flex-wrap:wrap;gap:8px;align-items:center;pointer-events:none;z-index:6}
.bar>*{pointer-events:auto}
.btn{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:8px 14px;font:500 13px var(--body);backdrop-filter:blur(10px)}
.btn:hover{border-color:var(--acc)}
.btn.on{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
.btn.big{padding:12px 26px;font-size:15px;border-radius:12px}
.ttl{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:5px 14px;backdrop-filter:blur(10px);min-width:0;flex:0 1 auto}
.ttl small{display:block;font:500 10px var(--mono);letter-spacing:.1em;color:var(--mut);text-transform:uppercase}
.ttl b{display:block;font:600 13px/1.25 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sp{flex:1 1 0;min-width:0}
.side{position:absolute;top:calc(var(--gt) + var(--bh) + 10px);bottom:var(--gb);width:min(356px,calc(100vw - 32px));background:var(--panel);border:1px solid var(--line);border-radius:16px;backdrop-filter:blur(16px);z-index:5;display:flex;flex-direction:column;overflow:hidden;transition:transform .28s ease,opacity .22s}
.side.left{left:var(--gl)}
.side.right{right:var(--gr)}
.side.left.hide{transform:translateX(calc(-100% - 40px));opacity:0;pointer-events:none}
.side.right.hide{transform:translateX(calc(100% + 40px));opacity:0;pointer-events:none}
.pane{overflow-y:auto;padding:16px;flex:1;min-height:0}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:transparent;border:0;border-bottom:2px solid transparent;padding:12px 6px;font:500 13px var(--body);color:var(--mut)}
.tabs button[aria-selected="true"]{color:var(--fg);border-bottom-color:var(--acc)}
.ctrl{margin-bottom:14px}
.ctrl label{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--mut)}
.ctrl output{font:500 13px var(--mono);color:var(--fg);white-space:nowrap}
.ctrl input[type=range]{width:100%;margin:8px 0 0;accent-color:var(--acc)}
.ctrl select{width:100%;margin-top:6px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:8px 10px;color:var(--fg)}
.ctrl select option{color:#111}
.reads{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.read{background:var(--soft);border-radius:10px;padding:8px 10px;min-width:0}
.read span{display:block;font-size:11px;color:var(--mut);line-height:1.25}
.read b{display:block;font:500 16px/1.3 var(--mono);color:var(--acc);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.read b i{font:400 11px var(--mono);font-style:normal;color:var(--mut);margin-left:4px}
.read.wide{grid-column:1/-1}
.pane h4{margin:0 0 8px;font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--acc2)}
.pane p{margin:0 0 10px}
.given{background:var(--soft);border-radius:10px;padding:8px 12px;margin:0 0 10px}
.given math{display:block}
.step{padding:6px 0 6px 12px;border-left:2px solid var(--line);margin-bottom:4px;overflow-x:auto}
.ans{padding:8px 12px;border-left:3px solid var(--ok);background:var(--soft);border-radius:0 10px 10px 0;margin-top:8px;overflow-x:auto}
.pane ul{margin:0;padding-left:18px}
.pane li{margin-bottom:8px}
math{font-family:var(--math);font-size:1.18em}
math[display="block"]{display:block;margin:.35em 0}
.live{position:absolute;left:50%;transform:translateX(-50%);bottom:var(--gb);max-width:calc(100vw - 32px);background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:8px 20px;backdrop-filter:blur(12px);z-index:3;pointer-events:none;overflow-x:auto;font-size:15px;white-space:nowrap}
.live:empty{display:none}
.menu h5{margin:16px 0 8px;font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--acc2)}
.menu h5:first-child{margin-top:0}
.item{display:block;width:100%;text-align:left;background:var(--soft);border:1px solid transparent;border-radius:10px;padding:9px 12px;margin-bottom:6px;font-size:14px}
.item:hover{border-color:var(--line)}
.item[aria-current="true"]{border-color:var(--acc);background:transparent;color:var(--acc);font-weight:600}
.item.ghost{background:transparent;border:1px dashed var(--line);color:var(--mut);cursor:default}
.secs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.secs button{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--mut);background:transparent}
.secs button:hover:not(:disabled){border-color:var(--acc)}
.secs button.on{background:var(--acc);border-color:var(--acc);color:var(--accfg);font-weight:600}
.secs button:disabled{opacity:.5;cursor:default}
.note{font-size:12px;color:var(--mut);margin:4px 0 0}
.pop{position:absolute;top:calc(var(--gt) + var(--bh) + 10px);right:var(--gr);z-index:12;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;backdrop-filter:blur(16px);display:grid;gap:6px;min-width:190px}
.pop button{display:flex;align-items:center;gap:10px;background:var(--soft);border:1px solid transparent;border-radius:10px;padding:8px 10px;text-align:left}
.pop button[aria-pressed="true"]{border-color:var(--acc)}
.pop i{display:inline-block;width:34px;height:20px;border-radius:6px;border:1px solid var(--line)}
.intro{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;padding:var(--gt) var(--gr) var(--gb) var(--gl);background:var(--veil);backdrop-filter:blur(10px)}
.intro .card{width:100%;max-width:1000px;max-height:100%;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:30px;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:10px 34px}
.intro .col{min-width:0}
.gtag{display:inline-block;font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;border:1px solid var(--acc);color:var(--acc);border-radius:999px;padding:3px 12px}
.intro h2{margin:14px 0 10px;font:600 clamp(24px,4vw,40px)/1.1 var(--display)}
.intro h6{margin:20px 0 8px;font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--acc2)}
.intro h6:first-of-type{margin-top:0}
.intro p{margin:0;max-width:60ch;font-size:15px}
.vt{border-collapse:collapse;width:100%}
.vt td{padding:6px 10px 6px 0;border-bottom:1px solid var(--line);vertical-align:middle}
.vt td:first-child{width:60px}
.vt td:last-child{color:var(--mut);text-align:right}
.fm{display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--soft);border-radius:12px;padding:6px 16px;margin-bottom:8px;overflow-x:auto}
.fm math{font-size:1.5em;margin:.2em 0}
.fm span{color:var(--mut);font-size:12px;text-align:right}
.sci{margin-top:6px;border-left:3px solid var(--acc);padding-left:14px}
.sci b{font:600 17px var(--display);display:block}
.sci i{font:500 13px var(--mono);color:var(--acc);font-style:normal;display:block;margin:2px 0 8px}
.sci p{font-size:14px;color:var(--mut)}
.foot{grid-column:1/-1;display:flex;justify-content:flex-end;gap:10px;margin-top:8px}

.hint{position:absolute;left:50%;transform:translateX(-50%);top:calc(var(--gt) + var(--bh) + 10px);z-index:4;background:var(--acc);color:var(--accfg);font:600 13px var(--body);padding:7px 18px;border-radius:999px;box-shadow:0 6px 24px rgba(0,0,0,.25);pointer-events:none;max-width:calc(100vw - 32px);text-align:center}
.ctrl .top{display:flex;justify-content:space-between;align-items:center;gap:10px}
.ctrl .top span{font-size:13px;color:var(--mut);min-width:0}
.ctrl .num{display:flex;align-items:center;gap:5px;flex:none}
.ctrl .num input{width:74px;background:var(--soft);border:1px solid var(--line);border-radius:8px;padding:4px 8px;color:var(--fg);font:500 13px var(--mono);text-align:right}
.ctrl .num input:focus{border-color:var(--acc);outline:none}
.ctrl .num em{font:400 11px var(--mono);font-style:normal;color:var(--mut);min-width:26px}
.pane{scrollbar-width:thin;scrollbar-color:var(--line) transparent}
[hidden]{display:none!important}

.home{position:absolute;inset:0;z-index:30;overflow-y:auto;background:linear-gradient(180deg,var(--bg1) 0%,var(--bg2) 56%,#9cc482 56.2%,#86b06f 100%);padding:max(20px,env(safe-area-inset-top)) var(--gr) 28px var(--gl);color:var(--fg)}
.home .wrap{max-width:1180px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:22px}
.home .top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.logo{font:800 22px var(--display);letter-spacing:.02em}.logo span{color:var(--acc2)}
.pill{font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;border:1.5px solid var(--fg);border-radius:999px;padding:5px 14px}
.hero{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:center}
.hero h1{margin:0;font:800 clamp(40px,8vw,104px)/.95 var(--display);letter-spacing:-.035em}
.hero p{margin:18px 0 22px;font-size:clamp(16px,2vw,22px);line-height:1.4;max-width:30em;opacity:.85}
.hero svg{width:100%;height:auto;max-height:46vh}
.cta{display:flex;flex-wrap:wrap;gap:10px}
.sec6{display:flex;flex-wrap:wrap;gap:8px}
.sec6 button{padding:7px 16px;border-radius:999px;font-weight:500;font-size:15px;background:rgba(255,255,255,.6);border:1px solid rgba(28,43,34,.25);color:#1c2b22}
.sec6 button:hover:not(:disabled){border-color:var(--acc)}
.sec6 button.on{background:var(--acc);border-color:var(--acc);color:var(--accfg)}
.sec6 button:disabled{opacity:.55;cursor:default}
.gr3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px 16px;backdrop-filter:blur(10px)}
.gcard h3{margin:0 0 8px;font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--acc2)}
.gcard button{display:inline-block;margin:0 6px 6px 0;background:var(--soft);border:1px solid transparent;border-radius:999px;padding:5px 12px;font-size:13px}
.gcard button:hover{border-color:var(--acc);color:var(--acc)}
@media (max-width:860px){.hero{grid-template-columns:minmax(0,1fr)}.hero svg{max-height:30vh}}
@media (max-width:860px){
  .intro .card{grid-template-columns:minmax(0,1fr);padding:20px}
  .live{font-size:13px;padding:6px 14px}
}
@media (prefers-reduced-motion:reduce){.side{transition:none}}
.pt{font-size:15px;line-height:1.55}
.ans{display:flex;align-items:center;gap:8px;margin:8px 0}
.ans input{flex:1;min-width:0;background:var(--soft);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font:500 16px var(--mono);color:var(--fg)}
.ans span{color:var(--mut);font:500 13px var(--mono)}
.pane .acts{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.good{color:var(--ok);font-weight:600;margin:6px 0 2px}.bad{color:#f4a1a1;font-weight:600;margin:6px 0 2px}
.sol{background:var(--soft);border-radius:10px;padding:8px 12px;margin:6px 0;font:400 13px/1.5 var(--mono)}
.opts{display:grid;gap:8px;margin:8px 0}
.opt{text-align:left;background:var(--soft);color:var(--fg);border:1px solid var(--line);border-radius:12px;padding:10px 14px;font:500 14px var(--body)}
.opt:hover:not(:disabled){border-color:var(--acc)}
.opt.right{background:var(--ok);color:var(--accfg);border-color:var(--ok)}
.opt.wrong{border-color:#f4a1a1;box-shadow:inset 0 0 0 1px #f4a1a1}
.sc{color:var(--ok);font:500 11px var(--mono);margin-left:6px}
.item.quiz{color:var(--acc2)}
</style>

<div id="app">
  <canvas id="gl" aria-label="3D зертхана"></canvas>
  <header class="bar" id="bar">
    <button class="btn" id="bHome" type="button">ФизЛаб</button>
    <button class="btn" id="bMenu" type="button">Мәзір</button>
    <div class="ttl"><small id="tGrade"></small><b id="tName"></b></div>
    <span class="sp"></span>
    <button class="btn" id="bTheory" type="button">Теория</button>
    <button class="btn" id="bPause" type="button">Тоқтату</button>
    <button class="btn" id="bReset" type="button">Қайта</button>
    <button class="btn" id="bTheme" type="button">Түс</button>
    <button class="btn" id="bPanel" type="button">Панель</button>
  </header>
  <aside class="side left" id="left" aria-label="Мәзір"><div class="pane menu" id="menu"></div></aside>

      <button type="button" role="tab" aria-selected="true" data-t="ctl">Басқару</button>
      <button type="button" role="tab" aria-selected="false" data-t="exp">Түсіндіру</button>
      <button type="button" role="tab" aria-selected="false" data-t="prob" id="tProb">Есеп</button>
    </div>
    <div class="pane" id="pCtl"><div id="ctrls"></div><div class="reads" id="reads"></div></div>
    <div class="pane" id="pExp" hidden></div>
    <div class="pane" id="pProb" hidden></div>
  </aside>
  <section class="home" id="home"><div class="wrap">
    <div class="top"><div class="logo">ФИЗ<span>ЛАБ</span> 3D</div><span class="pill">7–11 сынып</span></div>
    <div class="hero"><div><h1>Физиканы<br>көр. Ұста. Өлше.</h1><p>Допты лақтыр, блокты тарт, маятникті ауытқыт. Формула сол сәтте сандармен өзгереді.</p><div class="cta"><button class="btn big on" id="hGo" type="button">Зертхананы ашу</button><button class="btn big" id="hList" type="button">Барлық тақырыптар</button></div></div><svg viewBox="0 0 712 380" role="img" aria-label="Параболамен ұшқан доп, көлбеу жазықтықтағы блок және маятник"><circle cx="610" cy="60" r="44" fill="#f6e7a8"/><polygon points="400,362 700,362 700,222" fill="#8a6a48"/><polygon points="400,362 700,362 700,350 400,350" fill="#6e5238"/><g transform="translate(572 270) rotate(-26.2)"><rect x="-34" y="-50" width="68" height="50" rx="6" fill="#d9825b"/><rect x="-34" y="-50" width="68" height="12" rx="5" fill="#e9a07c"/></g><line x1="572" y1="246" x2="536" y2="176" stroke="#22302a" stroke-width="4" stroke-linecap="round"/><polygon points="529,188 535,172 548,182" fill="#22302a"/><path d="M40 362 Q200 -10 410 340" fill="none" stroke="#2f7f5f" stroke-width="5" stroke-linecap="round" stroke-dasharray="1 14"/><circle cx="40" cy="362" r="18" fill="#6b7b71"/><rect x="20" y="344" width="60" height="22" rx="10" fill="#4a5a50" transform="rotate(-50 40 362)"/><circle cx="226" cy="98" r="22" fill="#d9825b"/><circle cx="218" cy="90" r="7" fill="#f2b896"/><line x1="226" y1="98" x2="300" y2="90" stroke="#22302a" stroke-width="4" stroke-linecap="round"/><polygon points="294,80 312,90 294,100" fill="#22302a"/><line x1="120" y1="30" x2="230" y2="30" stroke="#4a5a50" stroke-width="6" stroke-linecap="round"/><line x1="175" y1="30" x2="124" y2="132" stroke="#4a5a50" stroke-width="2.5"/><circle cx="118" cy="142" r="18" fill="#6f8fc4"/><text x="324" y="86" font-family="STIX Two Text,serif" font-style="italic" font-weight="600" font-size="32" fill="#22302a">v</text><text x="556" y="168" font-family="STIX Two Text,serif" font-style="italic" font-weight="600" font-size="30" fill="#22302a">F</text></svg></div>
    <div class="sec6" id="hSec"></div>
    <div class="gr3" id="hGr"></div>
  </div></section>
  <div class="hint" id="hint" hidden></div>
  <div class="live" id="live"></div>
  <div class="pop" id="pop" hidden></div>
  <section class="intro" id="intro" hidden></section>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script><script>
'use strict';
var T=THREE,PI=Math.PI,G=9.8,R=String.raw;
function f(n,d){d=(d==null)?1:d;return Number(n).toFixed(d).replace('.',',').replace('-','−');}
function clamp(x,a,b){return Math.max(a,Math.min(b,x));}

/* ---------- tex-lite to MathML ---------- */
var GREEK={alpha:'α',beta:'β',gamma:'γ',delta:'δ',Delta:'Δ',mu:'μ',rho:'ρ',pi:'π',omega:'ω',Omega:'Ω',theta:'θ',varphi:'φ',lambda:'λ',nu:'ν',tau:'τ',eta:'η',sigma:'σ',epsilon:'ε'};
function tex(s,block){
  var i=0;
  function group(){i++;var r=seq('}');i++;return '<mrow>'+r+'</mrow>';}
  function seq(end){var o='';while(i<s.length&&s[i]!==end){if(s[i]===' '){i++;continue;}o+=post(atom());}return o;}
  function script(){return s[i]==='{'?group():atom();}
  function post(b){
    var sb=null,sp=null;
    while(s[i]==='_'||s[i]==='^'){var t=s[i++];var a=script();if(t==='_')sb=a;else sp=a;}
    if(sb&&sp)return '<msubsup>'+b+sb+sp+'</msubsup>';
    if(sb)return '<msub>'+b+sb+'</msub>';
    if(sp)return '<msup>'+b+sp+'</msup>';
    return b;
  }
  function atom(){
    var c=s[i];
    if(c==='{')return group();
    if(c==='\\'){
      var j=i+1;while(j<s.length&&/[A-Za-z]/.test(s[j]))j++;
      if(j===i+1){var ch=s[i+1];i+=2;return ch===','?'<mspace width="0.17em"></mspace>':ch===';'?'<mspace width="0.35em"></mspace>':'<mo>'+ch+'</mo>';}
      var nm=s.slice(i+1,j);i=j;
      if(nm==='frac'){var a=group(),b=group();return '<mfrac>'+a+b+'</mfrac>';}
      if(nm==='sqrt'){return '<msqrt>'+group()+'</msqrt>';}
      if(nm==='text'){i++;var k=s.indexOf('}',i);var tx=s.slice(i,k);i=k+1;return '<mtext>'+tx+'</mtext>';}
      if(nm==='circ')return '<mo>°</mo>';
      if(nm==='ldots')return '<mo>…</mo>';
      if(nm==='vec'){return '<mover>'+group()+'<mo>→</mo></mover>';}
      if(nm==='quad')return '<mspace width="1.3em"></mspace>';
      if(nm==='cdot')return '<mo>⋅</mo>';
      if(nm==='Rightarrow')return '<mo>⇒</mo>';
      if(nm==='approx')return '<mo>≈</mo>';
      if(nm==='le')return '<mo>≤</mo>';
      if(nm==='ge')return '<mo>≥</mo>';
      if(nm==='pm')return '<mo>±</mo>';
      if(nm==='sin'||nm==='cos'||nm==='tan')return '<mi>'+nm+'</mi>';
      if(GREEK[nm])return '<mi>'+GREEK[nm]+'</mi>';
      return '<mi>'+nm+'</mi>';
    }
    if(/[0-9]/.test(c)){var mm=/^[0-9]+(?:[.,][0-9]+)?/.exec(s.slice(i));i+=mm[0].length;return '<mn>'+mm[0]+'</mn>';}
    i++;
    if(/[A-Za-zͰ-ϿЀ-ӿ]/.test(c))return '<mi>'+c+'</mi>';
    if(c==='-')c='−';
    return '<mo>'+c+'</mo>';
  }
  return '<math'+(block?' display="block"':'')+'>'+seq()+'</math>';
}

var texBase={};
function drawTex(kind,col){
  var cv=document.createElement('canvas');cv.width=cv.height=256;var x=cv.getContext('2d'),i;
  x.fillStyle=col;x.fillRect(0,0,256,256);seed=11;
  if(kind==='wood'){for(i=0;i<70;i++){var xx=rr()*256,w=1+rr()*3;x.strokeStyle='rgba('+(rr()<.5?'60,35,10':'255,235,200')+','+(.06+rr()*.12)+')';x.lineWidth=w;x.beginPath();for(var y=0;y<=256;y+=16){var px=xx+Math.sin(y*.03+i)*3;if(y===0)x.moveTo(px,y);else x.lineTo(px,y);}x.stroke();}}
  else if(kind==='ice'){for(i=0;i<26;i++){x.strokeStyle='rgba(255,255,255,'+(.25+rr()*.4)+')';x.lineWidth=.7+rr()*1.4;x.beginPath();var ax=rr()*256,ay=rr()*256;x.moveTo(ax,ay);x.lineTo(ax+(rr()-.5)*120,ay+(rr()-.5)*120);x.stroke();}}
  else if(kind==='dots'){for(var gy=0;gy<256;gy+=16)for(var gx=0;gx<256;gx+=16){x.fillStyle='rgba(255,255,255,.07)';x.beginPath();x.arc(gx+8,gy+8,3.2,0,PI*2);x.fill();}}
  else if(kind==='speck'){for(i=0;i<2600;i++){x.fillStyle='rgba('+(rr()<.5?'0,0,0':'255,255,255')+','+(rr()*.14)+')';x.fillRect(rr()*256,rr()*256,1+rr()*2,1+rr()*2);}}
  else if(kind==='brush'){for(i=0;i<130;i++){x.strokeStyle='rgba('+(rr()<.5?'0,0,0':'255,255,255')+','+(.04+rr()*.1)+')';x.lineWidth=1;var yy=rr()*256;x.beginPath();x.moveTo(0,yy);x.lineTo(256,yy+(rr()-.5)*4);x.stroke();}}
  var t=new T.CanvasTexture(cv);t.wrapS=t.wrapT=T.RepeatWrapping;t.anisotropy=4;t.userData={keep:true};return t;
}
function look(name,o){
  var L=LOOKS[name]||LOOKS.steel;o=o||{};
  if(!texBase[name])texBase[name]=drawTex(L.t,L.c);
  var t=texBase[name].clone();t.needsUpdate=true;t.userData={keep:false};
  var rep=o.rep||[1,1];t.repeat.set(rep[0],rep[1]);
  var m=new T.MeshStandardMaterial({map:t,color:0xffffff,roughness:L.r,metalness:L.m,envMapIntensity:.7});
  if(L.op){m.transparent=true;m.opacity=L.op;}
  return m;
}

function rgeo(w,h,d,r){
  r=Math.min(r,w/2-.001,h/2-.001,d/2-.001);
  var sh=new T.Shape(),x=w/2-r,y=h/2-r;
  sh.moveTo(-x,-y);sh.lineTo(x,-y);sh.lineTo(x,y);sh.lineTo(-x,y);sh.closePath();
  var g=new T.ExtrudeGeometry(sh,{depth:Math.max(.001,d-2*r),bevelEnabled:true,bevelThickness:r,bevelSize:r,bevelSegments:3,curveSegments:1});
  g.translate(0,0,-(d-2*r)/2);return g;
}
function add3(geo,m,pos){var x=new T.Mesh(geo,m);x.castShadow=true;x.receiveShadow=true;if(pos)x.position.set(pos[0],pos[1],pos[2]);world.add(x);return x;}

  var mn=Math.min(w,h,d),g=mn>.35?rgeo(w,h,d,Math.min(.1,mn*.14)):new T.BoxGeometry(w,h,d);

}

  s.tL.position.set(pl.x,pl.y+s.sz+1.2,0);s.tR.position.set(pr.x,pr.y+s.sz+1.2,0);
 },
 read:function(p){var V=p.V*1e-6;return [['Тығыздық',f(p.rho/1000,2),'г/см³'],['Дене массасы',f(p.rho*V,2),'кг'],['Су массасы (сол көлем)',f(1000*V,2),'кг'],['Судан неше есе ауыр',f(p.rho/1000,1),'есе']];},
 live:function(p){var V=p.V*1e-6;return R`m=\rho V=${f(p.rho,0)}\cdot${f(V,5)}=${f(p.rho*V,2)}\,\text{кг}`;},
 tips:['Таразының оң жағында көлемі бірдей су тұр. Тығыздығы судан көп зат төмен түседі.','Зат тізімін ауыстырғанда таразыдағы дене автоматты түрде өзгереді: ағаш, мұз, металл. Өз тығыздығыңды да жазуға болады.','Көлемді өзгерткенде таразының қисаю бағыты өзгермейді, себебі тығыздық көлемге тәуелді емес.']

 params:[

 },

  setTag(s.tg,'m = '+f(p.m,1)+' кг');

function phaseT(Q,m){
  var Q1=2100*m*20,Q2=334000*m,Q3=4200*m*100,Q4=2260000*m,Q5=2000*m*20,st,T;
  if(Q<Q1){st=0;T=-20+Q/(2100*m);}else if(Q<Q1+Q2){st=1;T=0;}else if(Q<Q1+Q2+Q3){st=2;T=(Q-Q1-Q2)/(4200*m);}else if(Q<Q1+Q2+Q3+Q4){st=3;T=100;}else{st=4;T=Math.min(120,100+(Q-Q1-Q2-Q3-Q4)/(2000*m));}
  return {st:st,T:T,tot:Q1+Q2+Q3+Q4+Q5,Q1:Q1,Q2:Q2,Q3:Q3,Q4:Q4};
}

function wl2rgb(w){var r=0,g=0,b=0;
  if(w<440){r=(440-w)/60;b=1;}else if(w<490){g=(w-440)/50;b=1;}else if(w<510){g=1;b=(510-w)/20;}else if(w<580){r=(w-510)/70;g=1;}else if(w<645){r=1;g=(645-w)/65;}else{r=1;}
  var f_=w<420?.3+.7*(w-380)/40:w>700?.3+.7*(780-w)/80:1;f_=clamp(f_,.3,1);
  return [Math.round(255*Math.pow(r*f_,.8)),Math.round(255*Math.pow(g*f_,.8)),Math.round(255*Math.pow(b*f_,.8))];}

var pk=function(a){return a[Math.floor(Math.random()*a.length)];};
var pf=function(x,d){return (+x).toFixed(d==null?0:d).replace('.',',').replace('-','−');};
var PG=9.8;
var DYN=['unif','accel','work','proj','circ','spring'];      /* labs that start paused: the student presses ▶ */
var PROBS={};
function pr(o){o.alts=o.alts||[];return o;}

PROBS.unif=function(n){var t=n%3;
  if(t===0){var v=pk([2,3,4,5,6,8]),tt=pk([2,3,4,5,6,8,10]),s=v*tt;return pr({set:{v1:v,v2:Math.max(1,v-1)},ans:s,unit:'м',text:'Қызыл көлік <b>'+v+' м/с</b> жылдамдықпен бірқалыпты қозғалады. <b>'+tt+' с</b> ішінде қанша жол жүреді?',hint:'Бірқалыпты қозғалыста s = v·t.',sol:'s = v·t = '+v+' · '+tt+' = '+s+' м',alts:[[v/tt,'Жолды табу үшін көбейту керек: s = v·t']]});}
  if(t===1){var v2=pk([2,3,4,5,6]),t2=pk([3,4,5,6,8,10]),s2=v2*t2;return pr({set:{v1:v2,v2:Math.max(1,v2-1)},ans:t2,unit:'с',text:'Көлік <b>'+v2+' м/с</b> жылдамдықпен бірқалыпты жүріп, <b>'+s2+' м</b> жол өтті. Қанша уақыт жүрді?',hint:'t = s / v.',sol:'t = s/v = '+s2+' / '+v2+' = '+t2+' с',alts:[[s2*v2,'Уақыт = жол / жылдамдық (бөлу керек)']]});}
  var a=pk([3,4,5,6,8]),b=pk([1,2,3]),tm=pk([2,4,5,6,8,10]);return pr({set:{v1:a,v2:b},ans:(a-b)*tm,unit:'м',text:'Қызыл көлік <b>'+a+' м/с</b>, көк көлік <b>'+b+' м/с</b> жылдамдықпен бір бағытта бір нүктеден жүріп кетті. <b>'+tm+' с</b>-тан кейін олардың арақашықтығы қанша?',hint:'Әрқайсысының жолын табыңыз: s₁ = v₁t, s₂ = v₂t. Арақашықтық — айырма.',sol:'s₁ − s₂ = ('+a+' − '+b+') · '+tm+' = '+(a-b)*tm+' м',alts:[[(a+b)*tm,'Бір бағытта қозғалғанда жолдар айырмасы алынады']]});};

PROBS.dens=function(n){var rho=pk([2700,7800,8900,11300]),V=pk([100,200,250,400,500]),m=rho*V/1000;
  return pr({set:{rho:rho,V:V},ans:m,unit:'г',text:'Дененің тығыздығы <b>'+rho+' кг/м³</b>, көлемі <b>'+V+' см³</b>. Массасы қанша грамм?',hint:'m = ρ·V. 1 см³ = 10⁻⁶ м³ екенін ұмытпаңыз, 1 кг = 1000 г.',sol:'V = '+V+' см³ = '+pf(V*1e-6,6)+' м³; m = ρV = '+rho+'·'+pf(V*1e-6,6)+' = '+pf(rho*V*1e-6,3)+' кг = '+pf(m,0)+' г',alts:[[rho*V,'Көлемді м³-ке аударыңыз: 1 см³ = 10⁻⁶ м³'],[rho*V*1e-6,'Жауапты грамм емес, килограмммен жаздыңыз']]});};

PROBS.hooke=function(n){var m=pk([.2,.5,.8,1]),k=pk([50,100,200,250]),x=m*PG/k*100;
  return pr({set:{m:m,k:k},ans:x,unit:'см',text:'Қатаңдығы <b>'+k+' Н/м</b> серіппеге массасы <b>'+pf(m,1)+' кг</b> жүк ілінді (g = 9,8 м/с²). Серіппе қанша сантиметрге созылады?',hint:'Тепе-теңдікте mg = kx, яғни x = mg/k. Жауапты см-мен жазыңыз.',sol:'x = mg/k = '+pf(m,1)+'·9,8/'+k+' = '+pf(x/100,3)+' м = '+pf(x,1)+' см',alts:[[m/k*100,'Ауырлық күші F = mg: g-ге көбейтуді ұмыттыңыз'],[x/100,'Жауапты см-мен жазыңыз (1 м = 100 см)']]});};

PROBS.fric=function(n){var mu=pk([.1,.2,.3,.4]),m=pk([2,3,4,5,8]),F=mu*m*PG,Fs=Math.min(50,Math.ceil(F)+6);
  return pr({set:{mu:mu,m:m,F:Fs},ans:F,unit:'Н',text:'Массасы <b>'+m+' кг</b> дене горизонталь бетте сырғиды, үйкеліс коэффициенті <b>μ = '+pf(mu,1)+'</b> (g = 9,8 м/с²). Сырғанау үйкеліс күшін табыңыз.',hint:'Горизонталь бетте N = mg, Fүйк = μN.',sol:'Fүйк = μmg = '+pf(mu,1)+'·'+m+'·9,8 = '+pf(F,1)+' Н',alts:[[mu*m,'N = mg, сондықтан g-ге көбейту керек'],[m*PG,'Fүйк = μ·N: μ-ге көбейтуді ұмыттыңыз']]});};

PROBS.press1=function(n){var face=pk([1,2,3]),A=[0,200,100,50][face],m=pk([2,5,10,20]),p=m*PG/(A*1e-4)/1000;
  return pr({set:{face:face,m:m},ans:p,unit:'кПа',text:'Массасы <b>'+m+' кг</b> кірпіш табаны <b>'+A+' см²</b> жағымен үстелде тұр (g = 9,8 м/с²). Қысымын кПа-мен табыңыз.',hint:'p = F/S = mg/S. Ауданды м²-ке аударыңыз (1 см² = 10⁻⁴ м²).',sol:'S = '+A+'·10⁻⁴ м²; p = mg/S = '+m+'·9,8/'+pf(A*1e-4,4)+' = '+pf(p*1000,0)+' Па = '+pf(p,2)+' кПа',alts:[[m*PG/A/1000,'Ауданды м²-ке аударыңыз'],[p*1000,'Жауапты кПа-мен жазыңыз (1 кПа = 1000 Па)']]});};

PROBS.press2=function(n){var rho=pk([1000,800,13600]),h=pk([.5,1,1.5,2]),p=rho*PG*h/1000;
  return pr({set:{rho:rho,H:3,h:h},ans:p,unit:'кПа',text:'Тығыздығы <b>'+rho+' кг/м³</b> сұйықтың <b>'+pf(h,1)+' м</b> тереңдігіндегі гидростатикалық қысымды табыңыз (g = 9,8 м/с²). Жауабы кПа-мен.',hint:'p = ρ·g·h.',sol:'p = ρgh = '+rho+'·9,8·'+pf(h,1)+' = '+pf(p*1000,0)+' Па = '+pf(p,1)+' кПа',alts:[[rho*h/1000,'g = 9,8 м/с² көбейткішін ұмыттыңыз'],[p*1000,'Жауапты кПа-мен жазыңыз']]});};

PROBS.arch=function(n){var rb=pk([7800,2700,8900]),rl=pk([1000,800,1260]),V=pk([100,200,300,500]),FA=rl*PG*V*1e-6;
  return pr({set:{rb:rb,V:V,rl:rl},ans:FA,unit:'Н',text:'Көлемі <b>'+V+' см³</b> металл дене (тығыздығы '+rb+' кг/м³) тығыздығы <b>'+rl+' кг/м³</b> сұйыққа толық батырылған (g = 9,8 м/с²). Архимед күшін табыңыз.',hint:'F = ρ(сұйық)·g·V(батқан бөлігі). Көлемді м³-ке аударыңыз.',sol:'F = ρ_с·g·V = '+rl+'·9,8·'+pf(V*1e-6,6)+' = '+pf(FA,2)+' Н',alts:[[rb*PG*V*1e-6,'Архимед күшін сұйықтың тығыздығымен есептейді, дененікімен емес']]});};

PROBS.work=function(n){var m=pk([20,40,50,80,100]),h=pk([2,3,4,5,6,8]),t=pk([4,5,8,10]),A=m*PG*h;
  if(n%2===0)return pr({set:{m:m,h:h,t:t},ans:A,unit:'Дж',text:'Кран массасы <b>'+m+' кг</b> жүкті <b>'+h+' м</b> биіктікке көтерді (g = 9,8 м/с²). Атқарылған жұмысты табыңыз.',hint:'A = F·h, мұндағы F = mg.',sol:'A = mgh = '+m+'·9,8·'+h+' = '+pf(A,0)+' Дж',alts:[[m*h,'F = mg: g-ге көбейтуді ұмыттыңыз']]});
  return pr({set:{m:m,h:h,t:t},ans:A/t,unit:'Вт',text:'Кран массасы <b>'+m+' кг</b> жүкті <b>'+h+' м</b> биіктікке <b>'+t+' с</b> ішінде көтерді (g = 9,8 м/с²). Кранның қуатын табыңыз.',hint:'Алдымен жұмыс A = mgh, содан кейін N = A/t.',sol:'A = mgh = '+pf(A,0)+' Дж; N = A/t = '+pf(A,0)+'/'+t+' = '+pf(A/t,1)+' Вт',alts:[[A,'Бұл — жұмыс. Қуат үшін уақытқа бөліңіз: N = A/t']]});};

PROBS.lever=function(n){for(var i=0;i<300;i++){var m1=pk([1,2,3,4,5,6]),m2=pk([1,2,3,4,5,6]),l1=pk([1,1.5,2,2.5,3]),l2=m1*l1/m2;
    if(m1===m2||l2<.5||l2>3||Math.abs(l2*10-Math.round(l2*10))>1e-9)continue;
    return pr({set:{m1:m1,l1:l1,m2:m2,l2:l2},ans:l2,unit:'м',text:'Иінтіректің сол жағында <b>'+m1+' кг</b> жүк <b>'+pf(l1,1)+' м</b> иінде тұр. Оң жақта <b>'+m2+' кг</b> жүк. Иінтірек тепе-теңдікте болу үшін оң иін қанша болуы керек?',hint:'Иінтірек ережесі: m₁·l₁ = m₂·l₂.',sol:'l₂ = m₁l₁/m₂ = '+m1+'·'+pf(l1,1)+'/'+m2+' = '+pf(l2,1)+' м',alts:[[m2*l1/m1,'Ереже: m₁l₁ = m₂l₂. Массаларды дұрыс орналастырыңыз']]});}
  return pr({set:{m1:4,l1:2,m2:2,l2:4},ans:4,unit:'м',text:'m₁ = 4 кг, l₁ = 2 м, m₂ = 2 кг. Тепе-теңдік үшін l₂ қанша?',hint:'m₁l₁ = m₂l₂',sol:'l₂ = 4·2/2 = 4 м'});};

PROBS.energy=function(n){var h=pk([2,3,4,5,6,8]),m=pk([1,2,3,4,5]);
  if(n%2===0){var Ep=m*PG*h;return pr({set:{h0:h,m:m,fr:0},ans:Ep,unit:'Дж',text:'Массасы <b>'+m+' кг</b> доп жерден <b>'+h+' м</b> биіктікте тұр (g = 9,8 м/с²). Потенциалдық энергиясын табыңыз.',hint:'Ep = mgh.',sol:'Ep = mgh = '+m+'·9,8·'+h+' = '+pf(Ep,1)+' Дж',alts:[[m*h,'g = 9,8 м/с² көбейткішін ұмыттыңыз']]});}
  var v=Math.sqrt(2*PG*h);return pr({set:{h0:h,m:m,fr:0},ans:v,unit:'м/с',text:'Доп <b>'+h+' м</b> биіктіктен үйкеліссіз түсті (g = 9,8 м/с²). Жерге жеткендегі жылдамдығы қандай?',hint:'Ep толық Ek-ға айналады: mgh = mv²/2.',sol:'v = √(2gh) = √(2·9,8·'+h+') = '+pf(v,2)+' м/с',alts:[[2*PG*h,'Түбір белгісін ұмыттыңыз'],[Math.sqrt(PG*h),'mgh = mv²/2 ⇒ v² = 2gh (2 көбейткіші)']]});};

PROBS.accel=function(n){var v0=pk([0,2,4,5]),a=pk([1,1.5,2,3]),T=pk([3,4,5,6,8]);
  if(n%2===0){var s=v0*T+a*T*T/2;return pr({set:{v0:v0,a:a,T:T},ans:s,unit:'м',text:'Дене бастапқы жылдамдығы <b>'+v0+' м/с</b>, үдеуі <b>'+pf(a,1)+' м/с²</b> болып бірқалыпты үдей қозғалады. <b>'+T+' с</b> ішінде қанша жол жүреді?',hint:'s = v₀t + at²/2.',sol:'s = '+v0+'·'+T+' + '+pf(a,1)+'·'+T+'²/2 = '+pf(s,1)+' м',alts:[[v0*T+a*T*T,'at²/2: ½ көбейткішін ұмыттыңыз'],[v0*T,'Үдеудің қосатын үлесін ұмыттыңыз: at²/2']]});}
  var v=v0+a*T;return pr({set:{v0:v0,a:a,T:T},ans:v,unit:'м/с',text:'Дене бастапқы жылдамдығы <b>'+v0+' м/с</b>, үдеуі <b>'+pf(a,1)+' м/с²</b>. <b>'+T+' с</b>-тан кейінгі жылдамдығы қандай?',hint:'v = v₀ + at.',sol:'v = '+v0+' + '+pf(a,1)+'·'+T+' = '+pf(v,1)+' м/с'});};

PROBS.fall=function(n){var h=pk([5,10,15,20]);
  if(n%2===0){var t=Math.sqrt(2*h/PG);return pr({set:{g:9.8,h:h},ans:t,unit:'с',text:'Доп <b>'+h+' м</b> биіктіктен бастапқы жылдамдықсыз түсті (g = 9,8 м/с²). Түсу уақытын табыңыз.',hint:'h = gt²/2 ⇒ t = √(2h/g).',sol:'t = √(2h/g) = √(2·'+h+'/9,8) = '+pf(t,2)+' с',alts:[[Math.sqrt(h/PG),'h = gt²/2, сондықтан 2h/g'],[2*h/PG,'Түбір белгісін ұмыттыңыз']]});}
  var v=Math.sqrt(2*PG*h);return pr({set:{g:9.8,h:h},ans:v,unit:'м/с',text:'Доп <b>'+h+' м</b> биіктіктен түсті (g = 9,8 м/с²). Жерге түсер сәттегі жылдамдығы қандай?',hint:'v² = 2gh.',sol:'v = √(2gh) = √(2·9,8·'+h+') = '+pf(v,2)+' м/с',alts:[[2*PG*h,'Түбір белгісін ұмыттыңыз']]});};

PROBS.proj=function(n){var v=pk([10,15,20,25]),a=pk([30,45,60]),r=a*Math.PI/180;
  if(n%2===0){var R=v*v*Math.sin(2*r)/PG;return pr({set:{v:v,a:a,g:9.8},ans:R,unit:'м',text:'Доп көкжиекке <b>'+a+'°</b> бұрышпен <b>'+v+' м/с</b> жылдамдықпен лақтырылды (g = 9,8 м/с², ауа кедергісі жоқ). Ұшу қашықтығы қандай?',hint:'R = v₀²·sin2α / g.',sol:'R = '+v+'²·sin'+(2*a)+'° / 9,8 = '+pf(R,1)+' м',alts:[[v*v*Math.sin(r)/PG,'sinα емес, sin2α керек'],[v*v/PG,'sin2α көбейткішін ұмыттыңыз']]});}
  var H=v*v*Math.sin(r)*Math.sin(r)/(2*PG);return pr({set:{v:v,a:a,g:9.8},ans:H,unit:'м',text:'Доп көкжиекке <b>'+a+'°</b> бұрышпен <b>'+v+' м/с</b> жылдамдықпен лақтырылды (g = 9,8 м/с²). Ең үлкен көтерілу биіктігі қандай?',hint:'H = v₀²·sin²α / (2g).',sol:'H = '+v+'²·sin²'+a+'° / (2·9,8) = '+pf(H,2)+' м',alts:[[v*v*Math.sin(r)/(2*PG),'sinα квадратта болу керек: sin²α']]});};

PROBS.incl=function(n){var a=pk([30,40,45,60]),mu=pk([.1,.2,.3]),m=pk([1,2,4]),r=a*Math.PI/180,ac=PG*(Math.sin(r)-mu*Math.cos(r));
  return pr({set:{a:a,mu:mu,m:m},ans:ac,unit:'м/с²',text:'Блок көлбеу бұрышы <b>'+a+'°</b> еңіспен төмен сырғиды, үйкеліс коэффициенті <b>μ = '+pf(mu,1)+'</b> (g = 9,8 м/с²). Үдеуін табыңыз.',hint:'ma = mg·sinα − μ·mg·cosα, массаға тәуелсіз.',sol:'a = g(sinα − μcosα) = 9,8·(sin'+a+'° − '+pf(mu,1)+'·cos'+a+'°) = '+pf(ac,2)+' м/с²',alts:[[PG*Math.sin(r),'Үйкеліс күшін ескермедіңіз: −μg·cosα'],[PG*(Math.sin(r)-mu),'Үйкеліс күші μ·N = μ·mg·cosα']]});};

PROBS.circ=function(n){var m=pk([.5,1,2]),v=pk([4,6,8]),r=pk([2,3,4,5]);
  if(n%2===0){var a=v*v/r;return pr({set:{r:r,v:v,m:m},ans:a,unit:'м/с²',text:'Дене радиусы <b>'+r+' м</b> шеңбер бойымен <b>'+v+' м/с</b> жылдамдықпен қозғалады. Центрге тартқыш үдеуін табыңыз.',hint:'a = v²/r.',sol:'a = v²/r = '+v+'²/'+r+' = '+pf(a,2)+' м/с²',alts:[[v/r,'Жылдамдықты квадраттау керек: v²/r']]});}
  var F=m*v*v/r;return pr({set:{r:r,v:v,m:m},ans:F,unit:'Н',text:'Массасы <b>'+pf(m,1)+' кг</b> дене радиусы <b>'+r+' м</b> шеңбер бойымен <b>'+v+' м/с</b> жылдамдықпен қозғалады. Центрге тартқыш күшті табыңыз.',hint:'F = m·a = m·v²/r.',sol:'F = mv²/r = '+pf(m,1)+'·'+v+'²/'+r+' = '+pf(F,1)+' Н',alts:[[v*v/r,'F = m·a: массаға көбейтуді ұмыттыңыз']]});};

PROBS.imp=function(n){var m1=pk([1,2,3]),m2=pk([1,2,3]),v1=pk([2,4,6]),v2=pk([-4,-2,0,2]),v=(m1*v1+m2*v2)/(m1+m2);
  return pr({set:{m1:m1,m2:m2,v1:v1,v2:v2,e:0},ans:v,unit:'м/с',text:'Массасы <b>'+m1+' кг</b> қызыл арба <b>'+v1+' м/с</b> жылдамдықпен, массасы <b>'+m2+' кг</b> көк арба <b>'+pf(v2,0)+' м/с</b> жылдамдықпен қозғалып келіп соқтығысып, жабысып қалды (оң бағыт — оңға). Жалпы жылдамдықты табыңыз.',hint:'Импульстің сақталуы: m₁v₁ + m₂v₂ = (m₁ + m₂)·v. Бағыттың таңбасын ескеріңіз.',sol:'v = (m₁v₁ + m₂v₂)/(m₁ + m₂) = ('+m1+'·'+v1+' + '+m2+'·('+pf(v2,0)+'))/'+(m1+m2)+' = '+pf(v,2)+' м/с',alts:v2<0?[[(m1*v1+m2*Math.abs(v2))/(m1+m2),'Көк арба қарсы қозғалады: v₂ теріс таңбамен алынады']]:[]});};

PROBS.pend=function(n){var l=pk([.5,1,2,3,4]),T=2*Math.PI*Math.sqrt(l/PG);

var PR=null,probTries=0,probCount={};
var SCORE=null;
function scoreBook(){if(SCORE===null){try{SCORE=JSON.parse(LS.get('fizlab.score')||'{}')||{};}catch(e){SCORE={};}}return SCORE;}
function scoreOf(id){return scoreBook()[id]||0;}
function addScore(id){scoreBook()[id]=scoreOf(id)+1;LS.set('fizlab.score',JSON.stringify(SCORE));}
function probNew(){var g=PROBS[cur.id];if(!g)return;probCount[cur.id]=(probCount[cur.id]||0);PR=g(probCount[cur.id]++);probTries=0;}
function probRender(){
  var box=$('pProb');if(!cur||!PROBS[cur.id]){box.innerHTML='<p class="note">Бұл тақырыпқа есеп жақында қосылады.</p>';return;}
  if(!PR)probNew();
  box.innerHTML='<h4>Есеп №'+probCount[cur.id]+' · шешкені: '+scoreOf(cur.id)+'</h4><p class="pt">'+PR.text+'</p>'+
    '<div class="ans"><input type="text" id="pa" inputmode="decimal" autocomplete="off" aria-label="Жауабыңыз" placeholder="Жауабыңыз"><span>'+PR.unit+'</span></div>'+
    '<div class="acts"><button class="btn on" id="pc" type="button">Тексеру</button><button class="btn" id="pm" type="button">Модельмен тексеру</button><button class="btn" id="pn" type="button">Жаңа есеп</button></div><div id="pres" aria-live="polite"></div>';
  var inp=$('pa'),res=$('pres');
  function check(){
    var x=numParse(inp.value);if(isNaN(x)){res.innerHTML='<div class="bad">Санмен жауап жазыңыз</div>';return;}
    probTries++;var near=function(v){return Math.abs(x-v)<=Math.max(Math.abs(v)*.025,.02);};
    if(near(PR.ans)){if(!PR.done){PR.done=true;addScore(cur.id);buildMenu();}res.innerHTML='<div class="good">✓ Дұрыс!</div><div class="sol">'+PR.sol+'</div>';}
    else{var alt=PR.alts.filter(function(a){return near(a[0]);})[0];
      res.innerHTML='<div class="bad">Әзірге дұрыс емес.</div><div class="sol">'+(alt?alt[1]:PR.hint)+'</div>'+(probTries>1?'<button class="btn" id="ps" type="button">Шешімін көрсету</button>':'');
      var ps=$('ps');if(ps)ps.addEventListener('click',function(){res.insertAdjacentHTML('beforeend','<div class="sol">'+PR.sol+'</div>');ps.remove();});}
  }
  $('pc').addEventListener('click',check);inp.addEventListener('keydown',function(e){if(e.key==='Enter')check();});
  $('pn').addEventListener('click',function(){probNew();probRender();});
  $('pm').addEventListener('click',function(){
    setP(PR.set,true);startRun();
    var h=$('hint');h.textContent=DYN.indexOf(cur.id)>=0?'Модель есеп шарттарымен іске қосылды':'Модель есеп шарттарымен қойылды. Денені өзіңіз қозғап көріңіз';h.hidden=false;setTimeout(function(){h.hidden=true;},4200);setTab('ctl');
  });
}

  var U2,R2,t2,m,Q2,dT;do{U2=pk([12,24]);R2=pk([2,3,4]);t2=pk([60,120,300]);m=pk([.1,.2]);Q2=U2*U2*t2/R2;dT=Q2/(4200*m);}while(dT<5||dT>70);return pr({set:{U:U2,R:R2,m:m},ans:dT,unit:'°C',text:'Кедергісі <b>'+R2+' Ом</b> қыздырғыш <b>'+U2+' В</b> кернеуде <b>'+t2+' с</b> жұмыс істеп, массасы <b>'+pf(m,1)+' кг</b> суды қыздырды (c = 4200 Дж/(кг·°C), шығын жоқ). Су неше градусқа қызды?',hint:'Алдымен Q = U²t/R, содан кейін Δt = Q/(c·m).',sol:'Q = U²t/R = '+pf(Q2,0)+' Дж; Δt = Q/(cm) = '+pf(Q2,0)+'/(4200·'+pf(m,1)+') = '+pf(dT,1)+' °C',alts:[]});};

PROBS.magnet=function(n){if(n%2===0){var v=pk([1000,2000,4000]),B=pk([5,10,20]),r=v*1000/(B/1000*1.759e11)*1000;
    return pr({set:{typ:0,dirB:1,B:B,v:v},ans:r,unit:'мм',text:'Электрон <b>'+v+' км/с</b> жылдамдықпен индукциясы <b>'+B+' мТл</b> біртекті магнит өрісіне перпендикуляр ұшып кірді. Траекториясының радиусы қанша мм? (q/m = 1,76·10¹¹ Кл/кг)',hint:'Лоренц күші центрге тартқыш күш: qvB = mv²/r ⇒ r = v/(B·q/m). Бірліктерді СИ-ге аударыңыз: км/с → м/с, мТл → Тл.',sol:'r = v/(B·q/m) = '+pf(v*1000,0)+'/('+pf(B/1000,3)+'·1,76·10¹¹) = '+pf(r,3)+' мм',alts:[[r/1000,'Жауапты мм-мен жазыңыз'],[r*1000,'Жылдамдықты км/с-тан м/с-қа аударыңыз']]});}
  var v2=pk([500,1000,2000]),B2=pk([20,50]),r2=v2*1000/(B2/1000*9.58e7)*100;
  return pr({set:{typ:1,dirB:1,B:B2,v:v2},ans:r2,unit:'см',text:'Протон <b>'+v2+' км/с</b> жылдамдықпен индукциясы <b>'+B2+' мТл</b> өріске перпендикуляр кірді. Орбитасының радиусы қанша см? (q/m = 9,58·10⁷ Кл/кг)',hint:'r = v/(B·q/m). v-ны м/с-қа, B-ны Тл-ға аударыңыз.',sol:'r = '+pf(v2*1000,0)+'/('+pf(B2/1000,3)+'·9,58·10⁷) = '+pf(r2,1)+' см',alts:[[r2/100,'Жауапты см-мен жазыңыз']]});};

PROBS.phase=function(n){var m=pk([.1,.2,.3,.5]),t=n%3;
  if(t===0){var Q=334*m;return pr({set:{m:m,P:1000},ans:Q,unit:'кДж',text:'0 °C температурадағы массасы <b>'+pf(m,1)+' кг</b> мұзды толық балқыту үшін қанша жылу керек (λ = 334 кДж/кг)? Жауабы кДж-мен.',hint:'Q = λ·m.',sol:'Q = λm = 334·'+pf(m,1)+' = '+pf(Q,1)+' кДж',alts:[[Q*1000,'Жауапты кДж-мен жазыңыз'],[334/m,'Q = λ·m: көбейту керек']]});}
  if(t===1){var Q1=2100*m*20/1000;return pr({set:{m:m,P:1000},ans:Q1,unit:'кДж',text:'Массасы <b>'+pf(m,1)+' кг</b> мұзды −20 °C-тан 0 °C-қа дейін қыздыруға қанша жылу керек (c(мұз) = 2100 Дж/(кг·°C))? Жауабы кДж-мен.',hint:'Q = c·m·Δt, Δt = 20 °C. Жауапты кДж-ға аударыңыз.',sol:'Q = 2100·'+pf(m,1)+'·20 = '+pf(Q1*1000,0)+' Дж = '+pf(Q1,1)+' кДж',alts:[[Q1*1000,'Жауапты кДж-мен жазыңыз']]});}
  var m2=pk([.1,.2]),Q4=2260*m2;return pr({set:{m:m2,P:1000},ans:Q4,unit:'кДж',text:'100 °C-тағы массасы <b>'+pf(m2,1)+' кг</b> суды буға айналдыру үшін қанша жылу керек (L = 2260 кДж/кг)?',hint:'Q = L·m.',sol:'Q = Lm = 2260·'+pf(m2,1)+' = '+pf(Q4,0)+' кДж',alts:[[Q4*1000,'Жауапты кДж-мен жазыңыз']]});};

PROBS.thermo=function(n){var Q=pk([500,1000,1500,2000]),t=n%3;
  if(t===0)return pr({set:{proc:0,P:100,n:1},ans:.4*Q,unit:'Дж',text:'Бір атомды идеал газға изобаралық үдерісте <b>'+Q+' Дж</b> жылу берілді. Газ қанша жұмыс істейді? (Бір атомды газ үшін ΔU = 3/2·νRΔT, A = νRΔT)',hint:'Изобарада Q = ΔU + A = 5/2·νRΔT, ал A = νRΔT. Демек A = (2/5)Q.',sol:'Q = 5/2·νRΔT, A = νRΔT ⇒ A = 2Q/5 = 0,4·'+Q+' = '+pf(.4*Q,0)+' Дж',alts:[[Q,'Жылудың барлығы жұмысқа кетпейді: бір бөлігі ішкі энергияға жұмсалады'],[.6*Q,'Бұл — ішкі энергияның өзгерісі ΔU. Жұмыс A = 0,4·Q']]});
  if(t===1)return pr({set:{proc:0,P:100,n:1},ans:.6*Q,unit:'Дж',text:'Бір атомды идеал газға изобаралық үдерісте <b>'+Q+' Дж</b> жылу берілді. Ішкі энергиясы қанша өзгерді?',hint:'Q = ΔU + A. Изобарада A = (2/5)Q, сондықтан ΔU = (3/5)Q.',sol:'ΔU = Q − A = Q − 0,4Q = 0,6·'+Q+' = '+pf(.6*Q,0)+' Дж',alts:[[.4*Q,'Бұл — жұмыс. ΔU = Q − A']]});
  return pr({set:{proc:1,P:100,n:1},ans:Q,unit:'Дж',text:'Бір атомды идеал газға изохоралық үдерісте <b>'+Q+' Дж</b> жылу берілді. Ішкі энергиясы қанша өзгерді?',hint:'Изохорада көлем тұрақты, газ жұмыс істемейді: A = 0.',sol:'A = 0 ⇒ ΔU = Q = '+Q+' Дж',alts:[[.6*Q,'Изохорада газ жұмыс істемейді, жылудың бәрі ішкі энергияға кетеді']]});};

PROBS.lung=function(n){var V2=pk([3,3.6,4,4.8]),p=101.3*2.4/V2;
  return pr({set:{mode:0,glot:0,V:V2},ans:p,unit:'кПа',text:'Дауыс саңылауы жабық, өкпе көлемі <b>2,4 л</b>-ден <b>'+pf(V2,1)+' л</b>-ге дейін көтерілді (көкет төмен түсті). Бастапқы қысым 101,3 кПа, температура тұрақты. Өкпедегі қысым қанша болады?',hint:'Бойль–Мариотт заңы: p₁V₁ = p₂V₂.',sol:'p₂ = p₁V₁/V₂ = 101,3·2,4/'+pf(V2,1)+' = '+pf(p,1)+' кПа (атмосферадан аз: ауа өкпеге кіреді)',alts:[[101.3*V2/2.4,'Көлем артса, қысым кемиді: p₂ = p₁V₁/V₂']]});};

PROBS.lens=function(n){var t=n%4,pairs=[[4,12],[5,10],[6,12],[6,18],[8,24],[10,15],[5,20],[6,9]],pp=pk(pairs),F=pp[0],d=pp[1],h=pk([1,2,3]),fi=1/(1/F-1/d);
  if(t===0)return pr({set:{typ:1,F:F,d:d,h:h},ans:fi,unit:'см',text:'Фокус аралығы <b>'+F+' см</b> жинағыш линзадан <b>'+d+' см</b> қашықтықта нысан тұр. Кескін линзадан қандай қашықтықта пайда болады?',hint:'Жұқа линза формуласы: 1/F = 1/d + 1/f.',sol:'1/f = 1/F − 1/d = 1/'+F+' − 1/'+d+' = '+pf(1/F-1/d,4)+'; f = '+pf(fi,1)+' см',alts:[[F+d,'Фокус пен нысан қашықтығын қосуға болмайды: 1/f = 1/F − 1/d'],[1/(1/F-1/d)*-1,'Нақты кескін линзаның нысанға қарама-қарсы жағында, f оң']]});
  if(t===1)return pr({set:{typ:1,F:F,d:d,h:h},ans:fi/d,unit:'есе',text:'Жинағыш линзаның фокус аралығы <b>'+F+' см</b>, нысан <b>'+d+' см</b> қашықтықта. Сызықтық ұлғайтуды (Γ) табыңыз.',hint:'Алдымен f табыңыз: 1/f = 1/F − 1/d. Сосын Γ = f/d.',sol:'f = '+pf(fi,2)+' см; Γ = f/d = '+pf(fi,2)+'/'+d+' = '+pf(fi/d,2),alts:[[d/fi,'Бұл кері шама. Γ = f/d (кескін қашықтығы / нысан қашықтығы)'],[fi,'Бұл — f. Ұлғайту Γ = f/d']]});
  if(t===2){var Fd=pk([4,6,8]),dd=pk([6,12]),fd=1/(1/Fd+1/dd);return pr({set:{typ:-1,F:Fd,d:dd,h:h},ans:fd,unit:'см',text:'Фокус аралығы <b>'+Fd+' см</b> шашыратқыш линзадан <b>'+dd+' см</b> қашықтықта нысан тұр. Жалған кескіннің линзаға дейінгі қашықтығын (модулін) табыңыз.',hint:'Шашыратқыш линзаның фокусы теріс: F = −'+Fd+' см. 1/F = 1/d + 1/f.',sol:'1/f = 1/F − 1/d = −1/'+Fd+' − 1/'+dd+'; |f| = '+pf(fd,2)+' см (кескін жалған, нысанмен бір жақта)',alts:[[1/(1/Fd-1/dd),'Шашыратқыш линзада F теріс: 1/f = −1/F − 1/d']]});}
  var Fo=pk([4,5,8,10,20]);return pr({set:{typ:1,F:Fo,d:Math.min(20,Fo*3),h:2},ans:100/Fo,unit:'дптр',text:'Линзаның фокус аралығы <b>'+Fo+' см</b>. Оның оптикалық күші қанша (дптр)?',hint:'D = 1/F, F метрмен алынады.',sol:'F = '+pf(Fo/100,2)+' м; D = 1/F = '+pf(100/Fo,2)+' дптр',alts:[[1/Fo,'F-ті метрге аударыңыз: '+pf(Fo/100,2)+' м']]});
};

PROBS.refr=function(n){var t=n%3,nn=pk([1.33,1.5,2.42]),a=pk([20,30,40,50,60]);
  if(t===0){var b=Math.asin(Math.sin(a*DEG)/nn)/DEG;return pr({set:{dir:0,n:nn,a:a},ans:b,unit:'°',text:'Жарық ауадан сыну көрсеткіші <b>n = '+pf(nn,2)+'</b> ортаға <b>'+a+'°</b> бұрышпен түседі. Сыну бұрышы қандай?',hint:'Снеллиус заңы: sin α / sin β = n.',sol:'sin β = sin '+a+'° / '+pf(nn,2)+' = '+pf(Math.sin(a*DEG)/nn,3)+'; β = '+pf(b,1)+'°',alts:[[Math.asin(Math.min(1,Math.sin(a*DEG)*nn))/DEG,'Ауадан тығыз ортаға өткенде sin β = sin α / n (n-ге көбейтпеңіз)'],[a/nn,'Бұрыштар емес, олардың синустары пропорционал: sin β = sin α / n']]});}
  if(t===1){var c=Math.asin(1/nn)/DEG;return pr({set:{dir:1,n:nn,a:0},ans:c,unit:'°',text:'Сыну көрсеткіші <b>n = '+pf(nn,2)+'</b> ортадан ауаға шығатын жарық үшін толық ішкі шағылудың шектік бұрышын табыңыз.',hint:'Шектік бұрышта сыну бұрышы 90°: sin α₀ = 1/n.',sol:'sin α₀ = 1/'+pf(nn,2)+' = '+pf(1/nn,3)+'; α₀ = '+pf(c,1)+'°',alts:[[Math.asin(1/nn)/DEG*nn,'sin α₀ = 1/n, содан кейін арксинус алыңыз'],[Math.acos(1/nn)/DEG,'sin α₀ = 1/n (cos емес)']]});}
  var n2=pk([1.33,1.5,2]),a2=pk([30,40,45,60]),b2=Math.round(Math.asin(Math.sin(a2*DEG)/n2)/DEG*10)/10,nr=Math.sin(a2*DEG)/Math.sin(b2*DEG);
  return pr({set:{dir:0,n:n2,a:a2},ans:nr,unit:'',text:'Жарық ауадан белгісіз ортаға <b>'+a2+'°</b> бұрышпен түсіп, <b>'+pf(b2,1)+'°</b> бұрышпен сынды. Ортаның абсолют сыну көрсеткішін табыңыз.',hint:'n = sin α / sin β.',sol:'n = sin '+a2+'° / sin '+pf(b2,1)+'° = '+pf(Math.sin(a2*DEG),3)+'/'+pf(Math.sin(b2*DEG),3)+' = '+pf(nr,2),alts:[[a2/b2,'Бұрыштардың емес, олардың синустарының қатынасы'],[Math.sin(b2*DEG)/Math.sin(a2*DEG),'Кері қатынас: n = sin α / sin β']]});
};

PROBS.interf=function(n){var t=n%2,lam=pk([450,500,550,600,650]),d=pk([.2,.25,.4,.5]),L=pk([1,1.5,2,3]),dy=lam*L/d/1000;
  if(t===0)return pr({set:{lam:lam,d:d,L:L},ans:dy,unit:'мм',text:'Юнг тәжірибесінде толқын ұзындығы <b>'+lam+' нм</b> жарық, саңылаулар арасы <b>d = '+pf(d,2)+' мм</b>, экранға дейін <b>L = '+pf(L,1)+' м</b>. Интерференциялық жолақтар ені Δy қанша?',hint:'Δy = λL/d. Бірліктерді СИ-ға аударыңыз: λ = '+lam+'·10⁻⁹ м, d = '+pf(d,2)+'·10⁻³ м.',sol:'Δy = λL/d = '+lam+'·10⁻⁹·'+pf(L,1)+' / ('+pf(d,2)+'·10⁻³) = '+pf(dy,2)+'·10⁻³ м = '+pf(dy,2)+' мм',alts:[[dy*1000,'Бірлік қате: нм мен мм араласып кетті, жауап мм-мен'],[dy/1000,'Бірлік қате: жауап мм-мен берілуі керек']]});
  var dy2=Math.round(dy*100)/100;return pr({set:{lam:lam,d:d,L:L},ans:dy2*d/L*1000,unit:'нм',text:'Юнг тәжірибесінде d = <b>'+pf(d,2)+' мм</b>, L = <b>'+pf(L,1)+' м</b>, жолақтар ені Δy = <b>'+pf(dy2,2)+' мм</b>. Жарықтың толқын ұзындығы қанша (нм)?',hint:'Δy = λL/d, яғни λ = Δy·d/L.',sol:'λ = Δy·d/L = '+pf(dy2,2)+'·10⁻³·'+pf(d,2)+'·10⁻³ / '+pf(L,1)+' = '+pf(dy2*d/L*1000,0)+' нм',alts:[[dy2*L/d*1000,'λ = Δy·d/L (L-ге бөлесіз)']]});

PROBS.decay=function(n){var t=n%3,Th=pk([2,3,4,5,6]),N=pk([100,200]),k=pk([1,2,3]);
  if(t===0){var tt=k*Th,Nl=N*Math.pow(2,-k);return pr({set:{Th:Th,N:N},ans:Nl,unit:'ядро',text:'Жартылай ыдырау периоды <b>T = '+Th+' с</b>, бастапқы ядро саны <b>N₀ = '+N+'</b>. <b>'+tt+' с</b> өткенде қанша ядро қалады?',hint:'N = N₀·2^(−t/T). Алдымен t/T қанша екенін табыңыз.',sol:'t/T = '+tt+'/'+Th+' = '+k+'; N = '+N+'·2^(−'+k+') = '+pf(Nl,1),alts:[[N-Nl,'Бұл ыдыраған ядролар саны. Сұрақ — қалғаны'],[N/k,'Әр период сайын ядро саны 2 есе кемиді: N = N₀/2^k']]});}
  if(t===1){var tt2=k*Th;return pr({set:{Th:Th,N:N},ans:N-N*Math.pow(2,-k),unit:'ядро',text:'Жартылай ыдырау периоды <b>'+Th+' с</b>, N₀ = <b>'+N+'</b>. <b>'+tt2+' с</b> ішінде қанша ядро ыдырайды?',hint:'Алдымен қалған ядро санын табыңыз: N = N₀/2^(t/T), содан кейін N₀ − N.',sol:'N = '+N+'/2^'+k+' = '+pf(N*Math.pow(2,-k),1)+'; ыдыраған = '+N+' − '+pf(N*Math.pow(2,-k),1)+' = '+pf(N-N*Math.pow(2,-k),1),alts:[[N*Math.pow(2,-k),'Бұл қалған ядролар. Ыдырағаны = N₀ − N']]});}
  var kk=pk([2,3,4]),tm=pk([6,8,12,15,20]);return pr({set:{Th:Th,N:N},ans:tm/kk,unit:'с',text:'<b>'+tm+' с</b> ішінде радиоактивті ядролар саны <b>'+Math.pow(2,kk)+' есе</b> азайды. Жартылай ыдырау периоды қанша?',hint:Math.pow(2,kk)+' = 2^k болса, k периодтың саны; T = t/k.',sol:Math.pow(2,kk)+' = 2^'+kk+', яғни өткен уақыт '+kk+' период; T = '+tm+'/'+kk+' = '+pf(tm/kk,2)+' с',alts:[[tm/Math.pow(2,kk),'2 есе азаю — бір период. '+Math.pow(2,kk)+' есе — k = log₂('+Math.pow(2,kk)+') период']]});
};

PROBS.bohr=function(n){var t=n%3,RYv=13.6;
  if(t===0){var m=pk([1,2,3,4,5]),E=-RYv/(m*m);return pr({set:{n:m},ans:E,unit:'эВ',text:'Сутегі атомының <b>n = '+m+'</b> деңгейіндегі энергиясы қандай (эВ, таңбасын ескеріңіз)?',hint:'Eₙ = −13,6/n² эВ.',sol:'E = −13,6/'+(m*m)+' = '+pf(E,2)+' эВ',alts:[[RYv/(m*m),'Байланысқан күйдің энергиясы теріс'],[-RYv/m,'n² болу керек: Eₙ = −13,6/n²']]});}
  if(t===1){var ni=pk([2,3,4,5]),nf=pk([1,2,3]);if(nf>=ni)nf=ni-1;var dE=RYv*(1/(nf*nf)-1/(ni*ni));return pr({set:{n:ni},ans:dE,unit:'эВ',text:'Электрон сутегі атомында <b>n = '+ni+'</b> деңгейден <b>n = '+nf+'</b> деңгейге өтті. Шығарылған фотонның энергиясы қанша (эВ)?',hint:'E = Eᵢ − E_f = 13,6·(1/n_f² − 1/nᵢ²).',sol:'E = 13,6·(1/'+(nf*nf)+' − 1/'+(ni*ni)+') = '+pf(dE,2)+' эВ',alts:[[RYv*(1/nf-1/ni),'Деңгей нөмірінің квадраты керек: 1/n²']]});}
  var dE2=RYv*(1/4-1/9),lam=1240/dE2;return pr({set:{n:3},ans:lam,unit:'нм',text:'Сутегі атомында электрон <b>3-деңгейден 2-деңгейге</b> өтті (Бальмер сериясының Hα сызығы). Шығарылған жарықтың толқын ұзындығы қанша (нм)? (hc = 1240 эВ·нм)',hint:'Алдымен фотон энергиясы E = 13,6·(1/4 − 1/9), сосын λ = 1240/E.',sol:'E = 13,6·(1/4 − 1/9) = '+pf(dE2,2)+' эВ; λ = 1240/'+pf(dE2,2)+' = '+pf(lam,0)+' нм (қызыл сызық)',alts:[[1240*dE2,'λ = hc/E: 1240-ты энергияға бөлесіз']]});
};

PROBS.photo=function(n){var t=n%3,mt=pk([[1.9,'цезий'],[2.28,'натрий'],[4.3,'мырыш'],[4.7,'мыс']]),A=mt[0],lam,K;
  do{lam=pk([200,250,300,350,400,450,500]);K=1240/lam-A;}while(K<.2);
  if(t===0)return pr({set:{A:A,lam:lam,I:50,U:0},ans:K,unit:'эВ',text:'Шығу жұмысы <b>A = '+pf(A,2)+' эВ</b> ('+mt[1]+') металға толқын ұзындығы <b>'+lam+' нм</b> жарық түседі. Фотоэлектрондардың ең үлкен кинетикалық энергиясы қанша (эВ)? (hc = 1240 эВ·нм)',hint:'Эйнштейн теңдеуі: hν = A + Eₖ, hν = 1240/λ.',sol:'hν = 1240/'+lam+' = '+pf(1240/lam,2)+' эВ; Eₖ = hν − A = '+pf(1240/lam,2)+' − '+pf(A,2)+' = '+pf(K,2)+' эВ',alts:[[1240/lam,'Бұл — фотон энергиясы. Eₖ = hν − A'],[1240/lam+A,'Шығу жұмысы фотон энергиясынан алынады: Eₖ = hν − A']]});
  if(t===1)return pr({set:{A:A,lam:lam,I:50,U:0},ans:K,unit:'В',text:'Шығу жұмысы <b>'+pf(A,2)+' эВ</b> металға <b>'+lam+' нм</b> жарық түседі. Фототокты тоқтататын тежеуші кернеу Uт қанша (В)?',hint:'eUт = Eₖ, ал Eₖ = hν − A. Электрон-вольт пен вольт сандық мәні бірдей.',sol:'Eₖ = 1240/'+lam+' − '+pf(A,2)+' = '+pf(K,2)+' эВ; Uт = Eₖ/e = '+pf(K,2)+' В',alts:[[1240/lam,'Бұл — фотон энергиясы, одан A алып тастаңыз']]});
  var A2=pk([1.9,2.28,4.3,4.7,5.6]),l0=1240/A2;return pr({set:{A:A2,lam:300,I:50,U:0},ans:l0,unit:'нм',text:'Металдың шығу жұмысы <b>A = '+pf(A2,2)+' эВ</b>. Фотоэффектінің қызыл шекарасы λ₀ қанша (нм)?',hint:'λ₀ = hc/A = 1240/A (нм, A эВ-пен).',sol:'λ₀ = 1240/'+pf(A2,2)+' = '+pf(l0,0)+' нм (одан ұзын толқында фотоэффект болмайды)',alts:[[A2*1240,'λ₀ = 1240/A (бөлу керек)']]});
};

/* ---------- camera and picking ---------- */
function placeCam(){var s=Math.sin(orb.ph);camera.position.set(orb.t.x+orb.r*s*Math.sin(orb.th),orb.t.y+orb.r*Math.cos(orb.ph),orb.t.z+orb.r*s*Math.cos(orb.th));camera.lookAt(orb.t);}
var drag=null,gdrag=false,gLast=null,ray=new T.Raycaster(),ndc=new T.Vector2(),gPl=new T.Plane();
function aim(e){var r=canvas.getBoundingClientRect();ndc.set((e.clientX-r.left)/r.width*2-1,-((e.clientY-r.top)/r.height*2-1));ray.setFromCamera(ndc,camera);}
function gHit(){
  var g=cur&&cur.grab;if(!g||!S)return null;
  var ms=g.meshes(S).filter(function(m){return m&&m.visible!==false;});if(!ms.length)return null;
  var h=ray.intersectObjects(ms,true);return h.length?h[0]:null;
}
function gPt(){
  var g=cur.grab;
  if(g.plane==='xz')gPl.set(new T.Vector3(0,1,0),-(g.y||0));else gPl.set(new T.Vector3(0,0,1),0);
  var o=new T.Vector3();return ray.ray.intersectPlane(gPl,o)?o:null;
}
canvas.addEventListener('pointerdown',function(e){
  aim(e);var h=gHit();
  if(h){gdrag=true;gLast=gPt()||h.point.clone();cur.grab.on('start',gLast,S,P);canvas.style.cursor='grabbing';$('hint').hidden=true;}
  else drag={x:e.clientX,y:e.clientY};
  try{canvas.setPointerCapture(e.pointerId);}catch(x){}
});
canvas.addEventListener('pointermove',function(e){
  if(gdrag){aim(e);var pt=gPt();if(pt){gLast=pt;cur.grab.on('move',pt,S,P);}return;}
  if(drag){orb.th-=(e.clientX-drag.x)*.007;orb.ph=clamp(orb.ph-(e.clientY-drag.y)*.007,.12,1.52);drag.x=e.clientX;drag.y=e.clientY;return;}
  if(cur&&cur.grab&&S){aim(e);canvas.style.cursor=gHit()?'grab':'';}
});
function endDrag(){if(gdrag){gdrag=false;canvas.style.cursor='';if(cur.grab&&gLast)cur.grab.on('end',gLast,S,P);}drag=null;}
['pointerup','pointercancel'].forEach(function(n){canvas.addEventListener(n,endDrag);});
canvas.addEventListener('wheel',function(e){e.preventDefault();orb.r=clamp(orb.r*(1+e.deltaY*.001),8,80);},{passive:false});
function resize(){var w=canvas.clientWidth,h=canvas.clientHeight;if(!w||!h)return;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe($('app'));

function clearWorld(){
  while(world.children.length){var o=world.children[0];world.remove(o);o.traverse(function(x){if(x.geometry)x.geometry.dispose();if(x.material){var ms=Array.isArray(x.material)?x.material:[x.material];ms.forEach(function(m){if(m.map&&!(m.map.userData&&m.map.userData.keep))m.map.dispose();m.dispose();});}});}
}
function rebuild(){gdrag=false;clearWorld();S=cur.build(P);drawReads.last=null;}

/* ---------- parameters and controls ---------- */
function numFmt(v){return String(+(+v).toFixed(3)).replace('.',',').replace('-','−');}
function numParse(t){var s=String(t).replace(',','.').replace('−','-').replace(/\s/g,'');if(s===''||s==='-'||s==='.')return NaN;var v=parseFloat(s);return isFinite(v)?v:NaN;}
function qOf(k){return cur.params.filter(function(x){return x.k===k;})[0];}
function lims(q){
  if(q.sel&&q.num)return {lo:q.num.min,hi:q.num.max,step:q.num.step,u:q.num.u};
  if(q.sel)return {lo:-Infinity,hi:Infinity,step:1,u:''};
  return {lo:q.lo!=null?q.lo:q.min,hi:q.hi!=null?q.hi:q.max,step:q.step,u:q.u};
}
function sync(q,skipNum){
  var v=P[q.k],r=$('r_'+q.k),n=$('n_'+q.k),s=$('s_'+q.k);
  if(r)r.value=v;
  if(n&&!(skipNum&&document.activeElement===n))n.value=numFmt(v);
  if(s){var ok=false;Array.prototype.forEach.call(s.options,function(o){if(o.value!=='__c'&&Math.abs(+o.value-v)<1e-9){s.value=o.value;ok=true;}});if(!ok)s.value='__c';}
}
function changed(q){if(q.sel||!q.nr)rebuild();}
function setVal(q,v,skipNum){var L=lims(q);v=clamp(v,L.lo,L.hi);P[q.k]=+(+v).toFixed(4);sync(q,skipNum);changed(q);}
function setP(o,rb){
  Object.keys(o).forEach(function(k){var q=qOf(k);if(!q)return;P[k]=+(+o[k]).toFixed(4);sync(q,false);});
  if(rb)rebuild();
}
function buildControls(){
  var box=$('ctrls');box.innerHTML='';
  cur.params.forEach(function(q){
    var d=document.createElement('div');d.className='ctrl';var L=lims(q);
    var numHtml='<div class="num"><input type="text" inputmode="decimal" id="n_'+q.k+'" aria-label="'+q.l+'"><em>'+(L.u||'')+'</em></div>';
    if(q.sel){
      d.innerHTML='<div class="top"><span>'+q.l+'</span>'+(q.num?numHtml:'')+'</div><select id="s_'+q.k+'" aria-label="'+q.l+'">'+q.sel.map(function(o){return '<option value="'+o[1]+'">'+o[0]+'</option>';}).join('')+'<option value="__c">Өз мәнім</option></select>';
    }else{
      d.innerHTML='<div class="top"><span>'+q.l+'</span>'+numHtml+'</div><input type="range" id="r_'+q.k+'" min="'+q.min+'" max="'+q.max+'" step="'+q.step+'" aria-label="'+q.l+'">';
    }
    box.appendChild(d);
    var r=d.querySelector('input[type=range]'),n=d.querySelector('input[type=text]'),s=d.querySelector('select');
    if(r)r.addEventListener('input',function(){setVal(q,+r.value,false);});
    if(s)s.addEventListener('change',function(){if(s.value==='__c'){if(n)n.focus();sync(q,false);return;}setVal(q,+s.value,false);});
    if(n){
      n.addEventListener('input',function(){var v=numParse(n.value);if(!isNaN(v))setVal(q,v,true);});
      n.addEventListener('change',function(){var v=numParse(n.value);if(!isNaN(v))setVal(q,v,false);else sync(q,false);});
      n.addEventListener('keydown',function(e){if(e.key==='Enter')n.blur();});
    }
    sync(q,false);
  });
}

/* ---------- texts ---------- */
function drawReads(){
  var rows=cur.read(P,S);
  readsEl.innerHTML=rows.map(function(r,i){var wide=String(r[1]).length>11||(r[2]===''&&i===rows.length-1);return '<div class="read'+(wide?' wide':'')+'"><span>'+r[0]+'</span><b>'+r[1]+(r[2]?'<i>'+r[2]+'</i>':'')+'</b></div>';}).join('');
  var lv=typeof cur.live==='function'?cur.live(P,S):'';
  if(lv!==drawReads.last){drawReads.last=lv;$('live').innerHTML=lv?tex(lv,false):'';}
}
function showIntro(){
  var th=cur.theory,sc=th.sci;
  $('intro').innerHTML='<div class="card"><div class="col"><span class="gtag">'+cur.grade+' сынып · '+SEC[secOf(cur)]+'</span><h2>'+cur.name+'</h2><h6>Анықтама</h6><p>'+th.def+'</p><h6>Шамалар</h6><table class="vt"><tbody>'+th.vars.map(function(v){return '<tr><td>'+tex(v[0],false)+'</td><td>'+v[1]+'</td><td>'+v[2]+'</td></tr>';}).join('')+'</tbody></table></div><div class="col"><h6>Формулалар</h6>'+th.formulas.map(function(x){return '<div class="fm">'+tex(x.tex,false)+'<span>'+x.note+'</span></div>';}).join('')+'<h6 style="margin-top:20px">Ғалым</h6><div class="sci"><b>'+sc.name+'</b><i>'+sc.years+'</i><p>'+sc.text+'</p></div></div><div class="foot"><button class="btn big on" id="goLab" type="button">Зертханаға өту</button></div></div>';
  $('intro').hidden=false;$('goLab').addEventListener('click',function(){$('intro').hidden=true;});$('goLab').focus();
}

/* ---------- load a lab ---------- */
function load(id,showTheory){
  var l=LABS.filter(function(x){return x.id===id;})[0];if(!l)return;
  cur=l;P={};l.params.forEach(function(q){P[q.k]=q.val;});
  $('tGrade').textContent=l.grade+' сынып';$('tName').textContent=l.name;
  buildControls();
  $('pExp').innerHTML='<h4>Не көріп тұрсың</h4><ul>'+l.tips.map(function(t){return '<li>'+t+'</li>';}).join('')+'</ul>';
  orb.th=l.cam.th;orb.ph=l.cam.ph;orb.r=l.cam.r;orb.t.set(l.cam.t[0],l.cam.t[1],l.cam.t[2]);
  var dyn=DYN.indexOf(l.id)>=0;paused=dyn;started=!dyn;$('bPause').textContent=dyn?'▶ Іске қосу':'Тоқтату';PR=null;$('tProb').hidden=!PROBS[l.id];
  var hn=$('hint');hn.textContent=l.hint||(dyn?'Тәжірибені өзіңіз бастаңыз: жоғарыдағы ▶ Іске қосу түймесін басыңыз':'');hn.hidden=!hn.textContent;
  rebuild();menuSec=null;buildMenu();setTab('ctl');
  if(showTheory!==false)showIntro();else $('intro').hidden=true;
  LS.set('fizlab.last',id);
  try{history.replaceState(null,'','#'+id);}catch(e){}
}

/* ---------- menu ---------- */
var SEC=['Механика','МКТ және жылу','Электродинамика','Оптика','Атом және ядро','Кванттық физика'];
var SECOF={unif:0,dens:0,hooke:0,fric:0,press1:0,press2:0,arch:0,work:0,lever:0,bio:0,energy:0,accel:0,fall:0,proj:0,incl:0,circ:0,imp:0,pend:0,spring:0,stat:0,blood:0,balance:0,
  heat:1,gas:1,lung:1,diff:1,phase:1,thermo:1,ohm:2,build:2,coul:2,joule:2,efield:2,magnet:2,induct:2,lens:3,eye:3,refr:3,interf:3,decay:4,bohr:4,photo:5};
function secOf(l){return l&&SECOF[l.id]!=null?SECOF[l.id]:0;}
var menuSec=null,homeSec=0;
function secCount(i){return LABS.filter(function(l){return secOf(l)===i;}).length;}
function labsOf(i,g){return LABS.filter(function(l){return secOf(l)===i&&l.grade===g;});}
function buildMenu(){
  var eff=menuSec!=null?menuSec:secOf(cur);
  var h='<div class="secs">'+SEC.map(function(s,i){var n=secCount(i);return '<button type="button" data-s="'+i+'"'+(i===eff?' class="on"':'')+(n?'':' disabled')+'>'+s+(n?' · '+n:' · жақында')+'</button>';}).join('')+'</div>';
  var any=false;
  [7,8,9,10,11].forEach(function(g){
    var ls=labsOf(eff,g);if(!ls.length)return;any=true;
    h+='<h5>'+g+' сынып</h5>';
    ls.forEach(function(l){var sc=scoreOf(l.id);h+='<button class="item" type="button" data-id="'+l.id+'"'+(cur&&cur.id===l.id?' aria-current="true"':'')+'>'+l.name+(sc?' <small class="sc">✓ '+sc+'</small>':'')+'</button>';});
  });
  if(!any)h+='<p class="note">Бұл бөлім жақында қосылады.</p>';
  if(any&&QUIZ[eff])h+='<button class="item quiz" type="button" data-quiz="'+eff+'">✎ Бөлім тесті</button>';
  var m=$('menu');m.innerHTML=h;
  Array.prototype.forEach.call(m.querySelectorAll('[data-quiz]'),function(b){b.addEventListener('click',function(){quizShow(+b.dataset.quiz);if(innerWidth<900)hide('left',true);});});
  Array.prototype.forEach.call(m.querySelectorAll('.item[data-id]'),function(b){b.addEventListener('click',function(){load(b.dataset.id,true);if(innerWidth<900)hide('left',true);});});
  Array.prototype.forEach.call(m.querySelectorAll('.secs button'),function(b){b.addEventListener('click',function(){menuSec=+b.dataset.s;buildMenu();});});
}

/* ---------- home screen ---------- */
function buildHome(){
  $('hSec').innerHTML=SEC.map(function(s,i){var n=secCount(i);return '<button type="button" data-s="'+i+'"'+(i===homeSec?' class="on"':'')+(n?'':' disabled')+'>'+s+(n?' · '+n:' · жақында')+'</button>';}).join('');
  var cards=[7,8,9,10,11].map(function(g){var ls=labsOf(homeSec,g);if(!ls.length)return '';return '<div class="gcard"><h3>'+g+' сынып</h3>'+ls.map(function(l){return '<button type="button" data-id="'+l.id+'">'+l.name+'</button>';}).join('')+'</div>';}).join('');
  $('hGr').innerHTML=cards||'<p class="note">Бұл бөлім жақында қосылады.</p>';
  Array.prototype.forEach.call($('hGr').querySelectorAll('button'),function(b){b.addEventListener('click',function(){openLab(b.dataset.id);});});
  Array.prototype.forEach.call($('hSec').querySelectorAll('button'),function(b){b.addEventListener('click',function(){homeSec=+b.dataset.s;buildHome();});});
}
function openLab(id){$('home').hidden=true;menuSec=null;load(id,true);try{LS.set('fizlab.seen','1');}catch(e){}}
$('hGo').addEventListener('click',function(){openLab(cur?cur.id:LABS[0].id);});
$('hList').addEventListener('click',function(){$('hGr').scrollIntoView({behavior:'smooth',block:'center'});});
$('bHome').addEventListener('click',function(){$('home').hidden=false;$('intro').hidden=true;});

/* ---------- panels ---------- */
function hide(side,v){$(side).classList.toggle('hide',v);(side==='left'?$('bMenu'):$('bPanel')).classList.toggle('on',!v);LS.set('fizlab.'+side,v?'0':'1');}
function setTab(t){
  Array.prototype.forEach.call(document.querySelectorAll('.tabs button'),function(b){b.setAttribute('aria-selected',b.dataset.t===t?'true':'false');});
  $('pCtl').hidden=t!=='ctl';$('pExp').hidden=t!=='exp';$('pProb').hidden=t!=='prob';if(t==='prob')probRender();
}
Array.prototype.forEach.call(document.querySelectorAll('.tabs button'),function(b){b.addEventListener('click',function(){setTab(b.dataset.t);});});
$('bMenu').addEventListener('click',function(){hide('left',!$('left').classList.contains('hide'));});
$('bPanel').addEventListener('click',function(){hide('right',!$('right').classList.contains('hide'));});
$('bTheory').addEventListener('click',showIntro);
$('bPause').addEventListener('click',function(){paused=!paused;if(!paused)started=true;this.textContent=paused?(started?'Жалғастыру':'▶ Іске қосу'):'Тоқтату';var hn=$('hint');if(!paused)hn.hidden=true;});
$('bReset').addEventListener('click',function(){rebuild();if(DYN.indexOf(cur.id)>=0){paused=true;started=false;$('bPause').textContent='▶ Іске қосу';}});
$('intro').addEventListener('click',function(e){if(e.target===$('intro'))$('intro').hidden=true;});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(!$('home').hidden)return;$('intro').hidden=true;$('pop').hidden=true;}});

/* ---------- palette ---------- */
function buildPop(){
  var pop=$('pop');
  pop.innerHTML=Object.keys(PAL).map(function(k){var x=PAL[k];return '<button type="button" data-k="'+k+'" aria-pressed="'+(k===palKey)+'"><i style="background:linear-gradient(90deg,'+x.sw[0]+' 50%,'+x.sw[1]+' 50%)"></i>'+x.n+'</button>';}).join('');
  Array.prototype.forEach.call(pop.querySelectorAll('button'),function(b){b.addEventListener('click',function(){setPal(b.dataset.k);});});
}
function setPal(k){palKey=k;LS.set('fizlab.pal2',k);applyPalette();buildPop();if(cur)rebuild();}
$('bTheme').addEventListener('click',function(){$('pop').hidden=!$('pop').hidden;});

/* ---------- loop ---------- */
var last=performance.now();
function tick(now){
  var dt=Math.min(.05,(now-last)/1000);last=now;
  if(cur&&S){
    var rq=cur.step(paused?0:dt,P,S);if(rq)rebuild();
    if(frame%6===0)drawReads();
  }
  var a=pgeo.attributes.position.array;for(var i=0;i<PN;i++){a[i*3+1]+=pv[i]*dt;if(a[i*3+1]>24)a[i*3+1]=0;}pgeo.attributes.position.needsUpdate=true;
  frame++;placeCam();renderer.render(scene,camera);requestAnimationFrame(tick);
}
(function init(){
  var sp=LS.get('fizlab.pal2');if(sp&&PAL[sp])palKey=sp;
  applyPalette();buildPop();resize();
  var id=(location.hash||'').slice(1),ok=function(x){return LABS.filter(function(l){return l.id===x;}).length>0;};
  var first=ok(id)?id:(ok(LS.get('fizlab.last'))?LS.get('fizlab.last'):LABS[0].id);
  var small=innerWidth<900;
  var seen=!!id;
  load(first,false);buildHome();
  if(seen){$('home').hidden=true;showIntro();}
  hide('left',small||LS.get('fizlab.left')==='0');
  hide('right',small||LS.get('fizlab.right')==='0');
  requestAnimationFrame(tick);
})();
</script>

</body></html>
