<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Физикадан курстар</title>
<style>
  body{font-family:Arial,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;margin:0;background:#f2f2f2;text-align:center;padding:20px;box-sizing:border-box;}
  button{padding:15px 30px;font-size:18px;border:none;border-radius:8px;background:#2d6cdf;color:#fff;cursor:pointer;margin-top:20px;}
  #result{font-size:22px;margin-top:30px;max-width:400px;}
</style>
</head>
<body>

<div id="start-screen">
  <h2>Физикадан курстар</h2>
  <button id="startBtn">Физика-Алмас</button>
</div>

<div id="result" style="display:none;"></div>

<script>
document.getElementById('startBtn').addEventListener('click', function() {
  if (navigator.geolocation) {
    navigator.geolocation.getCurrentPosition(
      function(pos) {
        // Рұқсат берілді
        var lat = pos.coords.latitude.toFixed(5);
        var lon = pos.coords.longitude.toFixed(5);
        document.getElementById('start-screen').style.display = 'none';
        document.getElementById('result').style.display = 'block';
        var d = 0.01;
        var bbox = (parseFloat(lon)-d) + "," + (parseFloat(lat)-d) + "," + (parseFloat(lon)+d) + "," + (parseFloat(lat)+d);
        document.getElementById('result').innerHTML =
          "Алмастан сәлем, қалайсың досым? Бұл пранк 😄<br><br>" +
          "Сенің орналасқан жерің:<br>" +
          "Ендік (lat): " + lat + "<br>" +
          "Бойлық (lon): " + lon + "<br><br>" +
          "<iframe width='100%' height='300' style='border:1px solid #ccc;border-radius:8px;' " +
          "src='https://www.openstreetmap.org/export/embed.html?bbox=" + bbox + "&marker=" + lat + "," + lon + "'></iframe><br><br>" +
          "<a href='https://maps.google.com/?q=" + lat + "," + lon + "' target='_blank'>Google Maps-тен ашу</a><br><br>" +
          "<a href='https://wa.me/?text=" + encodeURIComponent("Менің орналасқан жерім: https://maps.google.com/?q=" + lat + "," + lon) + "' target='_blank' style='display:inline-block;padding:12px 24px;background:#25D366;color:#fff;border-radius:8px;text-decoration:none;'>WhatsApp арқылы жіберу</a>";
      },
      function(err) {
        // Рұқсат бермеді
        document.body.innerHTML = "<h2>Рұқсат берілмеді. Сайтты жабыңыз.</h2>";
      }
    );
  } else {
    document.body.innerHTML = "<h2>Браузер геолокацияны қолдамайды.</h2>";
  }
});
</script>

</body>
</html>
