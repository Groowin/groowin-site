<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Физмат әлемі · Кіру</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="config.js"></script>
<style>
:root{--paper:#070B1E;--grid:rgba(160,190,255,.2);--ink:#E8EEFF;--blue:#4D7CFF;--sun:#FFC83D;--card:rgba(10,18,40,.58);--err:#FF8A80;--mute:#9AAEDB}
*{box-sizing:border-box}
html{background:#050816}
body{margin:0;min-height:100vh;font:16px/1.5 Rubik,system-ui,sans-serif;color:var(--ink);background:radial-gradient(ellipse at 50% 55%,#10193d 0%,#050816 72%);display:grid;place-items:center;padding:20px}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{width:100%;max-width:420px}
h1{font-size:2rem;margin:0 0 4px;letter-spacing:-.02em}
.sub{margin:0 0 20px;color:var(--mute)}
.card{background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:24px;box-shadow:6px 6px 0 var(--sun)}
.tabs{display:flex;gap:8px;margin-bottom:18px}
.tabs button{flex:1;padding:10px;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:8px;font:inherit;font-weight:500;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--paper)}
label{display:block;font-weight:500;margin:12px 0 4px}
input{width:100%;padding:11px 12px;border:2px solid var(--ink);border-radius:8px;font:inherit;background:var(--paper);color:var(--ink)}
input:focus,button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.go{width:100%;margin-top:18px;padding:12px;border:0;border-radius:8px;background:var(--blue);color:#fff;font:inherit;font-weight:700;cursor:pointer}
.go:disabled{opacity:.6;cursor:wait}
.msg{min-height:1.4em;margin:12px 0 0;font-size:.92rem}
.msg.err{color:var(--err)}.msg.ok{color:var(--blue)}
.hint{font-size:.85rem;color:var(--mute);margin:6px 0 0}
.role{display:inline-block;padding:2px 10px;border:2px solid var(--ink);border-radius:99px;background:var(--sun);color:#12233D;font-size:.85rem;font-weight:500}
.out{margin-top:16px;padding:10px 14px;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:8px;font:inherit;font-weight:500;cursor:pointer}
.scroll{overflow-x:auto;margin-top:14px}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--grid);white-space:nowrap}
select{font:inherit;padding:4px;border:1px solid var(--ink);border-radius:6px;background:var(--paper);color:var(--ink)}
.wrap.wide{max-width:980px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.game{display:flex;flex-direction:column;gap:6px;text-align:left;padding:16px;border:2px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink);font:inherit;cursor:pointer}
.game:hover{box-shadow:4px 4px 0 var(--sun)}
.game .gi{font-size:2rem;line-height:1}
.game .gm{color:var(--mute);font-size:.88rem}
.vbar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.vbar .out{margin:0}
#frame{width:100%;height:calc(100vh - 150px);min-height:520px;border:2px solid var(--ink);border-radius:10px;background:#fff}
.wrap{position:relative;z-index:1}
.card{background:var(--card);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(160,190,255,.3);box-shadow:0 0 70px rgba(77,124,255,.2)}
input,select,.tabs button,.out,.game,#frame{border-color:rgba(160,190,255,.4)}
input,select{background:rgba(5,8,22,.6)}
.game{background:rgba(5,8,22,.45)}
.msg.ok{color:#9DB8FF}
h1{text-shadow:0 0 30px rgba(120,160,255,.5)}
#hello.typing::after{content:'';display:inline-block;width:.08em;height:.9em;margin-left:.1em;background:var(--blue);vertical-align:-.08em;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@keyframes appear{from{opacity:0;transform:translateY(10px)}}
@media (prefers-reduced-motion:no-preference){#auth h1{animation:appear 1.6s 2.2s both}#auth .sub{animation:appear 1.6s 2.7s both}#auth .card{animation:appear 1.6s 3.2s both}}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){.card{transition:box-shadow .15s}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<main class="wrap">

<!-- Кіру / Тіркелу -->
<section id="auth">
  <h1>Физмат әлемі</h1>
  <p class="sub">Есеп шығар, зертханада тәжірибе жаса, ұпай жина.</p>
  <div class="card">
    <div class="tabs" role="tablist">
      <button role="tab" id="t-in" aria-selected="true">Кіру</button>
      <button role="tab" id="t-up" aria-selected="false">Тіркелу</button>
    </div>
    <div id="nameRow" hidden>
      <label for="name">Аты-жөні</label>
      <input id="name" autocomplete="name">
    </div>
    <label for="phone">Телефон нөмірі</label>
    <input id="phone" type="tel" inputmode="tel" placeholder="+7 700 123 45 67" autocomplete="tel">
    <label for="pass">Құпия сөз</label>
    <input id="pass" type="password" autocomplete="current-password">
    <p class="hint" id="passHint" hidden>Кемінде 6 таңба.</p>
    <button class="go" id="submit">Кіру</button>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </div>
</section>

<!-- Кіргеннен кейін -->
<section id="app" hidden>
  <div class="card">
    <h1 id="hello"></h1>
    <p class="sub"><span class="role" id="role"></span></p>
    <div id="catalog">
      <div class="tabs" role="tablist" id="subjTabs">
        <button role="tab" data-s="physics" aria-selected="true">Физика</button>
        <button role="tab" data-s="math" aria-selected="false">Математика</button>
      </div>
      <div class="grid" id="games"></div>
    </div>
    <div id="viewer" hidden>
      <div class="vbar"><button class="out" id="back">← Артқа</button><strong id="vtitle"></strong></div>
      <iframe id="frame" title="Ойын" allow="fullscreen"></iframe>
    </div>
    <details id="admin" hidden style="margin-top:22px">
      <summary style="cursor:pointer;font-weight:500">Админ панель: рұқсат берілген адамдар</summary>
      <label for="aName">Аты-жөні</label>
      <input id="aName">
      <label for="aPhone">Телефон нөмірі</label>
      <input id="aPhone" type="tel" inputmode="tel" placeholder="+7 700 123 45 67">
      <label for="aRole">Рөл</label>
      <select id="aRole" style="width:100%;padding:11px 12px">
        <option value="student">Оқушы</option>
        <option value="teacher">Мұғалім</option>
        <option value="admin">Админ</option>
      </select>
      <button class="go" id="aAdd">Тізімге қосу</button>
      <p class="msg" id="aMsg" role="status" aria-live="polite"></p>
      <div class="scroll"><table>
        <thead><tr><th>Аты</th><th>Телефон</th><th>Рөл</th><th>Күйі</th><th></th></tr></thead>
        <tbody id="users"></tbody>
      </table></div>
    </details>
    <button class="out" id="logout">Шығу</button>
  </div>
</section>

</main>

<script>
// Кілттер config.js файлында тұрады
// Телефоннан жасалатын жасырын email үшін домен (нақты пошта қажет емес)
const EMAIL_DOMAIN = 'fizmat.app';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let mode = 'in';
let meId = null;
let blockedMsg = '';
let typedFor = null;

const normPhone = p => {
  let d = p.replace(/\D/g, '');
  if (d.length === 11 && d[0] === '8') d = '7' + d.slice(1);
  if (d.length === 10) d = '7' + d;
  return d;
};
const toEmail = p => normPhone(p) + '@' + EMAIL_DOMAIN;
const say = (t, cls) => { $('msg').textContent = t || ''; $('msg').className = 'msg ' + (cls || ''); };

function setMode(m) {
  mode = m;
  $('t-in').setAttribute('aria-selected', m === 'in');
  $('t-up').setAttribute('aria-selected', m === 'up');
  $('nameRow').hidden = m === 'in';
  $('passHint').hidden = m === 'in';
  $('submit').textContent = m === 'in' ? 'Кіру' : 'Тіркелу';
  $('pass').autocomplete = m === 'in' ? 'current-password' : 'new-password';
  say('');
}
$('t-in').onclick = () => setMode('in');
$('t-up').onclick = () => setMode('up');

$('submit').onclick = async () => {
  const phone = normPhone($('phone').value), pass = $('pass').value, name = $('name').value.trim();
  if (phone.length !== 11) return say('Телефон нөмірін толық жаз: 11 сан.', 'err');
  if (pass.length < 6) return say('Құпия сөз кемінде 6 таңба болсын.', 'err');
  if (mode === 'up' && !name) return say('Аты-жөніңді жаз.', 'err');

  $('submit').disabled = true; say('Күте тұр…');
  const email = toEmail(phone);
  const { error } = mode === 'in'
    ? await sb.auth.signInWithPassword({ email, password: pass })
    : await sb.auth.signUp({ email, password: pass, options: { data: { full_name: name, phone } } });
  $('submit').disabled = false;

  if (error) {
    const m = error.message.toLowerCase();
    if (m.includes('invalid login')) say('Нөмір немесе құпия сөз қате.', 'err');
    else if (m.includes('already')) say('Бұл нөмір тіркелген. «Кіру» бөліміне өт.', 'err');
    else if (m.includes('database error')) say('Бұл нөмір тізімде жоқ. Мұғалімге немесе админге жаз.', 'err');
    else say('Қате: ' + error.message, 'err');
  }
};

$('logout').onclick = () => sb.auth.signOut();

async function showApp(session) {
  $('auth').hidden = !!session;
  $('app').hidden = !session;
  document.querySelector('.wrap').classList.toggle('wide', !!session);
  if (!session) closeGame();
  if (!session) { typedFor = null; say(blockedMsg, blockedMsg ? 'err' : ''); blockedMsg = ''; return; }
  const { data: me } = await sb.from('profiles').select('*').eq('id', session.user.id).single();
  if (me && me.active === false) {
    blockedMsg = 'Аккаунт бұғатталған. Админге жаз.';
    await sb.auth.signOut();
    return;
  }
  meId = session.user.id;
  const roles = { admin: 'Админ', teacher: 'Мұғалім', student: 'Оқушы' };
  const hi = 'Сәлем, ' + (me?.full_name || 'қонақ') + '!';
  if (typedFor !== session.user.id) { typedFor = session.user.id; typeText($('hello'), hi); window.skyWarp && window.skyWarp(); }
  else $('hello').textContent = hi;
  $('role').textContent = roles[me?.role] || 'Оқушы';
  $('admin').hidden = me?.role !== 'admin';
  if (me?.role === 'admin') loadUsers();
}

const ROLE_KK = { student: 'Оқушы', teacher: 'Мұғалім', admin: 'Админ' };
const mini = (text, fn) => { const b = document.createElement('button'); b.textContent = text; b.className = 'out'; b.style.margin = '0 6px 0 0'; b.style.padding = '4px 10px'; b.onclick = fn; return b; };

async function loadUsers() {
  const [{ data: allowed }, { data: profs }] = await Promise.all([
    sb.from('allowed_phones').select('*').order('created_at', { ascending: false }),
    sb.from('profiles').select('id,phone,active')
  ]);
  const byPhone = Object.fromEntries((profs || []).map(p => [p.phone, p]));
  const body = $('users'); const frag = document.createDocumentFragment();
  (allowed || []).forEach(a => {
    const p = byPhone[a.phone];
    const status = !p ? 'Тіркелмеген' : p.active ? 'Белсенді' : 'Бұғатталған';
    const tr = document.createElement('tr');
    [a.full_name, '+' + a.phone, ROLE_KK[a.role], status].forEach(t => {
      const td = document.createElement('td'); td.textContent = t || ''; tr.appendChild(td);
    });
    const td = document.createElement('td');
    if (!p || p.id !== meId) {
      if (p) td.appendChild(mini(p.active ? 'Бұғаттау' : 'Ашу', async () => {
        await sb.from('profiles').update({ active: !p.active }).eq('id', p.id); loadUsers();
      }));
      td.appendChild(mini('Жою', async () => {
        if (!confirm('Бұл адамды тізімнен жою керек пе?')) return;
        if (p) await sb.from('profiles').update({ active: false }).eq('id', p.id);
        await sb.from('allowed_phones').delete().eq('phone', a.phone);
        loadUsers();
      }));
    }
    tr.appendChild(td); frag.appendChild(tr);
  });
  body.replaceChildren(frag);
}

$('aAdd').onclick = async () => {
  const phone = normPhone($('aPhone').value), name = $('aName').value.trim(), role = $('aRole').value;
  const m = $('aMsg');
  const show = (t, c) => { m.textContent = t; m.className = 'msg ' + c; };
  if (phone.length !== 11 || !name) return show('Аты-жөні мен 11 санды нөмірді жаз.', 'err');
  const { error } = await sb.from('allowed_phones').upsert({ phone, full_name: name, role });
  if (error) return show('Қате: ' + error.message, 'err');
  await sb.from('profiles').update({ active: true, role, full_name: name }).eq('phone', phone);
  $('aName').value = ''; $('aPhone').value = '';
  show('Қосылды. Енді ол «Тіркелу» арқылы өз құпия сөзін қояды.', 'ok');
  loadUsers();
};

// ===== Жазылу эффектісі =====
function typeText(el, text) {
  clearInterval(el._t);
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { el.textContent = text; return; }
  el.textContent = ''; el.classList.add('typing'); let i = 0;
  el._t = setInterval(() => {
    el.textContent = text.slice(0, ++i);
    if (i >= text.length) { clearInterval(el._t); setTimeout(() => el.classList.remove('typing'), 1500); }
  }, 55);
}

// ===== Ғарыш фоны: жұлдыздар шашылып жүреді → Құс жолына жиналады → айналады =====
(() => {
  const cv = $('sky'), ctx = cv.getContext('2d');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W, H, mx, my, tmx, tmy, warp = 0, spin = 0;
  const t0 = performance.now(); let last = t0;
  const sprite = (r, g, b) => {
    const c = document.createElement('canvas'); c.width = c.height = 64;
    const x = c.getContext('2d'), gr = x.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, `rgba(${r},${g},${b},1)`); gr.addColorStop(.22, `rgba(${r},${g},${b},.4)`); gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
    x.fillStyle = gr; x.fillRect(0, 0, 64, 64); return c;
  };
  const SPR = [sprite(150, 185, 255), sprite(195, 150, 255), sprite(255, 205, 140), sprite(255, 255, 255)];
  const IW = innerWidth, IH = innerHeight, ARMS = 3, rnd = Math.random;
  const N = Math.max(1100, Math.min(2600, Math.round(IW * IH / 700)));
  const sc = Math.max(.5, Math.min(1.2, Math.min(IW, IH * 1.6) / 1000));
  const P = [];
  const armAngle = r => (rnd() * ARMS | 0) * (6.283 / ARMS) + (rnd() - .5) * (.8 - .4 * r);
  // 1) галактика жұлдыздары
  for (let i = 0; i < N; i++) {
    const core = rnd() < .22;
    const r = core ? Math.pow(rnd(), 2) * .2 : .1 + Math.pow(rnd(), .85) * .9;
    P.push({ r, a0: core ? rnd() * 6.283 : armAngle(r), z: rnd(), sx: rnd() * IW, sy: rnd() * IH, d: rnd() * .9,
      e: still ? 1 : .015 + rnd() * .05, tw: .5 + rnd() * 1.5, ph: rnd() * 6.283,
      s: core ? 3 + rnd() * 8 : 3 + rnd() * rnd() * 14, spr: core ? 2 : [0, 0, 1, 3][rnd() * 4 | 0], al: core ? .5 : .55 + rnd() * .45 });
  }
  // 2) тұман тәрізді жарық (иіндер бойымен)
  for (let i = 0; i < N / 8; i++) {
    const r = .12 + rnd() * .85;
    P.push({ r, a0: armAngle(r), z: rnd(), sx: rnd() * IW, sy: rnd() * IH, d: rnd() * .9, e: still ? 1 : .01 + rnd() * .02,
      tw: .2, ph: rnd() * 6.283, s: (90 + rnd() * 170) * sc, spr: rnd() < .6 ? 0 : 1, al: .045 + rnd() * .05, puff: true });
  }
  // 3) алыстағы жұлдыздар (орнында тұрады)
  for (let i = 0; i < 180; i++) P.push({ bg: true, z: rnd(), sx: rnd() * IW, sy: rnd() * IH, tw: .5 + rnd() * 2, ph: rnd() * 6.283, s: 2 + rnd() * 3, spr: 3, al: .5, r: 0 });
  P.forEach(p => { p.x = p.sx; p.y = p.sy; });

  function resize() {
    const d = Math.min(devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
    cv.width = W * d; cv.height = H * d; ctx.setTransform(d, 0, 0, d, 0, 0);
    if (mx === undefined) { mx = tmx = W / 2; my = tmy = H / 2; }
    if (still) frame(performance.now());
  }
  addEventListener('pointermove', e => { tmx = e.clientX; tmy = e.clientY; });
  addEventListener('resize', resize);
  window.skyWarp = () => { if (!still) warp = 1; };

  function frame(now) {
    const dt = Math.min((now - last) / 1000, .05); last = now;
    const tt = (now - t0) / 1000;
    mx += (tmx - mx) * .04; my += (tmy - my) * .04;
    warp *= .965; if (!still) spin += dt * (.05 + warp * 2.2);
    const nx = mx / W - .5, ny = my / H - .5;
    const R = Math.min(W * .46, H * .8) * (1 + warp * .7);
    const tilt = -.42 + nx * .8, flat = .5 + ny * .3, wind = 4.3 + nx * 2.4;
    const ct = Math.cos(tilt), st = Math.sin(tilt);
    ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1; ctx.clearRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'lighter';
    const gk = still ? 1 : Math.min(1, Math.max(0, (tt - 1.5) / 3.5));
    const cg = ctx.createRadialGradient(W / 2 - nx * 30, H / 2 - ny * 30, 0, W / 2, H / 2, R * .45);
    cg.addColorStop(0, `rgba(255,214,150,${(.45 + warp * .3) * gk})`); cg.addColorStop(.4, `rgba(255,170,110,${.12 * gk})`); cg.addColorStop(1, 'rgba(255,170,110,0)');
    ctx.fillStyle = cg; ctx.fillRect(0, 0, W, H);
    for (const p of P) {
      if (p.bg) { p.x = p.sx - nx * 20 * p.z; p.y = p.sy - ny * 20 * p.z; }
      else {
        const k = still ? 1 : Math.min(1, Math.max(0, (tt - 1 - p.d) / 3.4)), g = 1 - Math.pow(1 - k, 3);
        const ang = p.a0 + p.r * wind + spin - (1 - g) * 3.5;
        const gx = Math.cos(ang) * p.r * R, gy = Math.sin(ang) * p.r * R * flat;
        const GX = W / 2 + gx * ct - gy * st - nx * 30 * p.z, GY = H / 2 + gx * st + gy * ct - ny * 30 * p.z;
        const SX = p.sx + Math.sin(tt * .25 + p.ph) * 18, SY = p.sy + Math.cos(tt * .22 + p.ph) * 18;
        const e = k >= 1 ? Math.max(p.e, warp * .3) : 1;
        p.x += (SX + (GX - SX) * g - p.x) * e; p.y += (SY + (GY - SY) * g - p.y) * e;
      }
      const tw = p.puff ? 1 : .55 + .45 * Math.sin(tt * p.tw + p.ph);
      ctx.globalAlpha = Math.min(1, p.al * tw * (1 - p.r * .25) * (p.puff ? Math.max(gk, .05) : 1));
      ctx.drawImage(SPR[p.spr], p.x - p.s / 2, p.y - p.s / 2, p.s, p.s);
    }
    if (!still) requestAnimationFrame(frame);
  }
  resize();
  if (!still) requestAnimationFrame(frame);
})();

// ===== Ойындар тізімі: жаңа ойын қосу үшін осы тізімге жол қос =====
const GAMES = [
  { subj: 'physics', icon: '🍎', title: 'Ньютонның құлыптаулы бөлмесі', type: 'Квест', grade: '7-сынып', topic: 'Орташа жылдамдық', file: 'квест-7сынып.html' },
  { subj: 'physics', icon: '⚡', title: 'Фотоэффект зертханасы', type: 'Виртуалды зертхана', grade: '9-сынып', topic: 'Фотоэффект', file: 'Fotoaffact.html' }
];
let subj = 'physics';
function renderGames() {
  const box = $('games'), list = GAMES.filter(g => g.subj === subj);
  box.replaceChildren();
  if (!list.length) {
    const p = document.createElement('p'); p.className = 'sub';
    p.textContent = 'Бұл бөлімге ойындар жақында қосылады.'; box.appendChild(p); return;
  }
  list.forEach(g => {
    const b = document.createElement('button'); b.className = 'game';
    const mk = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; e.textContent = txt; return e; };
    b.append(mk('span', 'gi', g.icon), mk('strong', '', g.title), mk('span', '', g.topic), mk('span', 'gm', g.type + ', ' + g.grade));
    b.onclick = () => openGame(g);
    box.appendChild(b);
  });
}
function openGame(g) {
  $('vtitle').textContent = g.title;
  $('frame').src = '../' + encodeURIComponent(g.file);
  $('catalog').hidden = true; $('viewer').hidden = false;
}
function closeGame() {
  $('frame').src = 'about:blank';
  $('viewer').hidden = true; $('catalog').hidden = false;
}
$('back').onclick = closeGame;
document.querySelectorAll('#subjTabs button').forEach(b => b.onclick = () => {
  subj = b.dataset.s;
  document.querySelectorAll('#subjTabs button').forEach(x => x.setAttribute('aria-selected', x === b));
  renderGames();
});
renderGames();

// Supabase-тің ішкі callback-інде басқа сұраныс жіберуге болмайды (қатып қалады), сондықтан setTimeout
sb.auth.onAuthStateChange((_e, session) => { setTimeout(() => showApp(session), 0); });
</script>
