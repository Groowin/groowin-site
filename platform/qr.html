<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QR-қатысу · Groowin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="config.js" onerror="void 0"></script>
<style>
:root,[data-th=dark]{--bg:#0d1117;--card:#151b23;--line:#262e3a;--tx:#e9edf3;--mu:#8a94a4;--ok:#22c3a6;--hot:#ff7a45;--inp:#0d1117;--on:#04130f;--f:'Noto Sans','Segoe UI',system-ui,sans-serif}
[data-th=light]{--bg:#f5f6f8;--card:#ffffff;--line:#e2e5ea;--tx:#151a22;--mu:#677183;--ok:#0e9f85;--hot:#e5602a;--inp:#f5f6f8;--on:#ffffff}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--tx);font:400 16px/1.45 var(--f);-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ok);outline-offset:2px}
.wrap{max-width:1500px;margin:0 auto;padding:22px clamp(14px,3vw,36px) 40px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.logo{width:36px;height:36px;border-radius:10px;background:var(--tx);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:18px}
.top h1{margin:0;font:700 20px/1.1 var(--f)}
.top small{display:block;color:var(--mu);font-weight:400;font-size:13px;margin-top:2px}
.sp{flex:1}
.tile{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px}
.tile h2{margin:0 0 14px;font:600 12px var(--f);letter-spacing:.09em;text-transform:uppercase;color:var(--mu)}
.btn{border-radius:12px;padding:12px 20px;font-weight:600;background:transparent;border:1px solid var(--line);transition:background .15s,border-color .15s}
.btn:hover{border-color:var(--mu)}
.btn.main{background:var(--ok);color:var(--on);border-color:var(--ok)}
.btn.main:hover{filter:brightness(1.08)}
.btn.hot{color:var(--hot);border-color:var(--hot)}
.btn.sm{padding:7px 12px;border-radius:10px;font-size:14px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.tip{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;border:1px solid var(--line);color:var(--mu);font:600 11px var(--f);cursor:help;position:relative;vertical-align:middle;margin-left:6px;text-transform:none;letter-spacing:0}
.tip:hover::after,.tip:focus::after{content:attr(data-t);position:absolute;left:50%;top:24px;transform:translateX(-50%);width:240px;padding:10px 12px;border-radius:10px;background:var(--tx);color:var(--bg);font:400 13px/1.4 var(--f);z-index:20;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.setup{display:grid;grid-template-columns:1.5fr 1fr;gap:16px}
.groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.gt{text-align:left;padding:16px;border-radius:14px;background:transparent;border:1px solid var(--line);position:relative;min-height:96px;transition:border-color .15s,background .15s}
.gt:hover{border-color:var(--mu)}
.gt b{display:block;font:700 22px/1.1 var(--f);margin-bottom:6px}
.gt span{color:var(--mu);font-size:14px}
.gt.sel{border-color:var(--ok);box-shadow:inset 0 0 0 1px var(--ok)}
.gt.sel::after{content:"✓";position:absolute;right:12px;top:10px;width:22px;height:22px;border-radius:50%;background:var(--ok);color:var(--on);display:grid;place-items:center;font-weight:700;font-size:13px}
.gt.add{border-style:dashed;display:grid;place-items:center;color:var(--mu);font-weight:600}
.gt .ed{position:absolute;right:12px;bottom:10px;font-size:12px;color:var(--mu);text-decoration:underline;background:none;border:0;padding:0}
.fld{display:grid;gap:6px;margin-bottom:16px}
.fld label{font-weight:600;color:var(--mu);font-size:13px}
.inp{width:100%;padding:11px 14px;border-radius:10px;background:var(--inp);border:1px solid var(--line);outline:0}
.inp:focus{border-color:var(--ok)}
textarea.inp{min-height:240px;resize:vertical;line-height:1.55}
input[type=range]{width:100%;accent-color:var(--ok)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chk{display:flex;gap:10px;align-items:center;font-weight:600}
.chk input{width:20px;height:20px;accent-color:var(--ok)}
.live{display:grid;grid-template-rows:auto 1fr;grid-template-columns:minmax(360px,660px) 1fr;grid-template-areas:"qr stat" "qr roster";gap:16px;align-items:start}
.qrT{grid-area:qr;display:grid;justify-items:center;gap:14px;text-align:center}
.ring{position:relative;width:min(100%,70vh,620px);aspect-ratio:1}
.ring svg.rg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .qbox{position:absolute;inset:6%;background:#fff;border-radius:14px;padding:2.6%;display:grid;place-items:center}
.ring .qbox svg{width:100%;height:100%;display:block}
.code{font:700 32px/1 var(--f);letter-spacing:.16em}
.hintx{color:var(--mu);font-size:14px}
.statT{grid-area:stat;align-items:start;display:grid;grid-template-columns:1.1fr 1fr;gap:16px}
.big{font:700 clamp(56px,7vw,100px)/1 var(--f);letter-spacing:-.03em}
.big small{font-size:.38em;color:var(--mu);font-weight:600;letter-spacing:0}
.bar{height:6px;border-radius:4px;background:var(--line);overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .5s}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;font-size:13px;color:var(--mu)}
.legend b{color:var(--tx)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.acts{display:grid;gap:8px;align-content:start}
.rosterT{grid-area:roster}
.stu{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.st{border-radius:12px;padding:12px;text-align:left;background:transparent;border:1px solid var(--line);min-height:72px;transition:all .3s;display:grid;align-content:space-between;gap:6px}
.st b{font:600 15px/1.2 var(--f);word-break:break-word}
.st span{font-size:12px;color:var(--mu)}
.st.ok{background:var(--ok);border-color:var(--ok);color:var(--on);animation:pop .6s}
.st.ok span{color:var(--on);opacity:.8}
.st.far{border-color:var(--hot);background:transparent;box-shadow:inset 0 0 0 1px var(--hot)}
.st.far span{color:var(--hot)}
.st.nogeo{border-color:var(--hot);border-style:dashed}
.st.nogeo span{color:var(--hot)}
@keyframes pop{0%{transform:scale(.94)}60%{transform:scale(1.03)}100%{transform:none}}
.note{padding:11px 14px;border-radius:10px;border:1px solid var(--hot);color:var(--hot);font-size:14px;margin-bottom:14px}
body.fs .top,body.fs .acts,body.fs .note{display:none}
body.fs .ring{width:min(100%,80vh)}
.stw{max-width:520px;margin:0 auto;padding:20px 16px 40px}
.sbig{font:700 26px/1.2 var(--f);margin:6px 0 4px}
.stn{display:grid;gap:8px;margin-top:14px}
.sn{padding:16px 18px;border-radius:12px;background:var(--card);border:1px solid var(--line);font:600 17px var(--f);text-align:left;display:flex;justify-content:space-between;align-items:center}
.sn[disabled]{opacity:.35;cursor:not-allowed}
.sn:active:not([disabled]){border-color:var(--ok)}
.res{text-align:center;padding:34px 22px;border-radius:20px;margin-top:20px;background:var(--card);border:1px solid var(--line)}
.res .ic{width:88px;height:88px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;font-size:44px;font-weight:700}
.res.ok{border-color:var(--ok)}.res.ok .ic{background:var(--ok);color:var(--on);animation:pop .7s}
.res.bad{border-color:var(--hot)}.res.bad .ic{background:var(--hot);color:#fff}
.help{margin-top:16px;text-align:left;font-size:14px;color:var(--mu);border-top:1px solid var(--line);padding-top:14px}
.help b{color:var(--tx)}
.spin{width:40px;height:40px;border-radius:50%;border:4px solid var(--line);border-top-color:var(--ok);animation:sp 1s linear infinite;margin:40px auto}
@keyframes sp{to{transform:rotate(360deg)}}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;z-index:50;padding:16px}
.modal .tile{width:min(560px,100%);max-height:92vh;overflow:auto}
@media (max-width:900px){.setup{grid-template-columns:1fr}.live{grid-template-columns:1fr;grid-template-areas:"qr" "stat" "roster"}.statT{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>

var qrcode = function() {
  var qrcode = function(typeNumber, errorCorrectionLevel) {
    var PAD0 = 0xEC;
    var PAD1 = 0x11;
    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];
    var _this = {};
    var makeImpl = function(test, maskPattern) {
      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);
      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);
      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }
      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }
      mapData(_dataCache, maskPattern);
    };
    var setupPositionProbePattern = function(row, col) {
      for (var r = -1; r <= 7; r += 1) {
        if (row + r <= -1 || _moduleCount <= row + r) continue;
        for (var c = -1; c <= 7; c += 1) {
          if (col + c <= -1 || _moduleCount <= col + c) continue;
          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };
    var getBestMaskPattern = function() {
      var minLostPoint = 0;
      var pattern = 0;
      for (var i = 0; i < 8; i += 1) {
        makeImpl(true, i);
        var lostPoint = QRUtil.getLostPoint(_this);
        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }
      return pattern;
    };
    var setupTimingPattern = function() {
      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }
      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };
    var setupPositionAdjustPattern = function() {
      var pos = QRUtil.getPatternPosition(_typeNumber);
      for (var i = 0; i < pos.length; i += 1) {
        for (var j = 0; j < pos.length; j += 1) {
          var row = pos[i];
          var col = pos[j];
          if (_modules[row][col] != null) {
            continue;
          }
          for (var r = -2; r <= 2; r += 1) {
            for (var c = -2; c <= 2; c += 1) {
              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };
    var setupTypeNumber = function(test) {
      var bits = QRUtil.getBCHTypeNumber(_typeNumber);
      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }
      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };
    var setupTypeInfo = function(test, maskPattern) {
      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);
      for (var i = 0; i < 15; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }
      for (var i = 0; i < 15; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }
      _modules[_moduleCount - 8][8] = (!test);
    };
    var mapData = function(data, maskPattern) {
      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);
      for (var col = _moduleCount - 1; col > 0; col -= 2) {
        if (col == 6) col -= 1;
        while (true) {
          for (var c = 0; c < 2; c += 1) {
            if (_modules[row][col - c] == null) {
              var dark = false;
              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }
              var mask = maskFunc(row, col - c);
              if (mask) {
                dark = !dark;
              }
              _modules[row][col - c] = dark;
              bitIndex -= 1;
              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }
          row += inc;
          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };
    var createBytes = function(buffer, rsBlocks) {
      var offset = 0;
      var maxDcCount = 0;
      var maxEcCount = 0;
      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);
      for (var r = 0; r < rsBlocks.length; r += 1) {
        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;
        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);
        dcdata[r] = new Array(dcCount);
        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;
        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);
        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }
      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }
      var data = new Array(totalCodeCount);
      var index = 0;
      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }
      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }
      return data;
    };
    var createData = function(typeNumber, errorCorrectionLevel, dataList) {
      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);
      var buffer = qrBitBuffer();
      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }
      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }
      while (true) {
        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);
        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }
      return createBytes(buffer, rsBlocks);
    };
    _this.addData = function(data, mode) {
      mode = mode || 'Byte';
      var newData = null;
      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }
      _dataList.push(newData);
      _dataCache = null;
    };
    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };
    _this.getModuleCount = function() {
      return _moduleCount;
    };
    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;
        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();
          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }
          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }
          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }
        _typeNumber = typeNumber;
      }
      makeImpl(false, getBestMaskPattern() );
    };
    _this.createTableTag = function(cellSize, margin) {
      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;
      var qrHtml = '';
      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';
      for (var r = 0; r < _this.getModuleCount(); r += 1) {
        qrHtml += '<tr>';
        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }
        qrHtml += '</tr>';
      }
      qrHtml += '</tbody>';
      qrHtml += '</table>';
      return qrHtml;
    };
    _this.createSvgTag = function(cellSize, margin, alt, title) {
      var opts = {};
      if (typeof arguments[0] == 'object') {
        opts = arguments[0];
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }
      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;
      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;
      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';
      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
