<html lang="kk">
<head>

<style>
:root{--bg:#0E1117;--surf:#151A23;--line:rgba(255,255,255,.1);--ink:#E6E9EF;--mute:#8B93A3;--accent:#3B6BFF;--ok:#1FA971;--bad:#E5484D}

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif}
body{min-height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;font-weight:700;letter-spacing:-.01em}

main{flex:1;display:flex;flex-direction:column;padding:8px 18px 24px;max-width:560px;width:100%;margin:0 auto}
h1{font-size:1.6rem;margin:12px 0 6px;letter-spacing:-.02em}
p{margin:0 0 12px}.mute{color:var(--mute)}
label{display:block;font-weight:600;margin:16px 0 6px}
input{width:100%;padding:14px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surf);color:var(--ink);font:inherit;font-size:1.1rem}
input:focus{outline:2px solid var(--accent);outline-offset:1px}
.go{width:100%;margin-top:18px;padding:15px;border:0;border-radius:12px;background:var(--accent);color:#fff;font:inherit;font-size:1.1rem;font-weight:700;cursor:pointer}
.go:disabled{opacity:.5}
.err{color:var(--bad);min-height:1.4em;margin-top:10px}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px}
.dot{width:14px;height:14px;border-radius:50%;background:var(--accent);animation:pulse 1.2s ease-in-out infinite;margin-bottom:10px}
@keyframes pulse{50%{transform:scale(1.6);opacity:.4}}
.top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.tm{min-width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:#fff;font-weight:800;font-size:1.3rem}
.bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}.bar i{display:block;height:100%;background:var(--accent);transform-origin:left;transition:transform .15s linear}
.q{font-size:1.3rem;font-weight:700;margin:6px 0 12px}
.img{display:block;max-width:100%;max-height:30vh;margin:0 auto 12px;border-radius:12px;object-fit:contain}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:68px;padding:14px 16px;border:0;border-radius:14px;background:var(--c);color:#fff;font:inherit;font-size:1.1rem;font-weight:600;text-align:left;cursor:pointer}
.opt:active{transform:scale(.98)}
.opt:disabled{cursor:default}.opt.dim{opacity:.35}.opt.pick{box-shadow:0 0 0 4px var(--ink)}
.res{font-size:2.4rem;font-weight:800;margin:0}.res.ok{color:var(--ok)}.res.bad{color:var(--bad)}
.pts{font-size:1.4rem;font-weight:700}
.team{align-self:center;padding:4px 14px;border-radius:99px;color:#fff;font-weight:700;font-size:.9rem;margin:0 0 8px}
.numin{display:flex;flex-direction:column;gap:10px;margin-top:6px}.numin input{font-size:1.8rem;text-align:center;font-weight:700;padding:16px}
.wordin{display:flex;gap:8px}.wordin input{flex:1}.wordin .go{width:auto;margin:0;padding:0 22px}
.mine{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:14px}.mine span{padding:5px 12px;border-radius:99px;background:var(--surf);border:1px solid var(--line);font-weight:600}
.big{font-size:3rem;font-weight:800;color:var(--accent);margin:0;line-height:1.1}
#fsb{border:1px solid var(--line);background:var(--surf);color:var(--ink);border-radius:10px;width:36px;height:36px;font-size:1.1rem;cursor:pointer}
#warn{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;padding:28px;background:var(--bg)}
#warn[hidden]{display:none}#warn h1{color:var(--bad)}#warn .go{max-width:340px}
.pv{display:grid;gap:12px;margin-top:10px}
.pvb{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:16px 18px;border:0;border-radius:18px;background:var(--c);color:#fff;font:inherit;font-size:1.25rem;font-weight:700;text-align:left;cursor:pointer;transition:transform .12s,opacity .2s}
.pvb:active{transform:scale(.97)}.pvb .em{font-size:2rem;line-height:1}.pvb.dim{opacity:.4}.pvb.pick{box-shadow:0 0 0 4px var(--ink)}
.ak{display:flex;gap:8px}.ak textarea{flex:1;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surf);color:var(--ink);font:inherit;font-size:1rem;resize:none;min-height:56px}
.ak .go{width:auto;margin:0;padding:0 20px}
.ql{display:grid;gap:8px;margin-top:14px}.qi{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surf)}
.qi.done{opacity:.45;text-decoration:line-through}.qi span{flex:1;overflow-wrap:anywhere}
.up{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;padding:6px 10px;font:inherit;cursor:pointer;white-space:nowrap}.up.on{background:var(--accent);color:#fff;border-color:transparent}
.acc{display:flex;align-items:center;gap:10px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surf);margin-top:14px}
.acc b{font-size:1.1rem}.acc small{color:var(--ok);font-weight:600}
.lnk{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:6px 0;text-decoration:underline}
.sy-s{display:flex;flex-direction:column;gap:12px}.sy-wchip{align-self:center;display:inline-flex;gap:8px;align-items:center;padding:6px 16px;border-radius:99px;background:var(--surf);border:1px solid var(--line)}.sy-wchip b{color:var(--accent)}
.sy-sword{font-size:clamp(2.2rem,11vw,3.6rem);font-weight:900;color:var(--accent);line-height:1.1;word-break:break-word;margin:4px 0;animation:syp .5s both}
.sy-stm{text-align:center;font-weight:900;font-size:1.6rem;font-variant-numeric:tabular-nums}.sy-me{display:flex;flex-direction:column;gap:10px;padding:14px;border:2px solid var(--accent);border-radius:18px;background:var(--surf)}.sy-me h1{margin:0}
.sy-now{display:flex;gap:14px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:16px;background:var(--surf)}
.sy-hist{display:grid;gap:6px}.sy-hr{display:flex;justify-content:space-between;gap:10px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surf)}
.sy-vg{display:grid;grid-template-columns:1fr 1fr;gap:10px}.sy-vb{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 8px;border:2px solid var(--line);border-radius:16px;background:var(--surf);color:var(--ink);font:inherit;font-weight:700;cursor:pointer;transition:transform .12s,border-color .2s}.sy-vb:active{transform:scale(.96)}.sy-vb.pick{border-color:var(--accent);box-shadow:0 0 0 3px rgba(59,107,255,.3)}.sy-vb:disabled{opacity:.5}
@keyframes syp{0%{opacity:0;transform:scale(.7)}60%{transform:scale(1.08)}100%{opacity:1;transform:none}}
.cr-ph{display:flex;flex-direction:column;gap:10px}.cr-wd{text-align:center;font-weight:800;font-size:1.4rem;padding:8px;border-radius:12px;background:var(--surf);border:1px solid var(--line)}
.cr-cv{width:100%;aspect-ratio:4/3;border-radius:14px;background:#fff;touch-action:none;border:1px solid var(--line);cursor:crosshair}
.cr-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:center}.cr-cols{display:flex;gap:6px}
.cr-c{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);cursor:pointer}.cr-c.on{box-shadow:0 0 0 3px var(--accent)}
.cr-w{min-width:40px;height:36px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--surf);color:var(--ink);font:inherit;font-weight:700;cursor:pointer}.cr-w.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.cr-mk{text-align:center;font-size:1.7rem;font-weight:800;letter-spacing:.08em;margin:8px 0;word-break:break-word}
.bs-big{font-size:5rem;line-height:1;animation:bsfl 2.4s ease-in-out infinite}.bs-big.hit{animation:bshit .5s}
@keyframes bsfl{50%{transform:translateY(-8px) scale(1.04)}}@keyframes bshit{30%{transform:scale(1.3) rotate(-8deg)}}
.bs-bars{display:grid;gap:8px;margin-bottom:12px}.bs-bw span{font-size:.85rem;font-weight:700}.bs-bt{height:12px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:3px}
.bs-bt i{display:block;height:100%;transition:width .6s}.bs-bw.boss i{background:var(--bad)}.bs-bw.cls i{background:var(--ok)}
.cr-ph .res{font-size:1.1rem;text-align:center}

@keyframes psc{50%{background-position:100% 50%}}

@media (prefers-reduced-motion:reduce){body::before{animation:none!important}}
#pset{position:fixed;right:12px;top:52px;z-index:40;width:min(340px,calc(100vw - 24px));max-height:80vh;overflow:auto;padding:14px;border-radius:16px;background:var(--surf);border:1px solid var(--line);box-shadow:0 20px 50px -20px rgba(0,0,0,.6)}

<body>
<header><div>Groowin</div><span id="who"></span><button id="psb" type="button" aria-label="Тема мен стиль" title="Тема мен стиль">🎨</button><button id="fsb" type="button" hidden aria-label="Толық экран">⛶</button></header>
<div id="warn" hidden></div>
<main id="m"></main>
<script>
const $ = id => document.getElementById(id);
const el = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x !== undefined) e.textContent = x; return e; };
const COL = ['#E21B3C', '#1368CE', '#D89E00', '#26890C'];
const SHAPE = ['<path d="M12 3 22 20H2z"/>', '<path d="M12 2 22 12 12 22 2 12z"/>', '<circle cx="12" cy="12" r="9"/>', '<rect x="4" y="4" width="16" height="16" rx="1"/>'];
const shape = i => '<svg width="26" height="26" viewBox="0 0 24 24" fill="#fff" aria-hidden="true">' + SHAPE[i] + '</svg>';
const store = { get: k => { try { return sessionStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { sessionStorage.setItem(k, v); } catch {} } };
const m = $('m');
const TNAME = ['Қызыл', 'Көк', 'Сары', 'Жасыл'];
const fmtNum = n => String(Math.round(n * 1e6) / 1e6).replace('.', ',');
let myTeam = -1;
const teamTag = () => { if (myTeam < 0) return null; const t = el('div', 'team', 'Командаң: ' + TNAME[myTeam]); t.style.background = COL[myTeam]; return t; };
const draw = (...n) => { m.replaceChildren(...n); };

let myId = store.get('qid'); if (!myId) { myId = (crypto.randomUUID ? crypto.randomUUID() : String(Math.random()).slice(2) + Date.now()); store.set('qid', myId); }
let strikes = 0, dq = false, away = false, wantFS = false;
let acct = null, guest = false;
const AVE = ['🦊','🐼','🐯','🦁','🐸','🐵','🐧','🦉','🐙','🦄','🐲','🐬','🦋','🐢','🐰','🐨','🦖','🚀','👽','🤖','🧙','🥷','🦸','⚡','🔥','🌟','🎧','🎮','🧠','🍉','🌈','🪐'], AVC = ['#E5484D','#F76B15','#E0A100','#30A46C','#12A594','#3E63DD','#8E4EC6','#D6409F'];
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } }, lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
const avOk = s => { const m = String(s || '').match(/^(.+)\|(\d)$/); return m && AVC[+m[2]] ? { e: m[1], c: +m[2] } : null; };
let myAv = ''; const avCur = () => (acct && !guest && avOk(acct.av) ? acct.av : (avOk(myAv) ? myAv : (avOk(lsGet('avatar')) ? lsGet('avatar') : '')));
function avSpan(av, size) { const a = avOk(av), s = document.createElement('span'); s.textContent = a ? a.e : '🙂'; s.style.cssText = 'display:inline-grid;place-items:center;border-radius:50%;flex:none;width:' + size + 'px;height:' + size + 'px;font-size:' + Math.round(size * .55) + 'px;background:' + (a ? AVC[a.c] : '#667') ; return s; }
async function detectAcct() {
  try {
    const k = Object.keys(localStorage).find(x => /^sb-.*-auth-token$/.test(x)); if (!k) return;
    const s = JSON.parse(localStorage.getItem(k) || 'null'), tok = s && s.access_token, uid = s && s.user && s.user.id; if (!tok || !uid) return;
    const c = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false }, global: { headers: { Authorization: 'Bearer ' + tok } } });
    const { data } = await c.from('profiles').select('full_name,role').eq('id', uid).single();
    if (data && data.role === 'student' && data.full_name) acct = { uid, name: String(data.full_name).trim().slice(0, 20) };
    if (acct) { try { const r2 = await c.from('profiles').select('avatar').eq('id', uid).single(); if (r2.data && r2.data.avatar) acct.av = r2.data.avatar; } catch {} }
  } catch {}
}
let sb = null, ch = null, code = '', name = '', gotState = false, curQ = -1, picked = -1, endAt = 0, tmr = null, helloTimer = null, lastPh = '', done = false;

// ===== Толық экран және басқа бетке өтуді бақылау =====
const fsEl = document.documentElement;
const canFS = !!(fsEl.requestFullscreen || fsEl.webkitRequestFullscreen);
const inFS = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
function enterFS() {
  if (!canFS) return; wantFS = true;
  try { const r = fsEl.requestFullscreen ? fsEl.requestFullscreen({ navigationUI: 'hide' }) : fsEl.webkitRequestFullscreen(); if (r && r.catch) r.catch(() => {}); } catch {}
}
function paintFS() { $('fsb').hidden = !(canFS && !done && gotState && !inFS()); }
$('fsb').onclick = enterFS;
function leave() {
  if (done || dq || away || lastPh !== 'q') return;
  away = true; strikes++; if (strikes >= 2) dq = true;
  try { ch.send({ type: 'broadcast', event: 'away', payload: { id: myId, n: strikes } }); } catch {}
}
function back() {
  if (!away) return; away = false;
  const w = $('warn'); w.replaceChildren();
  if (dq) {
    w.append(el('h1', '', 'Нәтижең өшірілді'), el('p', '', 'Квиз кезінде екінші рет басқа бетке не бағдарламаға өттің.'), el('p', 'mute', 'Ойынды қарап отыра аласың, бірақ ұпай есептелмейді.'));
    const ok = el('button', 'go', 'Түсіндім'); ok.onclick = () => { w.hidden = true; showDq(); }; w.appendChild(ok);
  } else {
    w.append(el('h1', '', 'Ескерту!'), el('p', '', 'Квиз кезінде басқа бетке не бағдарламаға өтуге болмайды.'), el('p', 'mute', 'Тағы бір рет шықсаң, нәтижең өшіріледі.'));
    const ok = el('button', 'go', canFS ? 'Қайта толық экранға өту' : 'Ойынға қайту'); ok.onclick = () => { w.hidden = true; enterFS(); }; w.appendChild(ok);
  }
  w.hidden = false;
}
function showDq() { waitScreen('Нәтижең өшірілді', 'Ережені бұзғаның үшін ұпай есептелмейді. Квиз біткенше күт.'); }
document.addEventListener('visibilitychange', () => { document.hidden ? leave() : back(); });
window.addEventListener('blur', () => { setTimeout(() => { if (!document.hasFocus()) leave(); }, 250); });
window.addEventListener('focus', () => { if (!document.hidden) back(); });
['fullscreenchange', 'webkitfullscreenchange'].forEach(ev => document.addEventListener(ev, () => {
  paintFS(); if (wantFS && !inFS() && lastPh === 'q') { leave(); back(); }
}));

function joinScreen(msg) {
  clearInterval(tmr); clearInterval(helloTimer);
  const qs = new URLSearchParams(location.search), pre = (qs.get('c') || '').replace(/\D/g, '').slice(0, 6);
  const h = el('h1', '', 'Квизге қосыл'), sub = el('p', 'mute', 'Кодты және атыңды жаз.');
  const lc = el('label', '', 'Код'), ic = document.createElement('input'); ic.id = 'code'; ic.inputMode = 'numeric'; ic.maxLength = 6; ic.placeholder = '123456'; ic.autocomplete = 'off'; ic.value = pre || code;
  const useAcct = !!acct && !guest;
  const ln = el('label', '', 'Атың'), inn = document.createElement('input'); inn.id = 'nm'; inn.maxLength = 20; inn.placeholder = 'Мысалы: Айдос'; inn.autocomplete = 'nickname'; inn.value = name || store.get('qname') || '';
  const go = el('button', 'go', 'Кіру'), er = el('div', 'err'); er.setAttribute('role', 'alert'); er.textContent = msg || '';
  lc.htmlFor = 'code'; ln.htmlFor = 'nm';
  go.onclick = () => {
    const c = ic.value.replace(/\D/g, ''), n = inn.value.trim();
    if (c.length !== 6) { er.textContent = 'Код 6 саннан тұрады.'; return; }
    if (!n && !useAcct) { er.textContent = 'Атыңды жаз.'; inn.focus(); return; }
    code = c; name = useAcct ? acct.name : n.slice(0, 20); if (!useAcct) store.set('qname', name); strikes = 0; dq = false; away = false; enterFS(); connect();
  };
  const avRow = el('div'); avRow.style.cssText = 'display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 2px';
  const pickAv = () => { avRow.replaceChildren(); const cur = avCur(); const lb = el('span', 'mute', 'Аватар:'); avRow.append(lb, avSpan(cur, 34)); AVE.slice(0, 10).forEach((e, i) => { const b = el('button', 'lnk', e); b.type = 'button'; b.style.cssText = 'font-size:1.3rem;padding:2px 4px;text-decoration:none'; b.onclick = () => { myAv = e + '|' + (i % 8); lsSet('avatar', myAv); if (acct) acct.av = myAv; pickAv(); }; avRow.appendChild(b); }); };
  if (!avOk(avCur())) { const i = Math.floor(Math.random() * AVE.length); myAv = AVE[i] + '|' + (i % 8); } pickAv();
  inn.onkeydown = ic.onkeydown = e => { if (e.key === 'Enter') go.click(); };
  if (useAcct) {
    const box = el('div', 'acc'), tx = el('div'); tx.append(el('b', '', acct.name), el('br'), el('small', '', 'Аккаунтпен кірдің: нәтижең «Менің жолым» бөліміне сақталады')); box.appendChild(tx);
    const gl = el('button', 'lnk', 'Қонақ ретінде кіру (нәтиже сақталмайды)'); gl.type = 'button'; gl.onclick = () => { guest = true; joinScreen(''); };
    draw(h, el('p', 'mute', 'Кодты жаз.'), lc, ic, box, avRow, go, er, gl); ic.focus();
  } else draw(h, sub, lc, ic, ln, inn, avRow, go, er); if (!useAcct) (pre ? inn : ic).focus();
}

function waitScreen(title, text) { draw(Object.assign(el('div', 'center'), {})); const c = m.firstChild; c.append(el('div', 'dot'), el('h1', '', title), el('p', 'mute', text || '')); }

function connect() {
  waitScreen('Қосылуда…', 'Бөлме іздеп жатырмыз');
  { const a = avOk(avCur()); $('who').textContent = (a ? a.e + ' ' : '') + name; }
  gotState = false; done = false; curQ = -1; picked = -1; lastPh = '';
  try { if (ch) sb.removeChannel(ch); } catch {}
  if (!sb) sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, { auth: { persistSession: false, autoRefreshToken: false } });
  ch = sb.channel('quiz:' + code, { config: { broadcast: { self: false }, presence: { key: myId } } });
  ch.on('broadcast', { event: 'st' }, ({ payload }) => onState(payload));
  ch.on('broadcast', { event: 'info' }, ({ payload: m }) => { if (m && m.id === myId) { strikes = Math.max(strikes, m.st || 0); if (m.dq) dq = true; } });
  ch.on('broadcast', { event: 'kick' }, ({ payload }) => { if (payload && payload.id === myId) end('Бөлмеден шығарылдың', 'Қайта кіргің келсе, мұғалімнен сұра.', true); });
  ch.subscribe(async s => {
    if (s === 'SUBSCRIBED') {
      await ch.track(acct && !guest ? { name, uid: acct.uid, av: avCur() } : { name, av: avCur() });
      const ask = () => ch.send({ type: 'broadcast', event: 'hello', payload: { id: myId } });
      ask(); let tries = 0; clearInterval(helloTimer);
      helloTimer = setInterval(() => {
        if (gotState || done) { clearInterval(helloTimer); return; }
        if (++tries > 7) { clearInterval(helloTimer); try { sb.removeChannel(ch); } catch {} joinScreen('Бөлме табылмады. Кодты тексер немесе мұғалім квизді әлі ашпаған болуы мүмкін.'); return; }
        ask();
      }, 2500);
    } else if (s === 'CHANNEL_ERROR' || s === 'TIMED_OUT') {
      if (!done) joinScreen('Байланыс орнамады. Интернетті тексеріп, қайта көр.');
    }
  });
}

function end(title, text, kicked) {
  done = true; $('fsb').hidden = true; try { if (inFS()) (document.exitFullscreen || document.webkitExitFullscreen).call(document); } catch {} wantFS = false; clearInterval(tmr); clearInterval(helloTimer);
  try { ch && ch.untrack(); sb.removeChannel(ch); } catch {}
  waitScreen(title, text); m.querySelector('.dot').remove();
  const b = el('button', 'go', 'Басқа квизге кіру'); b.onclick = () => joinScreen(''); m.firstChild.appendChild(b);
}

function onState(s) {
  if (!s || done) return; gotState = true; paintFS();
  if (s.tm && s.tm[myId] !== undefined) myTeam = s.tm[myId]; else if (s.r && s.r[myId] && s.r[myId].t !== undefined && s.r[myId].t >= 0) myTeam = s.r[myId].t;
  if (s.g === 'spy') return spyScreen(s);
  if (s.g === 'croc') return crocScreen(s);
  if (s.g === 'boss' || s.g === 'climb') return climbScreen(s);
  if (s.g === 'cloud') return cloudScreen(s);
  if (s.g === 'poll') return pollScreen(s);
  if (s.g === 'ask') return askScreen(s);
  if (s.ph === 'closed') return end('Квиз аяқталды', 'Мұғалім бөлмені жапты.');
  if (s.ph === 'lobby') { if (lastPh !== 'lobby') { lastPh = 'lobby'; curQ = -1; waitScreen('Сен кірдің!', 'Мұғалім квизді бастағанша күт. Атың экранда көрінеді.'); } return; }
  if (dq && s.ph !== 'lobby') { lastPh = s.ph; if (!$('warn').hidden) return; showDq(); return; }
  if (s.ph === 'q') {
    endAt = Date.now() + (typeof s.left === 'number' ? s.left : s.dur * 1000);
    if (curQ !== s.qi || lastPh !== 'q') { curQ = s.qi; picked = -1; lastPh = 'q'; question(s); }
    return;
  }
  if (s.ph === 'rev') {
    if (lastPh === 'rev' && curQ === s.qi) return;
    lastPh = 'rev'; curQ = s.qi; clearInterval(tmr); result(s); return;
  }
  if (s.ph === 'end') { lastPh = 'end'; clearInterval(tmr); final(s); }
}

function question(s) {

  const nodes = [top]; const tt = teamTag(); if (tt) nodes.push(tt); nodes.push(q);
  if (s.img) { const im = document.createElement('img'); im.className = 'img'; im.src = s.img; im.alt = ''; nodes.push(im); }
  const status = el('p', 'mute', ''); status.style.textAlign = 'center'; status.style.marginTop = '12px';
  if (s.k === 'num') {
    const box = el('div', 'numin'), inp = document.createElement('input'), sendB = el('button', 'go', 'Жіберу');
    inp.inputMode = 'decimal'; inp.autocomplete = 'off'; inp.placeholder = s.u ? 'Жауап, ' + s.u : 'Жауап (сан)'; inp.maxLength = 16; inp.setAttribute('aria-label', 'Жауап');

      picked = 0; inp.disabled = true; sendB.disabled = true;
      ch.send({ type: 'broadcast', event: 'ans', payload: { id: myId, qi: s.qi, v } });
      status.textContent = 'Жауап қабылданды: ' + fmtNum(v) + (s.u ? ' ' + s.u : '') + '. Басқалар жауап бергенше күт.'; if (navigator.vibrate) navigator.vibrate(30);
    };
    sendB.onclick = sendNum; inp.onkeydown = e => { if (e.key === 'Enter') sendNum(); };
    box.append(inp, sendB); opts.appendChild(box); opts.classList.add('numwrap');
  } else s.o.forEach((v, k) => {
    if (!v) return;
    const b = el('button', 'opt'); b.type = 'button'; b.style.setProperty('--c', COL[k]);
    const sh = el('span'); sh.innerHTML = shape(k); b.append(sh, el('span', '', v));
    b.onclick = () => {
      if (picked >= 0 || Date.now() > endAt + 500) return;
      picked = k; opts.querySelectorAll('.opt').forEach((x, i) => { x.disabled = true; if (x !== b) x.classList.add('dim'); else x.classList.add('pick'); });
      ch.send({ type: 'broadcast', event: 'ans', payload: { id: myId, qi: s.qi, c: k } });
      status.textContent = 'Жауап қабылданды. Басқалар жауап бергенше күт.'; if (navigator.vibrate) navigator.vibrate(30);
    };
    opts.appendChild(b);
  });
  nodes.push(opts, status); draw(...nodes);
  clearInterval(tmr);
  tmr = setInterval(() => {
    const left = endAt - Date.now(), sec = Math.max(0, Math.ceil(left / 1000));
    tm.textContent = sec; fill.style.transform = 'scaleX(' + Math.max(0, Math.min(1, left / (s.dur * 1000))) + ')';
    if (left <= 0) { clearInterval(tmr); opts.querySelectorAll('.opt,input,button').forEach(x => x.disabled = true); if (picked < 0) status.textContent = 'Уақыт бітті.'; }
  }, 150);
}

function result(s) {

  if (!r) { c.append(el('div', 'dot'), el('h1', '', 'Келесі сұрақты күт'), el('p', 'mute', 'Сен осы сұраққа қатыспадың.')); draw(c); return; }

}

  cloudScreen.r = s.reset || 0; cloudKey = key; lastPh = 'cloud';
  const c = el('div', 'center'); c.style.justifyContent = 'flex-start'; c.style.paddingTop = '24px';

  ta.maxLength = 160; ta.placeholder = 'Сұрағыңды жаз…'; ta.setAttribute('aria-label', 'Сұрақ'); const left = () => (s.max || 3) - askSent;
  const paint = () => { msg.textContent = left() > 0 ? 'Тағы ' + left() + ' сұрақ жібере аласың.' : 'Сұрақ лимиті бітті.'; ta.disabled = b.disabled = left() <= 0; };
  b.onclick = () => { const t = ta.value.trim(); if (!t || left() <= 0) return; ch.send({ type: 'broadcast', event: 'q', payload: { id: myId, t } }); askSent++; ta.value = ''; paint(); if (navigator.vibrate) navigator.vibrate(25); };

    row.append(el('span', '', q.t), up); ql.appendChild(row);
  });
  c.append(box, msg, ql); const keep = document.activeElement && document.activeElement.tagName === 'TEXTAREA' ? ta.value : '';
  draw(c); paint(); if (keep) { ta.value = keep; ta.focus(); }

const spyDec = s => { try { return decodeURIComponent(escape(atob(String(s).split('').reverse().join('')))); } catch { return ''; } };

  const wrap = el('div', 'sy-s'), chip = () => { const t = el('div', 'sy-wchip'); t.append(el('span', '', 'Сенің сөзің:'), el('b', '', word)); return t; };
  if (s.ph === 'deal') {
    const c = el('div', 'center'); c.append(avSpan(avCur(), 64), el('p', 'mute', 'Сенің сөзің'), el('div', 'sy-sword', word), el('p', 'mute', 'Сөзді басқаларға көрсетпе. Оны тікелей атамай, сипаттайтын бір сөз айтатын боласың. Кім сенің сөзіңе ұқсамайтын сөз айтады, соны байқа.'));
    const b = el('button', 'go', spyG.rdy ? 'Басқаларды күтіп тұрмыз… (' + s.rdy + ' / ' + s.tot + ')' : 'Түсіндім ✓'); b.disabled = spyG.rdy; b.onclick = () => { spyG.rdy = true; ch.send({ type: 'broadcast', event: 'sready', payload: { id: myId } }); b.disabled = true; b.textContent = 'Басқаларды күтіп тұрмыз…'; if (navigator.vibrate) navigator.vibrate(30); }; c.appendChild(b); draw(c); return;
  }
  if (s.ph === 'clue') {
    const tk = s.turn + '|' + s.circ + '|' + s.cl.length, mine = s.turn === myId && !dead, sp = byId(s.turn); const keep = document.activeElement && document.activeElement.tagName === 'INPUT' ? document.activeElement.value : null;
    if (spyG.tk !== tk) { spyG.tk = tk; spyG.end = Date.now() + (s.left || 0) * 1000; spyG.draft = ''; }

    const th = g('ptheme') || g('theme') || 'auto', ac = g('paccent') || g('accent'), sty = g('pstyle') || 'none';
    if (th === 'auto' || !TH.some(x => x[0] === th)) delete R.dataset.pt; else R.dataset.pt = th;
    if (ac && AC.some(x => x[0] === ac)) R.dataset.pa = ac; else delete R.dataset.pa;
    if (sty === 'none' || !ST.some(x => x[0] === sty)) delete R.dataset.ps; else R.dataset.ps = sty;
  };
  apply();
  const box = document.createElement('div'); box.id = 'pset'; box.hidden = true;
  const sec = (title, items, key, cur, col) => { const h = document.createElement('h4'); h.textContent = title; const w = document.createElement('div'); w.className = 'ch' + (col ? ' sw' : ''); items.forEach(it => { const b = document.createElement('button'); b.type = 'button'; if (col) { b.style.setProperty('--c', it[1]); b.setAttribute('aria-label', it[0]); } else b.textContent = it[1]; b.setAttribute('aria-pressed', String(cur === it[0])); b.onclick = e => { e.stopPropagation(); st(key, it[0]); apply(); paint(); }; w.appendChild(b); }); box.append(h, w); };
  const paint = () => { box.replaceChildren(); sec('Тема', TH, 'ptheme', g('ptheme') || g('theme') || 'auto'); sec('Акцент түсі', AC, 'paccent', g('paccent') || g('accent') || 'blue', true); sec('Стиль', ST, 'pstyle', g('pstyle') || 'none'); };
  document.body.appendChild(box); document.getElementById('psb').onclick = e => { e.stopPropagation(); box.hidden = !box.hidden; if (!box.hidden) paint(); };
  document.addEventListener('click', e => { if (!box.hidden && !box.contains(e.target) && e.target.id !== 'psb') box.hidden = true; });
})();

detectAcct().finally(() => joinScreen(''));
</script>
