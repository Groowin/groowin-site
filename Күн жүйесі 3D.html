<title>Күн жүйесі 3D</title>

<style>
/* Layout: full-bleed WebGL scene, glass panels float over it: clock + toggles on top, info/distance cards on the right (bottom sheet on phones), time bar at the bottom. */
:root{
  --bg:#04060c; --panel:rgba(9,13,24,.74); --line:rgba(255,255,255,.12);
  --fg:#e9edf6; --muted:#8f9bb3; --sun:#ffb454; --link:#6fd8ff;
  --ui:'Manrope',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:14px/1.45 var(--ui);overflow:hidden;position:relative;margin:0;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
#gl{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#gl:active{cursor:grabbing}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;background:none;border:0;padding:4px 8px;border-radius:999px;font-size:12px;font-weight:600;color:rgba(233,237,246,.86);text-shadow:0 1px 6px #000,0 0 2px #000;cursor:pointer;white-space:nowrap;will-change:transform}
.lbl:hover,.lbl.sel{color:var(--sun)}
.lbl.sel{font-weight:800}
.lbl[hidden]{display:none}
#ring{position:absolute;left:0;top:0;width:40px;height:40px;margin:-20px 0 0 -20px;border:1.5px solid var(--sun);border-radius:50%;pointer-events:none;opacity:0;will-change:transform}
#ring.on{opacity:.9;animation:pulse 1.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 7px rgba(255,180,84,.12)}}
#lineLbl{position:absolute;left:0;top:0;pointer-events:none;font:700 12px var(--mono);color:var(--link);background:rgba(4,8,16,.82);border:1px solid rgba(111,216,255,.4);border-radius:6px;padding:3px 8px;white-space:nowrap;opacity:0;will-change:transform}
#lineLbl.on{opacity:1}

#ui{position:absolute;inset:0;pointer-events:none;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#ui>*{min-width:0}
#top{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:flex-start;justify-content:space-between}
#clock{pointer-events:auto}
.eyebrow{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
#dateText{display:block;font:800 clamp(1.5rem,5vw,2.3rem)/1.1 var(--ui);font-variant-numeric:tabular-nums;text-shadow:0 2px 14px #000}
#chips{pointer-events:auto;display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:100%}
.chip,.btn,.seg button{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer;font-weight:600;font-size:13px;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);transition:border-color .15s,color .15s,background .15s}
.chip:hover,.btn:hover,.seg button:hover{border-color:rgba(255,255,255,.3)}
.chip[aria-pressed="true"],.seg button.on{border-color:var(--sun);color:var(--sun);background:rgba(255,180,84,.12)}
button:focus-visible,input:focus-visible{outline:2px solid var(--link);outline-offset:2px}

#mid{position:relative;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;min-height:0}
#hint{pointer-events:none;align-self:flex-start;max-width:min(300px,46%);font-size:12.5px;color:var(--muted);text-shadow:0 1px 8px #000}
#side{pointer-events:auto;margin-left:auto;width:min(360px,100%);max-height:100%;overflow-y:auto;display:flex;flex-direction:column;gap:10px;scrollbar-width:thin}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.card[hidden]{display:none}
.ch{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.dot{width:34px;height:34px;border-radius:50%;flex:none;box-shadow:inset -6px -6px 12px rgba(0,0,0,.45),0 0 14px var(--glow,transparent)}
.ch h2{margin:0;font-size:20px;line-height:1.15;font-weight:800}
.ch p{margin:0;color:var(--muted);font-size:12.5px}
.x{margin-left:auto;background:none;border:0;color:var(--muted);cursor:pointer;font-size:22px;line-height:1;padding:4px 8px;border-radius:8px}
.x:hover{color:var(--fg)}
dl{display:grid;grid-template-columns:auto 1fr;gap:5px 14px;margin:0;font-size:13px}
dt{color:var(--muted)}
dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.fact{margin:12px 0 0;padding-top:10px;border-top:1px solid var(--line);font-size:13px;line-height:1.5}
.fact b{color:var(--sun)}
.moons{margin:8px 0 0;font-size:12.5px;color:var(--muted)}
.big{font:700 clamp(1.5rem,5vw,1.9rem)/1.1 var(--mono);color:var(--link);margin:2px 0}
.big small{font-size:.5em;color:var(--muted);font-weight:500}
.row2{display:flex;flex-wrap:wrap;gap:4px 14px;font:500 12.5px var(--mono);color:var(--fg)}
.ext{margin:10px 0 0;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--muted);line-height:1.6}
.ext b{color:var(--fg);font-weight:600}
.btn{margin-top:10px;padding:6px 14px}

#bar{pointer-events:auto;display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.grp{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:flex;gap:4px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg button{padding:6px 11px;white-space:nowrap;border-radius:8px}
#dp{background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:8px;padding:5px 8px;font-variant-numeric:tabular-nums}
#play{min-width:96px;background:var(--sun);color:#1a1205;border-color:var(--sun)}
#play:hover{border-color:#fff}

#weight,#events{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;background:rgba(2,4,10,.6);padding:16px}
#weight[hidden],#events[hidden]{display:none}
#wcard,#ecard{width:min(440px,100%);max-height:100%;overflow-y:auto}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:2px 0 12px}
.tabs .chip.on{border-color:var(--sun);color:var(--sun);background:rgba(255,180,84,.12)}
.ev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;align-items:center;width:100%;text-align:left;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:10px;padding:9px 12px;margin:0 0 6px;cursor:pointer}
.ev:hover{border-color:var(--link)}
.ev .bd{grid-row:span 2;font:700 11px var(--mono);padding:4px 8px;border-radius:6px;background:rgba(255,180,84,.14);color:var(--sun);text-align:center;min-width:52px}
.ev .bd.m{background:rgba(111,216,255,.14);color:var(--link)}
.ev .bd.p{background:rgba(190,160,255,.16);color:#c9b3ff}
.ev b{font-weight:700;font-size:13.5px}
.ev small{color:var(--muted);font-variant-numeric:tabular-nums;font-size:12px}
.lbl.moon{pointer-events:none;font-size:11px;font-weight:500;color:rgba(200,215,240,.8);padding:0}
#wcard label{display:flex;gap:10px;align-items:center;margin:6px 0 12px}
#kg{width:90px;background:rgba(255,255,255,.06);border:1px solid var(--line);border-radius:8px;padding:6px 8px;font:700 16px var(--mono)}
.wr{display:grid;grid-template-columns:78px 1fr 72px;gap:8px;align-items:center;margin:5px 0;font-size:13px}
.wr .bar{height:8px;border-radius:4px;background:rgba(255,255,255,.07);overflow:hidden}
.wr .bar i{display:block;height:100%;border-radius:4px;background:var(--sun)}
.wr span:last-child{text-align:right;font:600 12.5px var(--mono)}
#loading{position:absolute;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--muted);font-size:14px;letter-spacing:.04em;transition:opacity .6s}
#loading.off{opacity:0;pointer-events:none}
#nogl{padding:24px;max-width:420px}

@media (max-width:640px){
  #mid{flex-direction:column;align-items:stretch;justify-content:flex-end}
  #hint{max-width:none;position:absolute;left:0;top:0}
  #side{width:100%;max-height:42vh}
  #bar{padding:8px 10px}
  .chip{padding:6px 11px;font-size:12px}
}
@media (prefers-reduced-motion:reduce){#ring.on{animation:none}#loading{transition:none}}
</style>

    </div>
  </div>
</div>

<div id="weight" hidden>
  <div class="card" id="wcard">
    <div class="ch"><div><h2>Салмақ калькуляторы</h2><p>Басқа планетада салмағың қанша болады?</p></div><button class="x" id="wx" aria-label="Жабу">×</button></div>
    <label for="kg"><span>Жердегі салмағың</span><input id="kg" type="number" min="1" max="300" value="60" inputmode="decimal"><span>кг</span></label>
    <div id="wrows"></div>
  </div>
</div>
<div id="events" hidden>
  <div class="card" id="ecard">
    <div class="ch"><div><h2>Аспандағы оқиғалар</h2><p>Модельдегі күннен бастап келесілері</p></div><button class="x" id="evx" aria-label="Жабу">×</button></div>

    <div id="evList"></div>
    <p class="ext" id="evNote"></p>
  </div>
</div>
<div id="loading"><div id="nogl">Планеталар жасалуда…</div></div>

function helio(b,jd,out){

  var a=e_[0]+e_[1]*T,e=e_[2]+e_[3]*T,I=(e_[4]+e_[5]*T)*D2R,L=e_[6]+e_[7]*T,w=e_[8]+e_[9]*T,O=(e_[10]+e_[11]*T)*D2R;
  var M=((L-w)%360)*D2R; M=Math.atan2(Math.sin(M),Math.cos(M));
  var E=M+e*Math.sin(M);
  for(var i=0;i<6;i++){E-=(E-e*Math.sin(E)-M)/(1-e*Math.cos(E))}
  var xp=a*(Math.cos(E)-e),yp=a*Math.sqrt(1-e*e)*Math.sin(E);
  var om=(w*D2R)-O,co=Math.cos(om),so=Math.sin(om),cO=Math.cos(O),sO=Math.sin(O),cI=Math.cos(I),sI=Math.sin(I);
  out[0]=(co*cO-so*sO*cI)*xp+(-so*cO-co*sO*cI)*yp;
  out[1]=(co*sO+so*cO*cI)*xp+(-so*sO+co*cO*cI)*yp;
  out[2]=(so*sI)*xp+(co*sI)*yp;
  return out;
}

  var xp=a*(Math.cos(E)-e),yp=a*Math.sqrt(1-e*e)*Math.sin(E);
  var om=(w*D2R)-O,co=Math.cos(om),so=Math.sin(om),cO=Math.cos(O),sO=Math.sin(O),cI=Math.cos(I),sI=Math.sin(I);
  out[0]=(co*cO-so*sO*cI)*xp+(-so*cO-co*sO*cI)*yp;

function starField(n,size,seed,rad){
  var r=rnd(seed),pos=new Float32Array(n*3),col=new Float32Array(n*3);
  for(var i=0;i<n;i++){
    var u=r()*2-1,th=r()*Math.PI*2,s=Math.sqrt(1-u*u);
    pos[i*3]=rad*s*Math.cos(th);pos[i*3+1]=rad*u;pos[i*3+2]=rad*s*Math.sin(th);
    var t=r(),b=.55+.45*r();
    col[i*3]=b*(.8+.2*t);col[i*3+1]=b*(.85+.1*t);col[i*3+2]=b*(1-.15*t);
  }
  var g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.BufferAttribute(pos,3));g.setAttribute('color',new THREE.BufferAttribute(col,3));
  var m=new THREE.PointsMaterial({size:size,sizeAttenuation:false,vertexColors:true,transparent:true,depthWrite:false});

  var Q=5.2207-.0048*E*c(M)+.002*E*c(2*M)-.3299*c(Mp)-.006*E*c(Mp+M)+.0041*E*c(Mp-M);

function geoLons(jd){

  PLN.forEach(function(id){

    var d=(a[q].lon-a[bi].lon+Math.PI*2)%(Math.PI*2);

  $('evNote').textContent=evTab==='ecl'
    ?'Уақыт — тұтылудың ең терең сәті (UTC). Бетті басқанда модель сол күнге өтіп, Ай Күн мен Жердің арасынан (немесе Жер Күн мен Айдың арасынан) өтуін көресің. Күн тұтылуы Жердің тек белгілі бір аймағында көрінеді, Ай тұтылуы түнгі жарты шардың бәрінен көрінеді.'
    :'Жерден қарағанда 6 планета ең тар доғаға тізілетін сәттер (Меркурийден Нептунға дейінгі 7 планетаның ішінен). Уран мен Нептунды көру үшін телескоп керек. Басқанда Жерден планеталарға сызықтар жүргізіледі.';
}
function openEvents(t){evTab=t;$('events').hidden=false;drawEvents()}
$('cEcl').onclick=function(){openEvents('ecl')};
$('cPar').onclick=function(){openEvents('par')};
$('evx').onclick=function(){$('events').hidden=true};
$('events').addEventListener('click',function(e){if(e.target===this)this.hidden=true});
Array.prototype.forEach.call($('evTabs').children,function(b){b.onclick=function(){evTab=b.dataset.t;drawEvents()}});
function gotoEvent(it,tab){
  clearPair();
  jd=it.jd;playing=false;$('play').textContent='Ойнату';orbDirty=true;
  var e=helio(BY.earth,jd,[0,0,0]),k=ratio(Math.hypot(e[0],e[1],e[2])),px=e[0]*k,py=e[2]*k,pz=-e[1]*k;
  focus=BY.earth;camTarget.set(px,py,pz);
  if(tab==='ecl'){
    var dl=Math.hypot(px,pz)||1;
    yaw=Math.atan2(-pz/dl,px/dl);pitch=.28;camDist=30;distGoal=11;
    hintEl.textContent=it.type==='sun'
      ?'Күн тұтылуы · '+it.kind+'. Ай Күн мен Жердің арасында тұр. Ай орбитасы көлбеу, сондықтан әр жаңа айда тұтылу болмайды.'
      :'Ай тұтылуы · '+it.kind+'. Жер Күн мен Айдың арасында тұр, Ай Жердің көлеңкесіне түседі.';
  }else{
    paradeIds=it.ids.slice(0,7);pitch=1.0;camDist=mixGoal===1?150:400;distGoal=camDist;
    hintEl.textContent='Планеталар парады: '+it.ids.length+' планета Жерден қарағанда '+fmt(it.w,0)+'° доғада тұр. Сары сызықтар Жерден планеталарға бағытталған.';
  }
}
window.addEventListener('keydown',function(e){
  if(e.target&&e.target.tagName==='INPUT')return;
  if(e.code==='Space'){e.preventDefault();$('play').click()}
  if(e.key==='Escape'){$('weight').hidden=true;$('events').hidden=true}
});

/* ---------- Негізгі цикл ---------- */
function resize(){
  W=window.innerWidth;H=window.innerHeight;
  renderer.setSize(W,H,false);camera.aspect=W/H;camera.updateProjectionMatrix();
  pscale=(H/2)/Math.tan(camera.fov*D2R/2);
}
window.addEventListener('resize',resize);resize();

var last=performance.now(),lastDate='',lastLive=0,orbDirty=true,t0=performance.now();
var cp=new THREE.Vector3(),tgt=new THREE.Vector3(),mid=new THREE.Vector3();
rebuildOrbits(jd);updBelt(asteroids,jd);updBelt(kuiper,jd);

function frame(now){
  requestAnimationFrame(frame);
  var dt=Math.min(.1,(now-last)/1000);last=now;
  if(playing)jd+=dir*SPEEDS[speedIdx][1]*dt;
  if(mixV!==mixGoal){mixV+=Math.sign(mixGoal-mixV)*Math.min(Math.abs(mixGoal-mixV),dt*1.1);orbDirty=true}
  if(orbDirty||playing&&SPEEDS[speedIdx][1]>=365){rebuildOrbits(jd);orbDirty=false}

  B.forEach(function(b){
    helio(b,jd,b.au);
    var k=ratio(Math.hypot(b.au[0],b.au[1],b.au[2]));
    b.g.position.set(b.au[0]*k,b.au[2]*k,-b.au[1]*k);
    b.pos.copy(b.g.position);
    b.m.rotation.y+=b.omega*dt;
    if(b.cloud)b.cloud.rotation.y+=b.omega*dt*1.18;
  });
  var earth=BY.earth,spd=playing?Math.abs(SPEEDS[speedIdx][1]):0;
  var mg=moonGeo(jd),cb=Math.cos(mg.lat);
  earth.moonMesh.position.set(2.5*cb*Math.cos(mg.lon),2.5*Math.sin(mg.lat),-2.5*cb*Math.sin(mg.lon));
  earth.moonMesh.rotation.y=mg.lon;
  earth.moonMesh.visible=spd/(60*27.32)*360<100;
  earth.moonLine.visible=show.orb;
  B.forEach(function(b){
    b.moons.forEach(function(o){
      var ang=o.ph+(jd-J2000)/o.per*Math.PI*2;
      o.mesh.position.set(Math.cos(ang)*o.r,0,-Math.sin(ang)*o.r);
      o.mesh.visible=spd/(60*Math.abs(o.per))*360<100;
      o.line.visible=show.orb;
    });
  });
  sunLight.position.set(0,0,0);
  var pul=1+.025*Math.sin(now*.0016);
  glow1.scale.set(26*pul,26*pul,1);glow2.scale.set(70*(2-pul),70*(2-pul),1);
  starsB.material.opacity=.65+.35*Math.sin(now*.0012);
  starsA.material.opacity=.85+.15*Math.sin(now*.0007+1);
  updBelt(asteroids,jd);updBelt(kuiper,jd);
  asteroids.p.visible=kuiper.p.visible=show.belt;
  orbs.forEach(function(b){b.orbit.visible=show.orb});

  /* камера */
  if(focus){tgt.copy(focus.pos)}else{tgt.set(0,0,0)}
  camTarget.lerp(tgt,1-Math.pow(.0005,dt));
  if(distGoal!==null){camDist+=(distGoal-camDist)*(1-Math.pow(.02,dt));if(Math.abs(distGoal-camDist)<.01*camDist)distGoal=null}
  cp.set(Math.cos(pitch)*Math.sin(yaw),Math.sin(pitch),Math.cos(pitch)*Math.cos(yaw)).multiplyScalar(camDist).add(camTarget);
  camera.position.copy(cp);camera.lookAt(camTarget);
  camera.near=Math.max(.05,camDist*.01);camera.updateProjectionMatrix();

  /* UI */
  var dtx=dateText(jd);if(dtx!==lastDate){lastDate=dtx;$('dateText').textContent=dtx;var dp=$('dp');if(document.activeElement!==dp)dp.value=isoDate(jd)}
  renderer.render(scene,camera);

  camera.updateMatrixWorld();
  B.forEach(function(b){
    project(b.pos,sp);
    var vis=show.lbl&&sp.z<1&&sp.x>-60&&sp.x<W+60&&sp.y>-30&&sp.y<H+30;
    b.lbl.hidden=!vis;
    if(vis){var rs=b.size*pscale/camera.position.distanceTo(b.pos);b.lbl.style.transform='translate('+(sp.x|0)+'px,'+((sp.y+Math.min(rs,120)+6)|0)+'px) translateX(-50%)'}
  });
  var wp=new THREE.Vector3();
  function moonLabel(el,mesh,on){
    if(!on||!show.lbl||!mesh.visible){el.hidden=true;return}
    mesh.getWorldPosition(wp);project(wp,sp);
    if(sp.z>1){el.hidden=true;return}
    el.hidden=false;el.style.transform='translate('+(sp.x|0)+'px,'+((sp.y+10)|0)+'px) translateX(-50%)';
  }
  B.forEach(function(b){b.moons.forEach(function(o){moonLabel(o.lbl,o.mesh,focus===b)})});
  moonLabel(earth.moonLbl,earth.moonMesh,focus===earth);
  if(paradeIds){
    var ra=rays.geometry.attributes.position.array,ep=earth.pos;
    for(var q=0;q<7;q++){
      var tp=paradeIds[q]?BY[paradeIds[q]].pos:ep;
      ra[q*6]=ep.x;ra[q*6+1]=ep.y;ra[q*6+2]=ep.z;ra[q*6+3]=tp.x;ra[q*6+4]=tp.y;ra[q*6+5]=tp.z;
    }
    rays.geometry.attributes.position.needsUpdate=true;rays.geometry.setDrawRange(0,paradeIds.length*2);rays.visible=true;
  }else rays.visible=false;
  if(prev){
    project(prev.pos,sp);
    var r2=Math.max(20,Math.min(prev.size*pscale/camera.position.distanceTo(prev.pos)+10,400));
    ring.style.transform='translate('+sp.x+'px,'+sp.y+'px) scale('+(r2/20)+')';
    ring.style.borderWidth=(1.5/(r2/20))+'px';
    ring.classList.toggle('on',sp.z<1);
  }
  if(pair){
    var a=pair[0],b2=pair[1],pa=a.au,pb=b2.au;
    var d=Math.hypot(pa[0]-pb[0],pa[1]-pb[1],pa[2]-pb[2]);
    var arr=line.geometry.attributes.position.array;
    arr[0]=a.pos.x;arr[1]=a.pos.y;arr[2]=a.pos.z;arr[3]=b2.pos.x;arr[4]=b2.pos.y;arr[5]=b2.pos.z;
    line.geometry.attributes.position.needsUpdate=true;
    mid.copy(a.pos).add(b2.pos).multiplyScalar(.5);project(mid,sp);
    var txt=fmt(d,2)+' а.б. · '+fmt(d*149.598,0)+' млн км';
    if(lineLbl.textContent!==txt)lineLbl.textContent=txt;
    lineLbl.style.transform='translate('+(sp.x|0)+'px,'+(sp.y|0)+'px) translate(-50%,-135%)';
    lineLbl.classList.toggle('on',sp.z<1);
    if(now-lastLive>120){
      $('dKm').innerHTML=fmt(d*149.598,1)+' <small>млн км</small>';
      $('dAu').textContent=fmt(d,3)+' а.б.';
      $('dLt').textContent='жарық: '+lightTime(d);
    }
  }
  if(now-lastLive>120){
    lastLive=now;
    var ld=$('liveD');if(ld&&prev&&prev.el){var r=Math.hypot(prev.au[0],prev.au[1],prev.au[2]);ld.textContent=fmt(r,2)+' а.б. ('+fmt(r*149.598,0)+' млн км)'}
  }
}
requestAnimationFrame(frame);
})();
</script>

</body></html>
