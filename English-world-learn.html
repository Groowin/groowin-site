 '<div class="mut">Деңгей 3+ = меңгерілген · Уровень 3+ = выучено</div><div class="btns"><button class="btn l" id="rs">'+(rst?'Растау · Подтвердить ⚠️':'Прогресті өшіру · Сбросить прогресс')+'</button></div></div>'+extra();
