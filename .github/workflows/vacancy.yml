name: vacancy-check

on:
  schedule:
    - cron: "*/15 * * * *"
    - cron: "0 5 * * 0"   # жексенбі 10:00 (UTC+5): апталық «жүйе тірі» хабарламасы
  workflow_dispatch:
    inputs:
      heartbeat:
        description: "Апталық есепті қазір жіберу"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check vacancies
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          HEARTBEAT: ${{ inputs.heartbeat }}
        run: python check_vacancies.py
      - name: Save seen list
        run: |
          git config user.name "vacancy-bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen.json || true
          git add open.json || true
          git add sample_job.json || true
          git commit -m "update seen [skip ci]" || exit 0
          git push
