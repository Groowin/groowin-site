<!DOCTYPE html>
<html lang="kk" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Менеджмент · Квиз</title>
<style>
:root{
  --c0:#6554e8;--c1:#0d86a3;--c2:#b86d00;--c3:#cc2f73;--c4:#0c8f62;
  --font:"Segoe UI","SF Pro Text",Roboto,"Helvetica Neue",Arial,sans-serif;
}
[data-theme=dark]{
  --bg:#111318;--surface:#1a1d25;--surface2:#212530;--line:#343a49;
  --text:#e9ebf2;--muted:#9ba2b5;--accent:#8c98ff;
  --ok:#4ade80;--onok:#06210f;--okbg:rgba(74,222,128,.15);
  --bad:#ff7080;--onbad:#2a0509;--badbg:rgba(255,112,128,.15);
}
[data-theme=white]{
  --bg:#f4f6f9;--surface:#ffffff;--surface2:#f6f7fb;--line:#dde1ea;
  --text:#1a1f2b;--muted:#5d6579;--accent:#4a58e0;
  --ok:#15803d;--onok:#fff;--okbg:rgba(21,128,61,.1);
  --bad:#c42222;--onbad:#fff;--badbg:rgba(196,34,34,.09);
}
[data-theme=milk]{
  --bg:#f1ece2;--surface:#faf7f0;--surface2:#f3eee3;--line:#dcd3c0;
  --text:#2c2923;--muted:#6a6252;--accent:#2f5a8f;
  --ok:#1a7340;--onok:#fff;--okbg:rgba(26,115,64,.11);
  --bad:#b32525;--onbad:#fff;--badbg:rgba(179,37,37,.1);
}
*{box-sizing:border-box;margin:0;padding:0}
html{font-size:clamp(17px,.42vw + 11.5px,21px)}
body{font-family:var(--font);color:var(--text);background:var(--bg);min-height:100vh;display:flex;padding:1.2rem 1rem 2.4rem;line-height:1.55;transition:background .3s,color .3s;-webkit-font-smoothing:antialiased}
.app{width:100%;max-width:74rem;margin:auto}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
.hidden{display:none!important}

/* intro */
#intro{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.1rem;cursor:pointer;transition:opacity .7s ease,visibility .7s}
#intro.out{opacity:0;visibility:hidden}
.who{display:flex;flex-direction:column;align-items:center;line-height:1.02;font-weight:800;font-size:clamp(52px,13vw,120px);letter-spacing:-.02em}
.who .w{display:flex}
.who .w:nth-child(2){color:var(--accent)}
.who i{font-style:normal;display:inline-block;opacity:0;transform:translateY(55%) scale(.9);filter:blur(10px);animation:letter .9s cubic-bezier(.2,.9,.25,1) forwards;animation-delay:calc(var(--i)*90ms + 150ms)}
@keyframes letter{to{opacity:1;transform:none;filter:none}}
.rule{height:5px;width:min(420px,70vw);border-radius:9px;background:linear-gradient(90deg,var(--c0),var(--c3),var(--c2));transform:scaleX(0);transform-origin:left;animation:rule 1s cubic-bezier(.6,0,.2,1) 1.35s forwards}
@keyframes rule{to{transform:scaleX(1)}}
.cap{color:var(--muted);font-size:1.1rem;font-weight:600;opacity:0;animation:cap .7s ease 2s forwards}
@keyframes cap{to{opacity:1}}

/* header */
.head{display:flex;align-items:center;gap:.6rem;margin-bottom:1.1rem}
.brand{font-weight:700;font-size:1.05rem}
.spacer{flex:1}
.ibtn{width:2.7rem;height:2.7rem;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:1.15rem;transition:border-color .2s,transform .2s}
.ibtn:hover{border-color:var(--accent);transform:translateY(-1px)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:1.3rem}

/* start */
.start{padding:2.6rem 2.4rem 2.4rem;text-align:center}
h1{font-size:clamp(1.7rem,2.6vw,2.4rem);font-weight:700;letter-spacing:-.01em;margin-bottom:.5rem}
.sub{color:var(--muted);margin:0 auto 2rem;max-width:36em;font-size:1.02rem}
.lbl{font-weight:600;font-size:1rem;margin:0 0 .8rem;color:var(--muted)}
.ranges{display:grid;grid-template-columns:repeat(6,1fr);gap:.75rem;margin-bottom:.4rem}
.rt{padding:.9rem .4rem .8rem;border-radius:1rem;background:var(--surface2);border:1px solid var(--line);font-weight:700;font-size:1.15rem;transition:.18s}
.rt small{display:block;font-weight:500;font-size:.78rem;color:var(--muted);margin-top:.1rem}
.rt:hover{border-color:var(--accent);transform:translateY(-2px)}
.rt.sel{border:2px solid var(--accent);padding:calc(.9rem - 1px) calc(.4rem - 1px) calc(.8rem - 1px);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.rt.done small{color:var(--ok);font-weight:700}
.sep{height:1px;background:var(--line);margin:1.8rem auto;max-width:14rem}
.layouts{display:flex;gap:.9rem;justify-content:center;margin-bottom:.4rem}
.lt{flex:0 1 11rem;padding:.9rem .8rem;border-radius:1rem;background:var(--surface2);border:1px solid var(--line);font-weight:600;transition:.18s;display:flex;flex-direction:column;align-items:center;gap:.6rem}
.lt:hover{border-color:var(--accent)}
.lt.sel{border:2px solid var(--accent);padding:calc(.9rem - 1px) calc(.8rem - 1px);background:color-mix(in srgb,var(--accent) 12%,var(--surface))}
.pv{display:grid;gap:.3rem;width:5rem;height:3.2rem}
.pv b{background:var(--muted);border-radius:.25rem;opacity:.5}
.lt.sel .pv b{background:var(--accent);opacity:1}
.pv.list{grid-template-rows:repeat(4,1fr)}
.pv.tiles{grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,1fr)}
.pv.tiles b:nth-child(4){grid-column:1}
.toggle{display:inline-flex;align-items:center;gap:.7rem;margin:1.5rem 0 1.6rem;cursor:pointer;user-select:none;font-weight:500;color:var(--muted)}
.toggle input{width:1.2rem;height:1.2rem;accent-color:var(--accent)}

/* the one colourful element */
.cta{position:relative;overflow:hidden;display:inline-flex;align-items:center;gap:.75rem;padding:1rem 2.6rem;border-radius:999px;font-size:1.2rem;font-weight:800;color:#fff;background:linear-gradient(120deg,#4f5df0 0%,#b43cd0 55%,#f0603a 100%);background-size:170% 100%;box-shadow:0 .7rem 1.7rem -.5rem rgba(180,60,208,.6);transition:transform .2s,box-shadow .2s,background-position .5s}
.cta:hover{transform:translateY(-3px);background-position:100% 0;box-shadow:0 1rem 2rem -.5rem rgba(240,96,58,.55)}
.cta::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.4) 50%,transparent 70%);transform:translateX(-130%)}
.cta:hover::after{animation:sheen .9s ease}
@keyframes sheen{to{transform:translateX(130%)}}
.cta em{font-style:normal;font-size:.95rem;font-weight:700;background:rgba(255,255,255,.22);padding:.1rem .75rem;border-radius:99px}

/* quiz */
.top{display:flex;align-items:center;gap:.6rem;margin-bottom:.8rem;flex-wrap:wrap}
.chip{padding:.4rem .95rem;border-radius:999px;font-weight:700;font-size:1rem;background:var(--surface);border:1px solid var(--line);white-space:nowrap}
.chip.ok{color:var(--ok)}.chip.bad{color:var(--bad)}.chip.streak{color:var(--c2)}
.pbar{height:.4rem;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:1rem}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--c0),var(--c3));border-radius:99px;transition:width .45s ease}
.qcard{padding:2.2rem 2.4rem 1.9rem;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.qtext{font-size:clamp(1.3rem,2.1vw,1.85rem);font-weight:650;line-height:1.42;margin-bottom:1.7rem}

.opts{display:flex;flex-direction:column;gap:.75rem}
.opt{display:flex;align-items:flex-start;gap:1rem;text-align:left;padding:1rem 1.2rem;border-radius:1rem;background:var(--surface2);border:1px solid var(--line);transition:transform .18s,border-color .18s,background .18s;position:relative;font-size:1.1rem;font-weight:500;line-height:1.5}
.opt:hover:not(:disabled){border-color:var(--bc);transform:translateX(4px)}
.let{flex:none;width:2.25rem;height:2.25rem;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1rem;color:#fff;background:var(--bc)}
.opt .t{flex:1;padding-top:.3rem;word-break:break-word}
.mark{flex:none;font-size:1.25rem;padding-top:.2rem;opacity:0;transform:scale(.4);transition:.3s cubic-bezier(.3,1.7,.5,1)}
.opt:disabled{cursor:default;color:var(--text)}
.opt.correct{background:var(--okbg);border:2px solid var(--ok);padding:calc(1rem - 1px) calc(1.2rem - 1px);animation:pop .45s}
.opt.correct .let{background:var(--ok);color:var(--onok)}
.opt.wrong{background:var(--badbg);border:2px solid var(--bad);padding:calc(1rem - 1px) calc(1.2rem - 1px);animation:shake .4s}
.opt.wrong .let{background:var(--bad);color:var(--onbad)}
.opt.correct .mark,.opt.wrong .mark{opacity:1;transform:none}
.opt.dim{opacity:.62}
@keyframes pop{40%{transform:scale(1.015)}}
@keyframes shake{25%,75%{transform:translateX(-6px)}50%{transform:translateX(6px)}}

.opts.tiles{flex-direction:row;flex-wrap:wrap;justify-content:center;gap:.9rem}
.opts.tiles .opt{flex:0 1 calc(33.333% - .6rem);min-height:10rem;flex-direction:column;align-items:center;justify-content:flex-start;text-align:center;padding:1.3rem 1rem 1.1rem;gap:.8rem}
.opts.tiles .opt.correct,.opts.tiles .opt.wrong{padding:calc(1.3rem - 1px) calc(1rem - 1px) calc(1.1rem - 1px)}
.opts.tiles .opt:hover:not(:disabled){transform:translateY(-3px)}
.opts.tiles .let{width:2.6rem;height:2.6rem;font-size:1.1rem}
.opts.tiles .t{padding-top:0;display:flex;align-items:center;font-size:1.08rem}
.opts.tiles .mark{position:absolute;top:.5rem;right:.7rem;padding:0}

.fb{margin-top:1.2rem;padding:.85rem 1.1rem;border-radius:.9rem;font-weight:700;font-size:1.05rem;animation:in .25s}
.fb.ok{background:var(--okbg);color:var(--ok)}
.fb.no{background:var(--badbg);color:var(--bad)}
.nextwrap{margin-top:1rem;display:flex;justify-content:flex-end}
.next{position:relative;overflow:hidden;padding:.85rem 2.2rem;border-radius:999px;font-weight:700;font-size:1.05rem;background:var(--accent);color:var(--bg);transition:.2s}
.next:hover{transform:translateY(-2px)}
.next .fill{position:absolute;left:0;bottom:0;height:4px;width:0;background:currentColor;opacity:.5}
.next span{position:relative}

/* result */
.result{padding:2.4rem 2rem;text-align:center;animation:in .4s}
.ring{width:11rem;height:11rem;margin:0 auto .9rem;position:relative}
.ring svg{transform:rotate(-90deg);width:100%;height:100%}
.ring .bgc{stroke:var(--line)}
.ring .fgc{stroke:var(--accent);transition:stroke-dashoffset 1.3s cubic-bezier(.2,.8,.2,1)}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-size:2.4rem;font-weight:800}
.rtitle{font-size:1.7rem;font-weight:700;margin-bottom:.3rem}
.rsub{color:var(--muted);margin-bottom:1.4rem}
.rstats{display:flex;gap:.6rem;justify-content:center;margin-bottom:1.6rem;flex-wrap:wrap}
.btns{display:flex;gap:.8rem;justify-content:center;flex-wrap:wrap;align-items:center}
.btn2{padding:.8rem 1.5rem;border-radius:999px;font-weight:600;background:var(--surface2);border:1px solid var(--line);transition:.2s}
.btn2:hover{transform:translateY(-2px);border-color:var(--accent)}
.review{margin-top:1.8rem;text-align:left}
.review h3{margin-bottom:.8rem;font-size:1.2rem}
.ri{padding:.9rem 1.1rem;border-radius:.9rem;background:var(--surface2);border:1px solid var(--line);margin-bottom:.6rem}
.ri .rq{font-weight:650;margin-bottom:.4rem}
.ri .you{color:var(--bad);font-weight:500}
.ri .rig{color:var(--ok);font-weight:700}
canvas#conf{position:fixed;inset:0;pointer-events:none;z-index:40}


.rt .pg{display:block;height:3px;border-radius:3px;background:var(--line);margin:.5rem .7rem 0;overflow:hidden}
.rt .pg b{display:block;height:100%;width:var(--p);background:var(--ok);border-radius:3px}
.rt.basket{grid-column:1/-1;display:flex;justify-content:center;align-items:center;gap:.7rem;font-size:1.05rem;padding:.8rem;background:color-mix(in srgb,var(--c2) 15%,var(--surface2));border-color:color-mix(in srgb,var(--c2) 55%,var(--line))}
.rt.basket small{display:inline;margin:0;font-size:.9rem;color:var(--text)}
.rt.basket.sel{background:color-mix(in srgb,var(--c2) 22%,var(--surface));border-color:var(--c2)}
.chip.rep{color:var(--accent)}
.reset{margin-top:1.2rem;font-size:.85rem;color:var(--muted);text-decoration:underline;padding:.4rem}
.reset:hover{color:var(--text)}
@media(max-width:900px){.ranges{grid-template-columns:repeat(4,1fr)}.opts.tiles .opt{flex-basis:calc(50% - .45rem)}}
@media(max-width:560px){
  html{font-size:17px}
  .start{padding:1.6rem .9rem}.qcard{padding:1.3rem .9rem}
  .ranges{grid-template-columns:repeat(3,1fr)}
  .opt{padding:.85rem .8rem;gap:.7rem}
  .opts.tiles .opt{flex-basis:100%;min-height:0}
}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="intro" role="presentation">
  <div class="who" id="who"></div>
  <div class="rule"></div>
  <div class="cap">Менеджмент квизі</div>
</div>
<canvas id="conf"></canvas>

<div class="app">
  <div class="head">
    <div class="brand">🎓 Менеджмент</div>
    <div class="spacer"></div>
    <button class="ibtn" id="layoutBtn"></button>
    <button class="ibtn" id="themeBtn"></button>
  </div>

  <!-- START -->
  <section id="start" class="panel start">
    <h1>Қай аралықты жаттаймыз?</h1>
    <p class="sub">Аралықты таңда — сұрақтар сол аралықтың ішінде араласып келеді. Жаттап алған соң келесісін таңда.</p>
    <div class="ranges" id="ranges"></div>
    <div class="sep"></div>
    <div class="lbl">Жауаптар қалай көрінсін?</div>
    <div class="layouts" id="layouts"></div>
    <label class="toggle"><input type="checkbox" id="autoChk" checked> Жауаптан кейін келесі сұраққа өзі өтсін</label><br>
    <button class="cta" id="goBtn">Бастау</button><br>
    <button class="reset" id="resetBtn">Прогресті өшіру</button>
  </section>

  <!-- QUIZ -->
  <section id="quiz" class="hidden">
    <div class="top">
      <div class="chip" id="cnt">1 / 1</div>
      <div class="chip ok">✓ <span id="okN">0</span></div>
      <div class="chip bad">✗ <span id="noN">0</span></div>
      <div class="chip streak hidden" id="streakChip">🔥 <span id="stN">0</span></div>
      <div class="chip rep hidden" id="repChip">↺ қайталау</div>
      <div class="spacer"></div>
      <button class="ibtn" id="autoBtn">⏸</button>
      <button class="ibtn" id="homeBtn" title="Аралық таңдауға оралу" aria-label="Аралық таңдауға оралу">✕</button>
    </div>
    <div class="pbar"><i id="bar"></i></div>
    <div class="panel qcard" id="card"></div>
  </section>

  <!-- RESULT -->
  <section id="result" class="panel result hidden"></section>
</div>

/* ---------- themes & layout ---------- */
const THEMES = [['dark','🌙','Қара тақырып'],['white','☀️','Ақ тақырып'],['milk','🥛','Сүтті тақырып']];
let themeIdx = Math.max(0, THEMES.findIndex(t => t[0] === store.get('mgmt_theme')));
let layout = store.get('mgmt_layout') === 'tiles' ? 'tiles' : 'list';
function applyTheme(){ document.documentElement.dataset.theme = THEMES[themeIdx][0]; $('themeBtn').textContent = THEMES[themeIdx][1]; $('themeBtn').title = THEMES[themeIdx][2] + ' (басып ауыстыр)'; $('themeBtn').setAttribute('aria-label', THEMES[themeIdx][2]); }
$('themeBtn').onclick = () => { themeIdx = (themeIdx + 1) % THEMES.length; store.set('mgmt_theme', THEMES[themeIdx][0]); applyTheme(); };
function applyLayout(){
  $('layoutBtn').textContent = layout === 'tiles' ? '▦' : '☰'; $('layoutBtn').title = layout === 'tiles' ? 'Плитка көрінісі (басып тізімге ауыстыр)' : 'Тізім көрінісі (басып плиткаға ауыстыр)'; $('layoutBtn').setAttribute('aria-label', $('layoutBtn').title);
  document.querySelectorAll('.opts').forEach(o => o.classList.toggle('tiles', layout === 'tiles'));
  document.querySelectorAll('.lt').forEach(b => b.classList.toggle('sel', b.dataset.v === layout));
}
$('layoutBtn').onclick = () => { layout = layout === 'tiles' ? 'list' : 'tiles'; store.set('mgmt_layout', layout); applyLayout(); };
applyTheme();

/* layout picker tiles */
[['list','Тізім',4],['tiles','Плитка',5]].forEach(([v, name, cnt]) => {
  const b = document.createElement('button'); b.className = 'lt'; b.dataset.v = v;
  b.innerHTML = '<div class="pv ' + v + '">' + '<b></b>'.repeat(cnt) + '</div><span>' + name + '</span>';
  b.onclick = () => { layout = v; store.set('mgmt_layout', v); applyLayout(); };
  $('layouts').appendChild(b);
});

/* ---------- ranges ---------- */
ALL.forEach((q, i) => q.id = i);
let P = {}; try { P = JSON.parse(store.get('mgmt_prog') || '{}') || {}; } catch (e) { P = {}; }
const saveP = () => store.set('mgmt_prog', JSON.stringify(P));   // P[id] = [қатарынан дұрыс, қате саны]
const basketQs = () => ALL.filter(q => { const p = P[q.id]; return p && p[1] > 0 && p[0] < 2; });
const rangeMastered = i => { let m = 0; for (let k = ranges[i].s; k < ranges[i].e; k++) { const p = P[k]; if (p && p[0] >= 2) m++; } return m; };
const ranges = Array.from({length: Math.ceil(N / SIZE)}, (_, i) => ({ s: i*SIZE, e: Math.min(i*SIZE + SIZE, N) }));
let sel = 0; // index, -1 = all, -2 = қателер қоржыны
{ const first = ranges.findIndex((r, i) => rangeMastered(i) < r.e - r.s); sel = first >= 0 ? first : 0; }
function drawRanges(){
  const box = $('ranges'); box.innerHTML = '';
  const bq = basketQs();
  if (sel === -2 && !bq.length) sel = 0;
  if (bq.length) {
    const b = document.createElement('button');
    b.className = 'rt basket' + (sel === -2 ? ' sel' : '');
    b.innerHTML = '<span>🧺 Қателер қоржыны</span><small>' + bq.length + ' сұрақ</small>';
    b.onclick = () => { sel = -2; drawRanges(); };
    box.appendChild(b);
  }
  let totalM = 0;
  ranges.forEach((r, i) => {
    const size = r.e - r.s, m = rangeMastered(i); totalM += m;
    const b = document.createElement('button');
    b.className = 'rt' + (i === sel ? ' sel' : '') + (m === size ? ' done' : '');
    b.innerHTML = '<span>' + (r.s+1) + '–' + r.e + '</span><small>' + m + ' / ' + size + '</small><i class="pg" style="--p:' + (m/size*100) + '%"><b></b></i>';
    b.onclick = () => { sel = i; drawRanges(); };
    box.appendChild(b);
  });
  const all = document.createElement('button');
  all.className = 'rt' + (sel === -1 ? ' sel' : '') + (totalM === N ? ' done' : '');
  all.innerHTML = '<span>Барлығы</span><small>' + totalM + ' / ' + N + '</small><i class="pg" style="--p:' + (totalM/N*100) + '%"><b></b></i>';
  all.onclick = () => { sel = -1; drawRanges(); };
  box.appendChild(all);
  const lab = sel === -2 ? '🧺 ' + bq.length : sel === -1 ? 'барлығы' : (ranges[sel].s+1) + '–' + ranges[sel].e;
  $('goBtn').innerHTML = '<span>▶ Бастау</span><em>' + lab + '</em>';
}

let S = { queue:[], i:0, ok:0, no:0, streak:0, maxStreak:0, mistakes:[], answered:false, auto:true, timer:null, n:0, locked:false, mode:'all', r:-1 };

function show(id){ ['start','quiz','result'].forEach(x => $(x).classList.toggle('hidden', x!==id)); window.scrollTo({top:0}); }
function goHome(){ clearTimeout(S.timer); drawRanges(); show('start'); }

function begin(list, mode, r){
  S = { queue:list, i:0, ok:0, no:0, streak:0, maxStreak:0, mistakes:[], answered:false, auto:$('autoChk').checked, timer:null, n:list.length, locked:false, mode, r, seen:new Set() };
  show('quiz'); updateAutoBtn(); render();
}
function startSelected(){
  if (sel === -2) begin(shuffle(basketQs()), 'basket', -1);
  else if (sel === -1) begin(shuffle(ALL), 'all', -1);
  else begin(shuffle(ALL.slice(ranges[sel].s, ranges[sel].e)), 'range', sel);
}
$('goBtn').onclick = startSelected;
$('homeBtn').onclick = goHome;

function updateAutoBtn(){ $('autoBtn').textContent = S.auto ? '⏸' : '▶'; $('autoBtn').title = S.auto ? 'Автоөтуді тоқтату' : 'Автоөтуді қосу'; }
$('autoBtn').onclick = () => {
  S.auto = !S.auto; updateAutoBtn();
  if (S.answered) {
    clearTimeout(S.timer);
    const f = document.querySelector('.next .fill');
    if (f) { f.style.transition='none'; f.style.width='0'; }
    if (S.auto) schedule(1200);
  }
};

/* ---------- question ---------- */
function render(){
  clearTimeout(S.timer);
  const q = S.queue[S.i];
  S.answered = false; S.locked = false;
  const opts = shuffle([{t:q.c, ok:true}, ...q.o.map(t => ({t, ok:false}))]);
  S.cur = opts;
  const isRep = S.seen.has(q.id); S.seen.add(q.id); $('repChip').classList.toggle('hidden', !isRep);
  $('cnt').textContent = (S.i+1) + ' / ' + S.n;
  $('okN').textContent = S.ok; $('noN').textContent = S.no;
  $('bar').style.width = (S.i / S.n * 100) + '%';
  $('streakChip').classList.toggle('hidden', S.streak < 2); $('stN').textContent = S.streak;

  const card = $('card');
  card.style.animation = 'none'; void card.offsetWidth; card.style.animation = '';
  card.innerHTML = '';
  const qt = document.createElement('div'); qt.className='qtext'; qt.textContent = q.q.replace(/\s*\n\s*/g,' ');
  const box = document.createElement('div'); box.className = 'opts' + (layout === 'tiles' ? ' tiles' : '');
  opts.forEach((o, idx) => {
    const b = document.createElement('button');
    b.className = 'opt'; b.style.setProperty('--bc', `var(--c${idx})`);
    b.innerHTML = '<span class="let"></span><span class="t"></span><span class="mark"></span>';
    b.querySelector('.let').textContent = LETTERS[idx];
    b.querySelector('.t').textContent = o.t;
    b.onclick = () => pick(idx);
    box.appendChild(b);
  });
  const fb = document.createElement('div'); fb.id='fb';
  const nw = document.createElement('div'); nw.className='nextwrap'; nw.id='nw';
  card.append(qt, box, fb, nw);
}

function pick(idx){
  if (S.answered) return;
  S.answered = true;
  const q = S.queue[S.i], o = S.cur[idx];
  let [ps, pw] = P[q.id] || [0, 0];
  if (o.ok) ps++; else { ps = 0; pw++; }
  P[q.id] = [ps, pw]; saveP();
  // қате болса 4–6 сұрақтан кейін қайтады; бұрын қателескен сұрақ дұрыс болса, 2-ге жеткенше тағы бір рет
  const gap = o.ok ? (pw > 0 && ps < 2 ? 6 + (Math.random()*3|0) : -1) : 4 + (Math.random()*3|0);
  if (gap > 0) { S.queue.splice(Math.min(S.queue.length, S.i + 1 + gap), 0, q); S.n = S.queue.length; }
  document.querySelectorAll('.opt').forEach((b, k) => {
    b.disabled = true;
    if (S.cur[k].ok) { b.classList.add('correct'); b.querySelector('.mark').textContent = '✅'; }
    else if (k === idx) { b.classList.add('wrong'); b.querySelector('.mark').textContent = '❌'; }
    else b.classList.add('dim');
  });
  const fb = $('fb');
  if (o.ok) {
    S.ok++; S.streak++; S.maxStreak = Math.max(S.maxStreak, S.streak);
    const praise = ['Дұрыс!','Тамаша!','Керемет!','Дәл тап!','Өте жақсы!'];
    fb.className = 'fb ok'; fb.textContent = '✓ ' + praise[Math.random()*praise.length|0];
    if (S.streak >= 3) fb.textContent += '  Қатарынан ' + S.streak;
  } else {
    S.no++; S.streak = 0; S.mistakes.push({ q, chosen:o.t });
    fb.className = 'fb no'; fb.textContent = '✗ Қате. Дұрыс жауап жасыл түспен белгіленді';
  }
  $('okN').textContent = S.ok; $('noN').textContent = S.no;
  $('streakChip').classList.toggle('hidden', S.streak < 2); $('stN').textContent = S.streak;
  $('bar').style.width = ((S.i+1) / S.n * 100) + '%';
  if (gap > 0) fb.textContent += o.ok ? '  ·  бір рет қайта тексереміз' : '  ·  сұрақ кейін қайта шығады';
  const last = S.i === S.n - 1;
  const nb = document.createElement('button'); nb.className='next';
  nb.innerHTML = '<span>' + (last ? 'Нәтижені көру' : 'Келесі') + '</span><i class="fill"></i>';
  nb.onclick = next; $('nw').appendChild(nb);
  if (S.auto) schedule(o.ok ? 1800 : 3400);
}
function schedule(ms){
  clearTimeout(S.timer);
  const f = document.querySelector('.next .fill');
  if (f) { f.style.transition='none'; f.style.width='0'; void f.offsetWidth; f.style.transition='width '+ms+'ms linear'; f.style.width='100%'; }
  S.timer = setTimeout(next, ms);
}
function next(){
  if (!S.answered || S.locked) return;
  S.locked = true; clearTimeout(S.timer);
  if (S.i >= S.n - 1) return finish();
  S.i++; render();
}
document.addEventListener('keydown', e => {
  if ($('quiz').classList.contains('hidden')) return;
  const k = e.key.toLowerCase();
  if (!S.answered) {
    let idx = '12345'.indexOf(k); if (idx < 0) idx = 'abcde'.indexOf(k);
    if (idx >= 0 && idx < S.cur.length) pick(idx);
  } else if (['enter',' ','arrowright'].includes(k)) { e.preventDefault(); next(); }
});

/* ---------- result ---------- */
function finish(){
  const pct = Math.round(S.ok / Math.max(1, S.ok + S.no) * 100);
  const left = basketQs().length;
  const mchip = (S.mode === 'range' ? '<div class="chip">🧠 Жаттап алынды: ' + rangeMastered(S.r) + ' / ' + (ranges[S.r].e - ranges[S.r].s) + '</div>' : '') + '<div class="chip">🧺 Қоржында: ' + left + '</div>';
  let emoji='💪', title='Тағы бір рет көрейік', sub='Қателерді қайталап шық — келесі жолы шығады.';
  if (pct>=90){emoji='🏆';title='Тамаша нәтиже!';sub='Бұл аралықты жақсы жаттап алдың.';}
  else if (pct>=75){emoji='🌟';title='Өте жақсы!';sub='Аздап қана қалды.';}
  else if (pct>=50){emoji='👍';title='Жаман емес';sub='Қателерді қарап шығып, қайта көр.';}
  const C = 2*Math.PI*80, R = $('result');
  R.innerHTML = `
    <div class="ring">
      <svg width="190" height="190" viewBox="0 0 190 190">
        <circle class="bgc" cx="95" cy="95" r="80" fill="none" stroke-width="16"/>
        <circle class="fgc" cx="95" cy="95" r="80" fill="none" stroke-width="16" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C}"/>
      </svg>
      <div class="pct">${pct}%</div>
    </div>
    <div class="rtitle">${emoji} ${title}</div>
    <div class="rsub">${sub}</div>
    <div class="rstats">
      <div class="chip ok">✓ Дұрыс: ${S.ok}</div>
      <div class="chip bad">✗ Қате: ${S.no}</div>
      <div class="chip streak">🔥 Ең ұзақ серия: ${S.maxStreak}</div>
      ${mchip}
    </div>
    <div class="btns" id="rbtns"></div>
    <div class="review" id="review"></div>`;
  const rb = $('rbtns');
  const mk = (txt, fn, primary) => { const b=document.createElement('button'); b.className = primary ? 'cta' : 'btn2'; b.textContent=txt; b.onclick=fn; rb.appendChild(b); };
  const hasNext = S.mode === 'range' && S.r < ranges.length - 1;
  if (hasNext) {
    const nr = ranges[S.r + 1];
    mk('Келесі аралық: ' + (nr.s+1) + '–' + nr.e, () => { sel = S.r + 1; startSelected(); }, true);
  }
  if (left) mk('🧺 Қателер қоржынын жаттау (' + left + ')', () => { sel = -2; startSelected(); }, !hasNext);
  if (S.mode === 'range') mk('Осы аралықты қайта', () => { sel = S.r; startSelected(); });
  mk('Аралық таңдау', goHome);
  if (S.mistakes.length) {
    const rv = $('review'); rv.innerHTML = '<h3>Қателер тізімі</h3>';
    S.mistakes.forEach((m, k) => {
      const d = document.createElement('div'); d.className = 'ri';
      const a = document.createElement('div'); a.className='rq'; a.textContent = (k+1) + '. ' + m.q.q.replace(/\s*\n\s*/g,' ');
      const b = document.createElement('div'); b.className='you'; b.textContent = '✗ Сенің жауабың: ' + m.chosen;
      const c = document.createElement('div'); c.className='rig'; c.textContent = '✓ Дұрыс жауап: ' + m.q.c;
      d.append(a, b, c); rv.appendChild(d);
    });
  }
  show('result');
  requestAnimationFrame(() => requestAnimationFrame(() => { const fg = R.querySelector('.fgc'); if (fg) fg.style.strokeDashoffset = C * (1 - pct/100); }));
  if (pct >= 80) confetti();
}

/* ---------- confetti ---------- */
function confetti(){
  const cv = $('conf'), ctx = cv.getContext('2d');
  cv.width = innerWidth; cv.height = innerHeight;
  const cols = ['#6d4aff','#0e8aa8','#d97706','#d6246e','#0a9467'];
  const P = Array.from({length:120}, () => ({x:Math.random()*cv.width, y:-20-Math.random()*cv.height*.5, r:4+Math.random()*6, c:cols[Math.random()*5|0], vx:-1.5+Math.random()*3, vy:2+Math.random()*4, rot:Math.random()*6, vr:-.2+Math.random()*.4}));
  let t = 0;
  (function f(){
    ctx.clearRect(0,0,cv.width,cv.height);
    P.forEach(p => { p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; ctx.save(); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c; ctx.fillRect(-p.r/2,-p.r/2,p.r,p.r*1.6); ctx.restore(); });
    if (++t < 220) requestAnimationFrame(f); else ctx.clearRect(0,0,cv.width,cv.height);
  })();
}

let rc = 0;
$('resetBtn').onclick = () => {
  const b = $('resetBtn');
  if (!rc) { rc = 1; b.textContent = 'Шынымен өшіреміз бе? Қайта бас'; setTimeout(() => { rc = 0; b.textContent = 'Прогресті өшіру'; }, 4000); return; }
  P = {}; saveP(); rc = 0; b.textContent = 'Прогресті өшіру'; sel = 0; drawRanges();
};
applyLayout(); drawRanges();
</script>
